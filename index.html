<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>算数やりなおしドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 方眼ノートの上に1列。学年タブ → 単元リスト → 10問ドリル → 赤ペンの採点結果 */
:root{
  --paper:#F6F8F7; --grid:#DFE8EA; --card:#FFFFFF; --soft:#E9EFF6;
  --ink:#1C2B3A; --sub:#5B6B7A; --line:#C6D2D9;
  --ai:#2A4FA8; --ai-fg:#FFFFFF;
  --maru:#D8362F; --batsu:#66727F;
  --f-text:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-math:"Klee One","Hiragino Maru Gothic ProN","Yu Kyokasho","UD Digi Kyokasho N-R",var(--f-text);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B24; --grid:#1D2733; --card:#1B2530; --soft:#243142;
    --ink:#E6ECF2; --sub:#9AA9B8; --line:#394756;
    --ai:#8FB0FF; --ai-fg:#0E1622;
    --maru:#FF6B61; --batsu:#8E9BAA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141B24; --grid:#1D2733; --card:#1B2530; --soft:#243142;
  --ink:#E6ECF2; --sub:#9AA9B8; --line:#394756;
  --ai:#8FB0FF; --ai-fg:#0E1622;
  --maru:#FF6B61; --batsu:#8E9BAA; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; color:var(--ink); font:16px/1.7 var(--f-text);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
main{max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
h1{font:600 1.75rem/1.3 var(--f-math); margin:0; text-wrap:balance}
h2{font:600 1.15rem/1.4 var(--f-math); margin:0}
p{margin:0}
.lead{color:var(--sub); font-size:.95rem}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ai); outline-offset:2px}

/* 学年タブ */
.grades{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.grades button{
  background:var(--card); border:1.5px solid var(--line); border-radius:6px;
  padding:8px 0; font:600 1.05rem var(--f-math);
}
.grades button[aria-pressed="true"]{background:var(--ai); border-color:var(--ai); color:var(--ai-fg)}

/* 単元リスト */
.topics{list-style:none; margin:0; padding:0; background:var(--card); border:1.5px solid var(--line); border-radius:8px; overflow:hidden}
.topics li+li{border-top:1px dashed var(--line)}
.topics button{
  width:100%; background:none; border:0; text-align:left; padding:12px 14px;
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:center;
}
.topics button:hover{background:var(--soft)}
.t-name{font-weight:700; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.t-ex{grid-column:1; color:var(--sub); font:400 .9rem var(--f-math)}
.t-best{grid-row:1 / span 2; grid-column:2; font:600 .9rem var(--f-math); color:var(--sub); white-space:nowrap}
.t-best b{color:var(--maru); font-size:1.15rem}
.chip{font:500 .7rem var(--f-text); letter-spacing:.04em; color:var(--ai); border:1px solid var(--ai); border-radius:99px; padding:0 8px; line-height:1.6}
.mixrow{display:flex; flex-wrap:wrap; gap:10px}
.btn{
  background:var(--card); border:1.5px solid var(--ink); border-radius:6px; padding:10px 18px; font-weight:700;
}
.btn.primary{background:var(--ai); border-color:var(--ai); color:var(--ai-fg)}
.btn.quiet{border-color:var(--line); font-weight:500}

/* ドリル */
.bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.cells{display:flex; gap:3px}
.cells i{width:22px; height:22px; border:1.5px solid var(--line); background:var(--card); display:grid; place-items:center; font:600 .8rem/1 var(--f-math); font-style:normal}
.cells i.now{border-color:var(--ink)}
.cells i.ok{color:var(--maru); border-color:var(--maru)}
.cells i.ng{color:var(--batsu)}
.sheet{background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:20px 18px; display:flex; flex-direction:column; gap:16px; position:relative}
.q-meta{font-size:.8rem; color:var(--sub); letter-spacing:.04em}
.q-text{font:600 1.45rem/1.8 var(--f-math); font-variant-numeric:tabular-nums}
.q-text small{font-size:1rem; font-weight:400}
.fig{display:block; width:100%; max-width:300px; height:auto}
.fig text{font:600 13px var(--f-math); fill:var(--ink)}
.fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; line-height:1.25; margin:0 .15em; font-size:.9em}
.fr span:first-child{border-bottom:2px solid currentColor; padding:0 .25em}
.fr span:last-child{padding:0 .25em}
.answer{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; font:600 1.2rem var(--f-math)}
.answer label{display:inline-flex; align-items:center; gap:6px}
.answer input{
  width:6.5em; font:600 1.3rem var(--f-math); color:var(--ink); text-align:center;
  background:var(--paper); border:1.5px solid var(--ink); border-radius:4px; padding:6px 4px;
}
.fin{display:inline-flex; flex-direction:column; gap:3px; align-items:stretch}
.fin input{width:4.2em; padding:3px 4px}
.fin hr{border:0; border-top:2.5px solid var(--ink); margin:0; width:100%}
.note{font-size:.85rem; color:var(--sub)}
.msg{font-size:.9rem; color:var(--maru); font-weight:700; min-height:1.5em}
.judge{border-top:1px dashed var(--line); padding-top:14px; display:flex; flex-direction:column; gap:8px}
.verdict{font:600 1.2rem var(--f-math); display:flex; align-items:center; gap:10px}
.mark{font:600 2.4rem/1 var(--f-math)}
.mark.ok{color:var(--maru)} .mark.ng{color:var(--batsu)}
.ex{font:400 1.02rem/1.9 var(--f-math); background:var(--soft); border-radius:6px; padding:10px 14px}
.ex b{font-weight:600}
.actions{display:flex; flex-wrap:wrap; gap:10px}

.sys{display:inline-flex; flex-direction:column; border-left:2px solid currentColor; border-radius:8px 0 0 8px; padding-left:.6em; line-height:1.6}
.choices{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; width:100%}
.choices button{background:var(--paper); color:var(--ink); border:1.5px solid var(--ink); border-radius:4px; padding:10px 12px; font:600 1.1rem var(--f-math); text-align:left; min-width:0}
.choices button[aria-pressed="true"]{background:var(--ai); border-color:var(--ai); color:var(--ai-fg)}
.choices button:disabled{cursor:default; opacity:1}
.choices button.right{outline:3px solid var(--maru); outline-offset:1px}
@media (max-width:420px){.choices{grid-template-columns:minmax(0,1fr)}}

/* 時間制限 */
.limit{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; font-weight:700}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{background:var(--card); border:1.5px solid var(--line); border-radius:6px; padding:5px 14px; font:600 .95rem var(--f-math)}
.seg button[aria-pressed="true"]{background:var(--ai); border-color:var(--ai); color:var(--ai-fg)}
.timerrow{display:flex; align-items:center; gap:12px}
.timer{flex:1; min-width:0; height:8px; background:var(--soft); border-radius:4px; overflow:hidden}
.timer i{display:block; height:100%; width:100%; background:var(--ai)}
.timerrow.low .timer i{background:var(--maru)}
.t-left{font:600 .95rem var(--f-math); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:5.5em; text-align:right}
.timerrow.low .t-left{color:var(--maru)}

/* 結果 */
.score{font:600 3.4rem/1.1 var(--f-math); color:var(--maru)}
.score small{font-size:1.3rem; color:var(--ink)}
.review{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.review li{display:grid; grid-template-columns:1.8em minmax(0,1fr); gap:6px; padding:10px 0; border-top:1px dashed var(--line); font:400 1rem/1.8 var(--f-math)}
.review .mark{font-size:1.4rem; line-height:1.4}
.review .a{color:var(--sub)}
.review .a b{color:var(--ink)}
@media (max-width:420px){
  .q-text{font-size:1.25rem}
  .cells i{width:19px; height:19px}
}
@media (prefers-reduced-motion:no-preference){
  .mark.pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(1.6); opacity:.3} to{transform:none; opacity:1}}
}

/* RPG */
.status{background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.st-main{font:600 1.1rem var(--f-math)}
.st-main b{font-size:1.4rem; color:var(--ai)}
.xp{height:8px; background:var(--soft); border-radius:4px; overflow:hidden}
.xp i{display:block; height:100%; background:var(--ai)}
.st-sub{font-size:.85rem; color:var(--sub)}
.topics button{grid-template-columns:auto minmax(0,1fr) auto}
.topics .t-ex,.topics .t-best{grid-column:auto; grid-row:auto}
.t-body{display:flex; flex-direction:column; min-width:0}
.spr{width:44px; height:44px; image-rendering:pixelated; display:block}
.btn.boss{text-align:left; display:flex; flex-direction:column}
.btn.boss small{font-weight:400; font-size:.8rem}
.battle{background:var(--card); border:1.5px solid var(--ink); border-radius:8px; padding:14px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 14px; align-items:center}
.battle img{width:96px; height:96px; image-rendering:pixelated; grid-row:1 / span 2}
.b-name{font:600 1.2rem var(--f-math); align-self:end}
.b-hp{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font:600 .9rem var(--f-math); font-variant-numeric:tabular-nums; align-self:start}
.b-log{grid-column:1 / -1; font:600 1rem var(--f-math); min-height:1.7em}
.b-me{grid-column:1 / -1; border-top:1px dashed var(--line); padding-top:8px}
.hp{display:inline-flex; gap:2px}
.hp i{width:13px; height:12px; border:1.5px solid var(--ink)}
.hp.foe i.on{background:var(--ai)}
.hp.me i.on{background:var(--maru)}
.r-head{font:600 1.5rem/1.4 var(--f-math)}
.r-head.win{color:var(--maru)}
.r-xp{font:600 1rem var(--f-math)}
.score{font-size:2.2rem}
@media (max-width:420px){.battle img{width:80px; height:80px}}
@media (prefers-reduced-motion:no-preference){
  .hit{animation:hit .35s steps(4)}
  .hurt{animation:hurt .35s steps(4)}
  @keyframes hit{0%,100%{transform:none; opacity:1} 25%{transform:translateX(6px); opacity:.2} 50%{transform:translateX(-6px); opacity:1} 75%{transform:translateX(4px); opacity:.2}}
  @keyframes hurt{0%,100%{transform:none} 25%{transform:translateX(-5px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-3px)}}
}
</style>

<main>
  <section id="home">
    <div style="display:flex;flex-direction:column;gap:20px">
      <header>
        <h1>算数・数学やりなおしドリル</h1>
        <p class="lead">小1〜中3の単元がモンスターになりました。正解するとダメージを与え、まちがえると HP がへります。数字は毎回変わります。</p>
      </header>
      <div class="status" id="status"></div>
      <div class="grades" id="grades" role="group" aria-label="学年"></div>
      <div class="limit"><span id="limitLabel">1問の時間制限</span><div class="seg" id="limit" role="group" aria-labelledby="limitLabel"></div></div>
      <h2 class="area" id="area"></h2>
      <ul class="topics" id="topics"></ul>
      <div class="mixrow">
        <button class="btn boss" id="mixGrade"></button>
        <button class="btn boss primary" id="mixAll"></button>
      </div>
      <p class="note">モンスターは HP 7、ボスは HP 10 以上。こちらの HP が先に 0 になると負けです。時間切れも 1 ミスになります。小学校の「中学で必須」の単元は、正負の数・方程式・比例・関数でそのまま使います。</p>
    </div>
  </section>

  <section id="drill" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <h2 id="dTitle"></h2>
      <div class="battle" id="battle">
        <img id="bImg" alt="">
        <div class="b-name" id="bName"></div>
        <div class="b-hp" id="bEhp"></div>
        <div class="b-log" id="bLog" role="status"></div>
        <div class="b-hp b-me" id="bPhp"></div>
      </div>
      <form class="sheet" id="sheet" autocomplete="off">
        <div class="q-meta" id="qMeta"></div>
        <div class="timerrow" id="tRow" hidden><div class="timer"><i id="tBar"></i></div><span class="t-left" id="tLeft"></span></div>
        <div class="q-text" id="qText"></div>
        <div id="qFig"></div>
        <div class="answer" id="qAns"></div>
        <div class="note" id="qNote"></div>
        <div class="msg" id="qMsg" role="status"></div>
        <div class="actions" id="qActions">
          <button class="btn primary" type="submit" id="btnCheck">こうげき(答え合わせ)</button>
        </div>
        <div class="judge" id="judge" hidden>
          <div class="verdict"><span class="mark" id="jMark"></span><span id="jText"></span></div>
          <div class="ex" id="jEx"></div>
          <div class="actions"><button class="btn primary" type="button" id="btnNext">次の問題</button></div>
        </div>
      </form>
      <div><button class="btn quiet" type="button" id="btnQuit">にげる</button></div>
    </div>
  </section>

  <section id="result" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <h2 id="rTitle"></h2>
      <div class="sheet">
        <div class="r-head" id="rHead"></div>
        <p class="r-xp" id="rXp"></p>
        <div class="score" id="rScore"></div>
        <p id="rComment"></p>
        <ul class="review" id="rList"></ul>
      </div>
      <div class="actions">
        <button class="btn primary" id="btnRetry">まちがえた問題で とっくん</button>
        <button class="btn" id="btnAgain">もう一度たたかう</button>
        <button class="btn quiet" id="btnHome">マップにもどる</button>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
"use strict";
/* ---------- 道具 ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const fm=x=>String(parseFloat(x.toFixed(6)));
const F=(n,d)=>typeof n==='number'&&n<0?'−'+F(-n,d):d===1?String(n):'<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';
const red=(n,d)=>{const g=gcd(n,d);return [n/g,d/g]};
const N=(ans,post,pre)=>({k:'n',ans:ans,post:post||'',pre:pre||''});
const Q=(n,d,post,pre)=>{const r=red(n,d);return {k:'f',ans:r,post:post||'',pre:pre||''}};
const properFrac=maxd=>{let d,n;do{d=ri(2,maxd);n=ri(1,d-1)}while(gcd(n,d)!==1);return [n,d]};
const anyFrac=()=>{let d,n;do{d=ri(2,9);n=ri(1,9)}while(gcd(n,d)!==1);return [n,d]};
const coprimePair=(lo,hi)=>{let m,n;do{m=ri(lo,hi);n=ri(lo,hi)}while(m===n||gcd(m,n)!==1);return [m,n]};
const BOX='<span aria-label="しかく">□</span>';

/* 図: 単位座標(yは上向き)の多角形を枠に合わせて縮尺どおりにかく */
function fig(pts,dashes,labels,circle){
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minx=Math.min.apply(null,xs),w=Math.max.apply(null,xs)-minx,h=Math.max.apply(null,ys);
  const s=Math.min(190/w,100/h),ox=(300-w*s)/2-minx*s,oy=128;
  const X=x=>(ox+x*s).toFixed(1),Y=y=>(oy-y*s).toFixed(1);
  let o='<svg class="fig" viewBox="0 0 300 160" role="img" aria-label="図">';
  if(circle) o+='<circle cx="'+X(circle[0])+'" cy="'+Y(circle[1])+'" r="'+(circle[2]*s).toFixed(1)+'" fill="var(--soft)" stroke="var(--ink)" stroke-width="2"/>';
  else o+='<polygon points="'+pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')+'" fill="var(--soft)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
  (dashes||[]).forEach(d=>{o+='<line x1="'+X(d[0])+'" y1="'+Y(d[1])+'" x2="'+X(d[2])+'" y2="'+Y(d[3])+'" stroke="var(--ai)" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>'});
  (labels||[]).forEach(l=>{o+='<text x="'+(+X(l[0])+(l[3]||0))+'" y="'+(+Y(l[1])+(l[4]||0))+'" text-anchor="'+(l[5]||'middle')+'">'+l[2]+'</text>'});
  return o+'</svg>';
}

/* ---------- 問題ジェネレーター ---------- */
const G={};

/* 小1 */
G.add1=()=>{const a=ri(2,9),b=ri(11-a,9),k=10-a;
  return {q:a+' + '+b,f:[N(a+b)],ex:a+' はあと '+k+' で 10。'+b+' を '+k+' と '+(b-k)+' に分けて、10 + '+(b-k)+' = <b>'+(a+b)+'</b>'}};
G.sub1=()=>{const a=ri(11,18),b=ri(a-9,9);
  return {q:a+' − '+b,f:[N(a-b)],ex:a+' を 10 と '+(a-10)+' に分ける。10 − '+b+' = '+(10-b)+'、'+(10-b)+' + '+(a-10)+' = <b>'+(a-b)+'</b>'}};
G.three1=()=>{const a=ri(5,12),b=ri(2,8),c=ri(2,Math.min(9,a+b-1));
  if(ri(0,1)) return {q:a+' + '+b+' − '+c,f:[N(a+b-c)],ex:'左から順に計算します。'+a+' + '+b+' = '+(a+b)+'、'+(a+b)+' − '+c+' = <b>'+(a+b-c)+'</b>'};
  const x=ri(11,18),y=ri(2,x-3),z=ri(2,9);
  return {q:x+' − '+y+' + '+z,f:[N(x-y+z)],ex:'左から順に計算します。'+x+' − '+y+' = '+(x-y)+'、'+(x-y)+' + '+z+' = <b>'+(x-y+z)+'</b>'}};

/* 小2 */
G.hissan2=()=>{
  if(ri(0,1)){const a=ri(15,89),b=ri(12,99);
    return {q:a+' + '+b,f:[N(a+b)],ex:'一の位: '+(a%10)+' + '+(b%10)+' = '+(a%10+b%10)+(a%10+b%10>9?'(十の位に1くり上げる)':'')+'。十の位も同じようにたして <b>'+(a+b)+'</b>'}}
  const a=ri(40,150),b=ri(12,a-5);
  return {q:a+' − '+b,f:[N(a-b)],ex:(a%10<b%10?'一の位がひけないので、十の位から1くり下げます。':'位ごとにひきます。')+a+' − '+b+' = <b>'+(a-b)+'</b>。たしかめ: '+(a-b)+' + '+b+' = '+a}};
G.kuku=()=>{const a=pick([3,4,6,6,7,7,8,8,9,9]),b=pick([3,4,6,7,7,8,8,9]);
  if(ri(0,2)) return {q:a+' × '+b,f:[N(a*b)],ex:a+' の段: '+a+' × '+b+' = <b>'+(a*b)+'</b>'};
  return {q:BOX+' × '+b+' = '+a*b,f:[N(a,'',BOX+' =')],ex:b+' の段で '+a*b+' になるのは '+b+' × '+a+'。だから '+BOX+' = <b>'+a+'</b>'}};
G.unit2=()=>{const t=ri(0,4);
  if(t===0){const c=ri(2,15),m=ri(1,9);return {q:c+' cm '+m+' mm = '+BOX+' mm',f:[N(c*10+m,'mm')],ex:'1 cm = 10 mm。'+c+' cm = '+c*10+' mm なので '+c*10+' + '+m+' = <b>'+(c*10+m)+' mm</b>'}}
  if(t===1){const c=ri(2,15),m=ri(1,9);return {q:(c*10+m)+' mm = '+BOX+' cm '+BOX+' mm',f:[N(c,'cm'),N(m,'mm')],ex:'10 mm = 1 cm。'+(c*10+m)+' mm は '+c*10+' mm と '+m+' mm → <b>'+c+' cm '+m+' mm</b>'}}
  if(t===2){const l=ri(1,9),d=ri(1,9);return {q:l+' L '+d+' dL = '+BOX+' dL',f:[N(l*10+d,'dL')],ex:'1 L = 10 dL。'+l*10+' + '+d+' = <b>'+(l*10+d)+' dL</b>'}}
  if(t===3){const l=ri(2,9);return {q:l+' L = '+BOX+' mL',f:[N(l*1000,'mL')],ex:'1 L = 1000 mL。'+l+' × 1000 = <b>'+l*1000+' mL</b>'}}
  const h=ri(1,3),m=ri(5,55);return {q:h+' 時間 '+m+' 分 = '+BOX+' 分',f:[N(h*60+m,'分')],ex:'1 時間 = 60 分。'+h*60+' + '+m+' = <b>'+(h*60+m)+' 分</b>'}};

/* 小3 */
G.divrem=()=>{const d=ri(2,9),q=ri(2,9),r=ri(1,d-1),n=d*q+r;
  return {q:n+' ÷ '+d,f:[N(q),N(r,'','あまり')],
    ex:d+' × '+q+' = '+d*q+'、'+n+' − '+d*q+' = '+r+'。答えは <b>'+q+' あまり '+r+'</b>。あまりはわる数 '+d+' より小さくなります。'}};
G.mul3=()=>{
  if(ri(0,1)){const a=ri(112,899),b=ri(3,9);return {q:a+' × '+b,f:[N(a*b)],
    ex:Math.floor(a/100)*100+' × '+b+' = '+Math.floor(a/100)*100*b+'、'+(a%100)+' × '+b+' = '+(a%100)*b+'。あわせて <b>'+a*b+'</b>'}}
  const a=ri(12,79),b=ri(12,59);return {q:a+' × '+b,f:[N(a*b)],
    ex:a+' × '+(b%10)+' = '+a*(b%10)+'、'+a+' × '+(b-b%10)+' = '+a*(b-b%10)+'。あわせて <b>'+a*b+'</b>'}};
G.box3=()=>{const t=ri(0,4);
  if(t===0){const a=ri(12,60),x=ri(8,70);return {q:BOX+' + '+a+' = '+(a+x),f:[N(x,'',BOX+' =')],ex:'たし算の逆はひき算。'+(a+x)+' − '+a+' = <b>'+x+'</b>'}}
  if(t===1){const a=ri(12,60),x=ri(30,99);return {q:BOX+' − '+a+' = '+(x-a<1?x:x-a),f:[N(x-a<1?x+a:x,'',BOX+' =')],ex:'ひき算の逆はたし算。'+(x-a<1?x:x-a)+' + '+a+' = <b>'+(x-a<1?x+a:x)+'</b>'}}
  if(t===2){const a=ri(3,9),x=ri(4,12);return {q:BOX+' × '+a+' = '+a*x,f:[N(x,'',BOX+' =')],ex:'かけ算の逆はわり算。'+a*x+' ÷ '+a+' = <b>'+x+'</b>'}}
  if(t===3){const a=ri(3,9),b=ri(4,12);return {q:BOX+' ÷ '+a+' = '+b,f:[N(a*b,'',BOX+' =')],ex:'わり算の逆はかけ算。'+b+' × '+a+' = <b>'+a*b+'</b>'}}
  const a=ri(40,99),x=ri(8,a-8);return {q:a+' − '+BOX+' = '+(a-x),f:[N(x,'',BOX+' =')],ex:a+' から何をひくと '+(a-x)+' になるか。'+a+' − '+(a-x)+' = <b>'+x+'</b>'}};
G.unit3=()=>{const t=ri(0,4);
  if(t===0){const k=ri(1,9),m=ri(1,19)*50;return {q:k+' km '+m+' m = '+BOX+' m',f:[N(k*1000+m,'m')],ex:'1 km = 1000 m。'+k*1000+' + '+m+' = <b>'+(k*1000+m)+' m</b>'}}
  if(t===1){const k=ri(1,9),m=ri(1,19)*50;return {q:(k*1000+m)+' m = '+BOX+' km '+BOX+' m',f:[N(k,'km'),N(m,'m')],ex:'1000 m = 1 km。<b>'+k+' km '+m+' m</b>'}}
  if(t===2){const k=ri(1,9),g=ri(1,19)*50;return {q:k+' kg '+g+' g = '+BOX+' g',f:[N(k*1000+g,'g')],ex:'1 kg = 1000 g。'+k*1000+' + '+g+' = <b>'+(k*1000+g)+' g</b>'}}
  if(t===3){const m=ri(1,5),s=ri(5,55);return {q:m+' 分 '+s+' 秒 = '+BOX+' 秒',f:[N(m*60+s,'秒')],ex:'1 分 = 60 秒。'+m*60+' + '+s+' = <b>'+(m*60+s)+' 秒</b>'}}
  const x=ri(2,9);return {q:x+' t = '+BOX+' kg',f:[N(x*1000,'kg')],ex:'1 t = 1000 kg。<b>'+x*1000+' kg</b>'}};
G.fracdec3=()=>{const t=ri(0,3);
  if(t===0){const d=pick([5,7,11]),a=ri(1,d-2),b=ri(1,d-1-a);return {q:F(a,d)+' + '+F(b,d),f:[Q(a+b,d)],ex:'分母が同じなら分子だけたします。'+a+' + '+b+' = '+(a+b)+' → <b>'+F(a+b,d)+'</b>'}}
  if(t===1){const d=pick([5,7,11]),a=ri(1,d-1);return {q:'1 − '+F(a,d),f:[Q(d-a,d)],ex:'1 = '+F(d,d)+' と考えます。'+F(d,d)+' − '+F(a,d)+' = <b>'+F(d-a,d)+'</b>'}}
  if(t===2){const x=ri(11,59);return {q:'0.1 を '+BOX+' こ集めた数は '+fm(x/10),f:[N(x,'こ')],ex:fm(x/10)+' は 0.1 の <b>'+x+' こ</b>分(1 は 0.1 が 10 こ)'}}
  const a=ri(2,9),b=ri(11-a,9);return {q:fm(a/10)+' + '+fm(b/10),f:[N((a+b)/10)],ex:'0.1 が '+a+' + '+b+' = '+(a+b)+' こ → <b>'+fm((a+b)/10)+'</b>'}};

/* 小4 */
G.order4=()=>{const t=ri(0,5);
  if(t===0){const a=ri(5,40),b=ri(3,9),c=ri(3,9);return {q:a+' + '+b+' × '+c,f:[N(a+b*c)],ex:'かけ算が先。'+b+' × '+c+' = '+b*c+'、'+a+' + '+b*c+' = <b>'+(a+b*c)+'</b>'}}
  if(t===1){const a=ri(5,20),b=ri(3,15),c=ri(3,9);return {q:'('+a+' + '+b+') × '+c,f:[N((a+b)*c)],ex:'( ) の中が先。'+a+' + '+b+' = '+(a+b)+'、'+(a+b)+' × '+c+' = <b>'+(a+b)*c+'</b>'}}
  if(t===2){const c=ri(3,9),q=ri(3,9),a=ri(q+3,q+40);return {q:a+' − '+c*q+' ÷ '+c,f:[N(a-q)],ex:'わり算が先。'+c*q+' ÷ '+c+' = '+q+'、'+a+' − '+q+' = <b>'+(a-q)+'</b>'}}
  if(t===3){const a=ri(6,9),b=ri(6,9),c=ri(2,5),d=ri(2,5);return {q:a+' × '+b+' − '+c+' × '+d,f:[N(a*b-c*d)],ex:'かけ算を2つとも先に。'+a*b+' − '+c*d+' = <b>'+(a*b-c*d)+'</b>'}}
  if(t===4){const b=ri(3,9),q=ri(3,9),c=ri(3,9),d=ri(3,9);return {q:b*q+' ÷ '+b+' + '+c+' × '+d,f:[N(q+c*d)],ex:'わり算とかけ算が先。'+q+' + '+c*d+' = <b>'+(q+c*d)+'</b>'}}
  const b=ri(20,50),c=ri(5,b-5),a=ri(b-c+5,b-c+60);return {q:a+' − ('+b+' − '+c+')',f:[N(a-(b-c))],ex:'( ) の中が先。'+b+' − '+c+' = '+(b-c)+'、'+a+' − '+(b-c)+' = <b>'+(a-(b-c))+'</b>'}};
G.div4=()=>{const d=ri(12,49),q=ri(3,29),r=ri(0,d-1),n=d*q+r;
  return {q:n+' ÷ '+d+' <small>(あまりがないときは 0)</small>',f:[N(q),N(r,'','あまり')],
    ex:d+' × '+q+' = '+d*q+'、'+n+' − '+d*q+' = '+r+'。答えは <b>'+q+' あまり '+r+'</b>。たしかめ: '+d+' × '+q+' + '+r+' = '+n}};
G.dec4=()=>{const A=ri(11,99)*10,B=ri(101,999);
  if(ri(0,1)) return {q:fm(A/100)+' + '+fm(B/100),f:[N((A+B)/100)],ex:'小数点の位置をそろえて計算。'+fm(A/100)+' は '+(A/100).toFixed(2)+' と考えて <b>'+fm((A+B)/100)+'</b>'};
  const hi=Math.max(A,B),lo=Math.min(A,B);
  return {q:fm(hi/100)+' − '+fm(lo/100),f:[N((hi-lo)/100)],ex:'小数点の位置をそろえて計算。'+(hi/100).toFixed(2)+' − '+(lo/100).toFixed(2)+' = <b>'+fm((hi-lo)/100)+'</b>'}};
G.round4=()=>{const n=ri(12000,98999),t=ri(0,2);
  if(t===0){const a=Math.round(n/1000)*1000;return {q:n+' を四捨五入して、千の位までのがい数にすると?',f:[N(a)],ex:'1つ下の百の位 '+Math.floor(n/100)%10+' を見ます。'+(Math.floor(n/100)%10>=5?'5以上なので切り上げ':'4以下なので切り捨て')+' → <b>'+a+'</b>'}}
  if(t===1){const a=Math.round(n/100)*100;return {q:n+' を四捨五入して、百の位までのがい数にすると?',f:[N(a)],ex:'1つ下の十の位 '+Math.floor(n/10)%10+' を見ます。'+(Math.floor(n/10)%10>=5?'5以上なので切り上げ':'4以下なので切り捨て')+' → <b>'+a+'</b>'}}
  const a=Math.round(n/1000)*1000;return {q:n+' を四捨五入して、上から2けたのがい数にすると?',f:[N(a)],ex:'上から3けた目の '+Math.floor(n/100)%10+' を四捨五入します。'+(Math.floor(n/100)%10>=5?'切り上げ':'切り捨て')+' → <b>'+a+'</b>'}};
G.area4=()=>{const t=ri(0,3);
  if(t===0){const a=ri(3,12),b=ri(a+1,18);return {q:'たて '+a+' cm、横 '+b+' cm の長方形の面積は?',fig:fig([[0,0],[b,0],[b,a],[0,a]],[],[[b/2,0,b+' cm',0,18],[0,a/2,a+' cm',-8,4,'end']]),f:[N(a*b,'cm²')],ex:'長方形の面積 = たて × 横。'+a+' × '+b+' = <b>'+a*b+' cm²</b>'}}
  if(t===1){const a=ri(4,15);return {q:'1辺が '+a+' cm の正方形の面積は?',f:[N(a*a,'cm²')],ex:'正方形の面積 = 1辺 × 1辺。'+a+' × '+a+' = <b>'+a*a+' cm²</b>'}}
  if(t===2){const a=ri(4,12),b=ri(5,18);return {q:'面積が '+a*b+' cm² で、横が '+b+' cm の長方形のたての長さは?',f:[N(a,'cm')],ex:'たて × '+b+' = '+a*b+' なので、'+a*b+' ÷ '+b+' = <b>'+a+' cm</b>'}}
  const x=ri(2,9);return {q:x+' m² = '+BOX+' cm²',f:[N(x*10000,'cm²')],ex:'1 m² = 100 cm × 100 cm = 10000 cm²。<b>'+x*10000+' cm²</b>'}};

/* 小5 */
G.decmul5=()=>{
  if(ri(0,1)){let A;do{A=ri(11,99)}while(A%10===0);const B=pick([2,3,4,6,7,8,9,12,15,23,34]);
    return {q:fm(A/10)+' × '+fm(B/10),f:[N(A*B/100)],ex:'整数として '+A+' × '+B+' = '+A*B+'。小数点より下が 1けた + 1けた = 2けたなので <b>'+fm(A*B/100)+'</b>'}}
  const B=pick([2,3,4,5,6,7,8,9,12,15,16,24,25]),Qt=ri(2,60);
  return {q:fm(B*Qt/100)+' ÷ '+fm(B/10),f:[N(Qt/10)],ex:'わる数を整数にするため両方を 10 倍。'+fm(B*Qt/10)+' ÷ '+B+' = <b>'+fm(Qt/10)+'</b>'}};
G.gcdlcm5=()=>{const g=ri(2,9),p=coprimePair(2,7),a=g*p[0],b=g*p[1];
  if(ri(0,1)) return {q:a+' と '+b+' の最大公約数は?',f:[N(g)],ex:a+' = '+g+' × '+p[0]+'、'+b+' = '+g+' × '+p[1]+'。両方をわりきれるいちばん大きい数は <b>'+g+'</b>'};
  return {q:a+' と '+b+' の最小公倍数は?',f:[N(lcm(a,b))],ex:a+' = '+g+' × '+p[0]+'、'+b+' = '+g+' × '+p[1]+'。'+g+' × '+p[0]+' × '+p[1]+' = <b>'+lcm(a,b)+'</b>'}};
G.fracadd5=()=>{let x,y,op,raw,L;
  do{x=properFrac(12);y=properFrac(12);op=pick(['+','−']);L=lcm(x[1],y[1]);raw=x[0]*L/x[1]+(op==='+'?1:-1)*y[0]*L/y[1]}while(x[1]===y[1]||raw<=0||L>72);
  const r=red(raw,L);
  return {q:F(x[0],x[1])+' '+op+' '+F(y[0],y[1]),f:[Q(raw,L)],
    ex:'分母を '+x[1]+' と '+y[1]+' の最小公倍数 '+L+' にそろえます(通分)。'+F(x[0]*L/x[1],L)+' '+op+' '+F(y[0]*L/y[1],L)+' = '+F(raw,L)+(r[1]!==L?' = <b>'+F(r[0],r[1])+'</b>(約分)':' → <b>'+F(raw,L)+'</b>')}};
G.percent5=()=>{const t=ri(0,4);
  if(t===0){const a=ri(2,50)*100,p=pick([5,8,10,15,20,25,30,40,60,75]);return {q:a+' 円の '+p+' % は何円?',f:[N(a*p/100,'円')],ex:p+' % = '+fm(p/100)+'。'+a+' × '+fm(p/100)+' = <b>'+a*p/100+' 円</b>'}}
  if(t===1){const b=pick([20,40,60,80,200,500]),p=ri(1,19)*5,a=b*p/100;return {q:b+' 人のうち '+a+' 人は、全体の何 % ?',f:[N(p,'%')],ex:'割合 = くらべる量 ÷ もとにする量。'+a+' ÷ '+b+' = '+fm(a/b)+' → <b>'+p+' %</b>'}}
  if(t===2){const a=ri(5,60)*100,p=pick([10,15,20,25,30,40]);return {q:'定価 '+a+' 円の品物を '+p+' % 引きで買うと何円?',f:[N(a*(100-p)/100,'円')],ex:p+' % 引き → 定価の '+(100-p)+' %。'+a+' × '+fm((100-p)/100)+' = <b>'+a*(100-p)/100+' 円</b>'}}
  if(t===3){const b=pick([40,60,80,120,200,300]),p=pick([5,10,15,20,25,30,40,50,60,75]),a=b*p/100;return {q:BOX+' 人の '+p+' % が '+a+' 人です。'+BOX+' は?',f:[N(b,'人')],ex:'もとにする量 = くらべる量 ÷ 割合。'+a+' ÷ '+fm(p/100)+' = <b>'+b+' 人</b>'}}
  const x=ri(3,149);return ri(0,1)?{q:fm(x/100)+' を百分率で表すと?',f:[N(x,'%')],ex:'100 倍して % をつけます。'+fm(x/100)+' × 100 = <b>'+x+' %</b>'}
    :{q:x+' % を小数で表すと?',f:[N(x/100)],ex:'100 でわります。'+x+' ÷ 100 = <b>'+fm(x/100)+'</b>'}};
G.avg5=()=>{
  if(ri(0,2)===0){const m=ri(62,88),n=ri(4,6);return {q:n+' 回のテストの平均が '+m+' 点でした。合計は何点?',f:[N(m*n,'点')],ex:'合計 = 平均 × 個数。'+m+' × '+n+' = <b>'+m*n+' 点</b>'}}
  const n=ri(4,5),m=ri(60,88);let v,last;
  do{v=[];let s=0;for(let i=0;i<n-1;i++){const d=ri(-9,9);v.push(m+d);s+=d}last=-s}while(Math.abs(last)>12);
  v.push(m+last);
  return {q:v.join(' 点、')+' 点の平均は?',f:[N(m,'点')],ex:'平均 = 合計 ÷ 個数。合計 '+v.reduce((a,b)=>a+b,0)+' ÷ '+n+' = <b>'+m+' 点</b>'}};
G.speed5=()=>{const t=ri(0,4);
  if(t===0){const v=ri(6,16)*5,h=ri(2,5);return {q:'時速 '+v+' km で '+h+' 時間走ると、何 km 進む?',f:[N(v*h,'km')],ex:'道のり = 速さ × 時間。'+v+' × '+h+' = <b>'+v*h+' km</b>'}}
  if(t===1){const v=ri(6,16)*5,h=ri(2,5);return {q:v*h+' km を '+h+' 時間で走る車の速さは時速何 km ?',f:[N(v,'km','時速')],ex:'速さ = 道のり ÷ 時間。'+v*h+' ÷ '+h+' = <b>時速 '+v+' km</b>'}}
  if(t===2){const v=pick([60,70,80,150,200,250]),m=ri(6,25);return {q:v*m+' m を分速 '+v+' m で進むと何分かかる?',f:[N(m,'分')],ex:'時間 = 道のり ÷ 速さ。'+v*m+' ÷ '+v+' = <b>'+m+' 分</b>'}}
  if(t===3){const v=pick([3,6,12,18,30,36,48,60,72,90]);return {q:'時速 '+v+' km は分速何 m ?',f:[N(v*1000/60,'m','分速')],ex:v+' km = '+v*1000+' m を 60 分で進むので、'+v*1000+' ÷ 60 = <b>分速 '+v*1000/60+' m</b>'}}
  const a=pick([5,10,15,20,25]);return {q:'秒速 '+a+' m は時速何 km ?',f:[N(a*3.6,'km','時速')],ex:'1 時間 = 3600 秒。'+a+' × 3600 = '+a*3600+' m = <b>時速 '+fm(a*3.6)+' km</b>'}};
G.area5=()=>{const t=ri(0,4);
  if(t===0){const b=ri(5,16),h=ri(4,12),ax=b*0.35;return {q:'底辺 '+b+' cm、高さ '+h+' cm の三角形の面積は?',fig:fig([[0,0],[b,0],[ax,h]],[[ax,0,ax,h]],[[b/2,0,b+' cm',0,18],[ax,h/2,h+' cm',8,4,'start']]),f:[N(b*h/2,'cm²')],ex:'三角形の面積 = 底辺 × 高さ ÷ 2。'+b+' × '+h+' ÷ 2 = <b>'+fm(b*h/2)+' cm²</b>'}}
  if(t===1){const b=ri(5,16),h=ri(4,11),s=h*0.45;return {q:'底辺 '+b+' cm、高さ '+h+' cm の平行四辺形の面積は?',fig:fig([[0,0],[b,0],[b+s,h],[s,h]],[[s,0,s,h]],[[b/2,0,b+' cm',0,18],[s,h/2,h+' cm',8,4,'start']]),f:[N(b*h,'cm²')],ex:'平行四辺形の面積 = 底辺 × 高さ。'+b+' × '+h+' = <b>'+b*h+' cm²</b>'}}
  if(t===2){const a=ri(3,9),b=ri(a+2,16),h=ri(4,10),o=(b-a)*0.3;return {q:'上底 '+a+' cm、下底 '+b+' cm、高さ '+h+' cm の台形の面積は?',fig:fig([[0,0],[b,0],[o+a,h],[o,h]],[[o,0,o,h]],[[b/2,0,b+' cm',0,18],[o+a/2,h,a+' cm',0,-7],[o,h/2,h+' cm',8,4,'start']]),f:[N((a+b)*h/2,'cm²')],ex:'台形の面積 = (上底 + 下底) × 高さ ÷ 2。('+a+' + '+b+') × '+h+' ÷ 2 = <b>'+fm((a+b)*h/2)+' cm²</b>'}}
  if(t===3){const p=ri(3,8)*2,q=ri(2,6)*2+1;return {q:'対角線が '+p+' cm と '+q+' cm のひし形の面積は?',fig:fig([[0,q/2],[p/2,0],[p,q/2],[p/2,q]],[[0,q/2,p,q/2],[p/2,0,p/2,q]],[[p*0.75,q/2,p+' cm',0,-6],[p/2,q*0.8,q+' cm',8,4,'start']]),f:[N(p*q/2,'cm²')],ex:'ひし形の面積 = 対角線 × 対角線 ÷ 2。'+p+' × '+q+' ÷ 2 = <b>'+p*q/2+' cm²</b>'}}
  const a=ri(25,85),b=ri(25,150-a);return {q:'三角形の2つの角が '+a+'° と '+b+'° のとき、残りの角は何度?',f:[N(180-a-b,'°')],ex:'三角形の3つの角の和は 180°。180 − '+a+' − '+b+' = <b>'+(180-a-b)+'°</b>'}};
G.vol5=()=>{const t=ri(0,2);

G.geo1=()=>{const t=ri(0,4);
  if(t<2){const r=ri(2,12),th=pick([30,45,60,90,120,135,150,180,270]);
    if(t===0){const x=red(2*r*th,360);return {q:'半径 '+r+' cm、中心角 '+th+'° のおうぎ形の弧の長さは?',f:[Q(x[0],x[1],'π cm')],ex:'弧の長さ = 2π × 半径 × 中心角/360。2π × '+r+' × '+F(th,360)+' = <b>'+F(x[0],x[1])+'π cm</b>'}}
    const x=red(r*r*th,360);return {q:'半径 '+r+' cm、中心角 '+th+'° のおうぎ形の面積は?',f:[Q(x[0],x[1],'π cm²')],ex:'面積 = π × 半径² × 中心角/360。π × '+r*r+' × '+F(th,360)+' = <b>'+F(x[0],x[1])+'π cm²</b>'}}
  if(t===2){const r=ri(2,6),h=ri(3,9),x=red(r*r*h,3);return {q:'底面の半径 '+r+' cm、高さ '+h+' cm の円錐の体積は?',f:[Q(x[0],x[1],'π cm³')],ex:'錐の体積 = '+F(1,3)+' × 底面積 × 高さ。'+F(1,3)+' × π × '+r*r+' × '+h+' = <b>'+F(x[0],x[1])+'π cm³</b>'}}
  if(t===3){const r=ri(2,6);if(ri(0,1))return {q:'半径 '+r+' cm の球の表面積は?',f:[N(4*r*r,'π cm²')],ex:'球の表面積 = 4πr²。4 × π × '+r*r+' = <b>'+4*r*r+'π cm²</b>'};
    const x=red(4*r*r*r,3);return {q:'半径 '+r+' cm の球の体積は?',f:[Q(x[0],x[1],'π cm³')],ex:'球の体積 = '+F(4,3)+'πr³。'+F(4,3)+' × π × '+r*r*r+' = <b>'+F(x[0],x[1])+'π cm³</b>'}}
  const a=ri(3,9),h=ri(4,10),x=red(a*a*h,3);return {q:'底面が 1辺 '+a+' cm の正方形で、高さ '+h+' cm の正四角錐の体積は?',f:[Q(x[0],x[1],'cm³')],ex:'錐の体積 = '+F(1,3)+' × 底面積 × 高さ。'+F(1,3)+' × '+a*a+' × '+h+' = <b>'+F(x[0],x[1])+' cm³</b>'}};
G.data1=()=>{const t=ri(0,2),n=t===0?pick([5,7]):t===1?6:ri(5,7),v=[];for(let i=0;i<n;i++)v.push(ri(1,20));
  const s=v.slice().sort((a,b)=>a-b),list='<br>'+v.join('、');
  if(t===0)return {q:'次のデータの中央値は?'+list,f:[N(s[(n-1)/2])],ex:'小さい順にならべると '+s.join('、')+'。まん中('+((n+1)/2)+' 番目)の値は <b>'+s[(n-1)/2]+'</b>'};
  if(t===1)return {q:'次のデータの中央値は?'+list,f:[N((s[2]+s[3])/2)],ex:'小さい順にならべると '+s.join('、')+'。個数が偶数なので、まん中の 2 つ '+s[2]+' と '+s[3]+' の平均 <b>'+fm((s[2]+s[3])/2)+'</b>'};
  return {q:'次のデータの範囲は?'+list,f:[N(s[n-1]-s[0])],ex:'範囲 = 最大値 − 最小値。'+s[n-1]+' − '+s[0]+' = <b>'+(s[n-1]-s[0])+'</b>'}};

/* 中2 */
G.expr2=()=>{const t=ri(0,2);
  if(t===0){const a=nz(-6,6),b=nz(-6,6),c=nz(-6,6),d=nz(-6,6),m=ri(0,1)?1:-1;
    const P=(u,w)=>poly([[u,'x'],[w,'y']]),v=[P(a+c,b+d),P(a-c,b-d),P(a-c,b+d),P(a+c,b-d),P(a+m*c,d-b)];
    const ok=P(a+m*c,b+m*d);
    return {q:'('+P(a,b)+') '+(m>0?'+':'−')+' ('+P(c,d)+') を計算すると?',f:[C(ok,v)],ex:(m>0?'かっこをそのままはずして':'− ( ) は中の符号を全部変えてはずして')+'、同類項をまとめます。'+poly([[a,'x'],[b,'y'],[m*c,'x'],[m*d,'y']])+' = <b>'+ok+'</b>'}}
  if(t===1){const a=nz(-6,6),b=nz(-6,6);
    return {q:poly([[a,'x']])+' × '+(b<0?'('+poly([[b,'xy']])+')':poly([[b,'xy']]))+' を計算すると?',
      f:[C(poly([[a*b,'x²y']]),[poly([[a*b,'xy']]),poly([[a+b,'x²y']]),poly([[a*b,'x²y²']]),poly([[-a*b,'x²y']]),poly([[a+b,'xy']])])],
      ex:'係数どうし、文字どうしをかけます。'+pn(a)+' × '+pn(b)+' = '+sg(a*b)+'、x × xy = x²y → <b>'+poly([[a*b,'x²y']])+'</b>'}}
  const k=nz(-6,6),c=nz(-5,5);
  return {q:poly([[k*c,'x²y']])+' ÷ '+(c<0?'('+poly([[c,'x']])+')':poly([[c,'x']]))+' を計算すると?',
    f:[C(poly([[k,'xy']]),[poly([[k,'x²y']]),poly([[k,'xy²']]),poly([[-k,'xy']]),poly([[k,'x']]),poly([[k*c,'xy']])])],
    ex:'分数の形にして約分します。係数は '+pn(k*c)+' ÷ '+pn(c)+' = '+sg(k)+'、文字は x²y ÷ x = xy → <b>'+poly([[k,'xy']])+'</b>'}};
G.sim2=()=>{const x=nz(-6,6),y=nz(-6,6),sys=(l1,l2)=>'<span class="sys"><span>'+l1+'</span><span>'+l2+'</span></span>';
  if(ri(0,2)===0){let a,b,m;do{a=nz(-4,4);b=nz(-4,4);m=nz(-3,3)}while(a+b*m===0);const k=y-m*x,c=a*x+b*y;
    return {q:sys(poly([[a,'x'],[b,'y']])+' = '+sg(c),'y = '+poly([[m,'x'],[k,'']])),f:[N(x,'','x ='),N(y,'','y =')],
      ex:'下の式を上の式に代入します(代入法)。'+poly([[a,'x']])+' '+(b>0?'+ ':'− ')+(A(b)===1?'':A(b))+'('+poly([[m,'x'],[k,'']])+') = '+sg(c)+' → '+poly([[a+b*m,'x']])+' = '+sg(c-b*k)+'。x = <b>'+sg(x)+'</b>、y = <b>'+sg(y)+'</b>'}}
  let a1,b1,a2,b2;do{a1=nz(-5,5);b1=nz(-5,5);a2=nz(-5,5);b2=nz(-5,5)}while(a1*b2-a2*b1===0);
  const c1=a1*x+b1*y,c2=a2*x+b2*y,D=b1*a2-b2*a1,E=c1*a2-c2*a1;
  return {q:sys(poly([[a1,'x'],[b1,'y']])+' = '+sg(c1),poly([[a2,'x'],[b2,'y']])+' = '+sg(c2)),f:[N(x,'','x ='),N(y,'','y =')],
    ex:'上を①、下を②として x を消去します(加減法)。① × '+pn(a2)+' − ② × '+pn(a1)+' より '+poly([[D,'y']])+' = '+sg(E)+'、y = <b>'+sg(y)+'</b>。①に代入して x = <b>'+sg(x)+'</b>'}};
G.lin2=()=>{const t=ri(0,2),a=nz(-4,4),b=ri(-8,8);
  if(t===0){const x1=ri(-4,2),x2=x1+ri(1,4),y1=a*x1+b,y2=a*x2+b;
    return {q:'2点 ('+sg(x1)+', '+sg(y1)+')、('+sg(x2)+', '+sg(y2)+') を通る直線の傾きと切片は?',f:[N(a,'','傾き'),N(b,'','切片')],
      ex:'傾き = y の増加量 ÷ x の増加量 = '+pn(y2-y1)+' ÷ '+(x2-x1)+' = '+sg(a)+'。y = '+poly([[a,'x']])+' + b に ('+sg(x1)+', '+sg(y1)+') を代入して b = '+sg(b)+'。式は <b>y = '+poly([[a,'x'],[b,'']])+'</b>'}}
  if(t===1){const d=ri(2,5);
    return {q:'一次関数 y = '+poly([[a,'x'],[b,'']])+' で、x の増加量が '+d+' のとき、y の増加量は?',f:[N(a*d)],ex:'変化の割合(= 傾き)は '+sg(a)+' で一定。y の増加量 = '+pn(a)+' × '+d+' = <b>'+sg(a*d)+'</b>'}}
  const p=nz(-4,4);
  return {q:'傾きが '+sg(a)+' で、点 ('+sg(p)+', '+sg(a*p+b)+') を通る直線の切片は?',f:[N(b,'','切片')],ex:'y = '+poly([[a,'x']])+' + b に代入します。'+sg(a*p+b)+' = '+pn(a)+' × '+pn(p)+' + b → b = <b>'+sg(b)+'</b>'}};
G.angle2=()=>{const t=ri(0,4);
  if(t===0){const n=ri(5,12);return {q:n+' 角形の内角の和は何度?',f:[N(180*(n-2),'°')],ex:'n 角形の内角の和 = 180° × (n − 2)。180 × '+(n-2)+' = <b>'+180*(n-2)+'°</b>'}}
  if(t===1){const n=pick([5,6,8,9,10,12,15,18]);return {q:'正 '+n+' 角形の 1 つの外角は何度?',f:[N(360/n,'°')],ex:'多角形の外角の和はいつも 360°。360 ÷ '+n+' = <b>'+360/n+'°</b>'}}
  if(t===2){const n=pick([5,6,8,9,10,12,15,18]);return {q:'正 '+n+' 角形の 1 つの内角は何度?',f:[N(180-360/n,'°')],ex:'1 つの外角は 360 ÷ '+n+' = '+360/n+'°。内角 = 180 − '+360/n+' = <b>'+(180-360/n)+'°</b>'}}
  if(t===3){const a=ri(25,80),b=ri(25,150-a);return {q:'三角形の 2 つの内角が '+a+'° と '+b+'° のとき、残りの角の外角は何度?',f:[N(a+b,'°')],ex:'三角形の外角は、となり合わない 2 つの内角の和に等しい。'+a+' + '+b+' = <b>'+(a+b)+'°</b>'}}
  const a=ri(10,70)*2;return {q:'頂角が '+a+'° の二等辺三角形の底角は何度?',f:[N((180-a)/2,'°')],ex:'2 つの底角は等しい。(180 − '+a+') ÷ 2 = <b>'+(180-a)/2+'°</b>'}};
G.prob2=()=>{const t=ri(0,3);
  if(t===0){const k=ri(3,11),c=k<=7?k-1:13-k;return {q:'2 つのさいころを投げるとき、出た目の和が '+k+' になる確率は?',f:[Q(c,36)],ex:'目の出方は全部で 6 × 6 = 36 通り。和が '+k+' になるのは '+c+' 通り。'+F(c,36)+(gcd(c,36)>1?' = <b>'+F(red(c,36)[0],red(c,36)[1])+'</b>':' → <b>'+F(c,36)+'</b>')}}
  if(t===1){return ri(0,1)?{q:'2 つのさいころを投げるとき、同じ目が出る確率は?',f:[Q(1,6)],ex:'全部で 36 通り。同じ目は (1,1)〜(6,6) の 6 通り。'+F(6,36)+' = <b>'+F(1,6)+'</b>'}
    :{q:'2 つのさいころを投げるとき、出た目の積が奇数になる確率は?',f:[Q(1,4)],ex:'積が奇数になるのは両方とも奇数のとき。3 × 3 = 9 通り。'+F(9,36)+' = <b>'+F(1,4)+'</b>'}}
  if(t===2){const n=ri(2,3),all=Math.pow(2,n);return ri(0,1)?{q:n+' 枚の硬貨を投げるとき、少なくとも 1 枚は表が出る確率は?',f:[Q(all-1,all)],ex:'全部で '+all+' 通り。「全部裏」の 1 通りをのぞいて '+(all-1)+' 通り → <b>'+F(all-1,all)+'</b>'}
    :{q:n+' 枚の硬貨を投げるとき、ちょうど 1 枚だけ表が出る確率は?',f:[Q(n,all)],ex:'全部で '+all+' 通り。表が 1 枚だけなのは '+n+' 通り → <b>'+F(red(n,all)[0],red(n,all)[1])+'</b>'}}
  const r=ri(2,5),w=ri(2,5),n=r+w;
  if(ri(0,1))return {q:'赤玉 '+r+' 個、白玉 '+w+' 個が入った袋から 1 個取り出すとき、赤玉である確率は?',f:[Q(r,n)],ex:'全部で '+n+' 個のうち赤は '+r+' 個 → <b>'+F(red(r,n)[0],red(r,n)[1])+'</b>'};
  const x=red(r*(r-1),n*(n-1));return {q:'赤玉 '+r+' 個、白玉 '+w+' 個が入った袋から同時に 2 個取り出すとき、2 個とも赤玉である確率は?',f:[Q(x[0],x[1])],ex:'2 個の選び方は全部で '+n+' × '+(n-1)+' ÷ 2 = '+n*(n-1)/2+' 通り。赤 2 個は '+r+' × '+(r-1)+' ÷ 2 = '+r*(r-1)/2+' 通り → <b>'+F(x[0],x[1])+'</b>'}};

/* 中3 */
G.expand3=()=>{const t=ri(0,2),X=(p,q)=>poly([[1,'x²'],[p,'x'],[q,'']]);
  if(t===0){let a,b;do{a=nz(-9,9);b=nz(-9,9)}while(a+b===0||a===b);
    return {q:fac(a)+fac(b)+' を展開すると?',f:[C(X(a+b,a*b),[X(a+b,-a*b),X(a*b,a+b),X(a-b,a*b),X(-(a+b),a*b),X(0,a*b)])],ex:'(x + a)(x + b) = x² + (a + b)x + ab。たして '+sg(a+b)+'、かけて '+sg(a*b)+' → <b>'+X(a+b,a*b)+'</b>'}}
  if(t===1){const a=nz(-9,9);
    return {q:fac(a)+'² を展開すると?',f:[C(X(2*a,a*a),[X(0,a*a),X(a,a*a),X(2*a,-a*a),X(-2*a,a*a),X(2*a,2*A(a))])],ex:'(x ± a)² = x² ± 2ax + a²。まん中の項 2 × '+pn(a)+' × x を忘れずに → <b>'+X(2*a,a*a)+'</b>'}}
  const a=ri(2,9);
  return {q:'(x + '+a+')(x − '+a+') を展開すると?',f:[C(X(0,-a*a),[X(0,a*a),X(-2*a,a*a),X(-2*a,-a*a),X(0,-a),X(2*a,-a*a)])],ex:'(x + a)(x − a) = x² − a²(和と差の積)→ <b>'+X(0,-a*a)+'</b>'}};
G.factor3=()=>{const X=(p,q)=>poly([[1,'x²'],[p,'x'],[q,'']]);
  if(ri(0,3)===0){const a=ri(2,9);
    return {q:X(0,-a*a)+' を因数分解すると?',f:[C(fstr(a,-a),[fstr(-a,-a),fstr(a,a),fstr(-a*a,1),fstr(a*a,-1)])],ex:'x² − a² = (x + a)(x − a)。'+a*a+' = '+a+'² なので <b>'+fstr(a,-a)+'</b>'}}
  let a,b;do{a=nz(-9,9);b=nz(-9,9)}while(a+b===0);
  return {q:X(a+b,a*b)+' を因数分解すると?',f:[C(fstr(a,b),[fstr(-a,-b),fstr(a,-b),fstr(-a,b),fstr(a*b,1),fstr(a+b,1)])],ex:'かけて '+sg(a*b)+'、たして '+sg(a+b)+' になる 2 数は '+sg(a)+' と '+sg(b)+' → <b>'+fstr(a,b)+'</b>'}};
G.sqrt3=()=>{const t=ri(0,4),b=pick([2,3,5,6,7]);
  if(t===0){const a=ri(2,6);return {q:'√'+a*a*b+' を a√b の形にすると? <small>(√ の中はできるだけ小さく)</small>',f:[N(a,'√'),N(b)],ex:a*a*b+' = '+a+'² × '+b+'。2 乗の部分を外に出して <b>'+a+'√'+b+'</b>'}}
  if(t===1){const a=ri(2,9);let c;do{c=nz(-9,9)}while(a+c===0);
    return {q:a+'√'+b+(c>0?' + ':' − ')+A(c)+'√'+b,f:[N(a+c,'√'+b)],ex:'√'+b+' を文字と同じように考えて、係数だけ計算します。('+a+(c>0?' + ':' − ')+A(c)+')√'+b+' = <b>'+sg(a+c)+'√'+b+'</b>'}}
  if(t===2){const a=ri(2,4);let c;do{c=ri(2,5)}while(c===a);
    return {q:'√'+a*a*b+' + √'+c*c*b,f:[N(a+c,'√'+b)],ex:'√'+a*a*b+' = '+a+'√'+b+'、√'+c*c*b+' = '+c+'√'+b+'。あわせて <b>'+(a+c)+'√'+b+'</b>'}}
  if(t===3){const k=ri(2,4);return {q:'√'+b*k*k+' × √'+b,f:[N(k*b)],ex:'√ の中どうしをかけます。√'+b*k*k*b+' = √('+k*b+'²) = <b>'+k*b+'</b>'}}
  const k=ri(2,5);return {q:F(k*b,'√'+b)+' の分母を有理化すると?',f:[N(k,'√'+b)],ex:'分母と分子に √'+b+' をかけます。'+F(k*b+'√'+b,b)+' = <b>'+k+'√'+b+'</b>'}};
G.quad3=()=>{const t=ri(0,3);
  if(t<2){let r1,r2;do{r1=ri(-9,9);r2=ri(-9,9)}while(r1===r2);
    return {q:poly([[1,'x²'],[-(r1+r2),'x'],[r1*r2,'']])+' = 0',un:true,f:[N(r1,'','x ='),N(r2,'','、')],ex:'左辺を因数分解します。'+ffac(-r1)+ffac(-r2)+' = 0 → x = <b>'+sg(r1)+'、'+sg(r2)+'</b>'}}
  if(t===2){const k=ri(2,12);return {q:'x² = '+k*k,un:true,f:[N(k,'','x ='),N(-k,'','、')],ex:'2 乗して '+k*k+' になる数は正と負の 2 つ。x = <b>±'+k+'</b>'}}
  const a=nz(-6,6),k=ri(1,7);
  return {q:fac(a)+'² = '+k*k,un:true,f:[N(-a+k,'','x ='),N(-a-k,'','、')],ex:'x '+(a>0?'+ ':'− ')+A(a)+' = ±'+k+'。x = '+sg(-a)+' ± '+k+' → <b>'+sg(-a+k)+'、'+sg(-a-k)+'</b>'}};
G.quadfn3=()=>{const t=ri(0,3);
  if(t===0){const a=nz(-4,4),p=nz(-4,4);return {q:'y は x の 2 乗に比例し、x = '+sg(p)+' のとき y = '+sg(a*p*p)+' です。y = ax² の a は?',f:[N(a,'','a =')],ex:'y = ax² に代入。'+sg(a*p*p)+' = a × '+pn(p)+'² = '+p*p+'a → a = <b>'+sg(a)+'</b>'}}
  if(t===1){const a=nz(-3,3),p=ri(-4,3),q=p+ri(1,4);return {q:'関数 y = '+poly([[a,'x²']])+' で、x が '+sg(p)+' から '+sg(q)+' まで増加するときの変化の割合は?',f:[N(a*(p+q))],ex:'変化の割合 = y の増加量 ÷ x の増加量 = ('+sg(a*q*q)+' − '+pn(a*p*p)+') ÷ '+(q-p)+' = <b>'+sg(a*(p+q))+'</b>。y = ax² では a(p + q) でも求められます。'}}
  if(t===2){const a=nz(-4,4),p=nz(-5,5);return {q:'関数 y = '+poly([[a,'x²']])+' で、x = '+sg(p)+' のとき y は?',f:[N(a*p*p,'','y =')],ex:pn(p)+'² = '+p*p+'。'+(a===1?'':pn(a)+' × '+p*p+' = ')+'<b>'+sg(a*p*p)+'</b>'}}
  const a=ri(1,3),p=ri(1,4);let q;do{q=ri(1,5)}while(q===p);const m=Math.max(p,q);
  return {q:'関数 y = '+poly([[a,'x²']])+' で、x の変域が −'+p+' ≦ x ≦ '+q+' のとき、y の最小値と最大値は?',f:[N(0,'','最小値'),N(a*m*m,'','最大値')],ex:'変域が x = 0 をふくむので、最小値は x = 0 のときの <b>0</b>。最大値は絶対値が大きい x = '+(p>q?'−'+p:q)+' のときの <b>'+a*m*m+'</b>'}};
G.geo3=()=>{const t=ri(0,5);
  if(t<2){const T3=pick([[3,4,5],[5,12,13],[8,15,17],[6,8,10],[9,12,15]]),k=T3[2]>10?1:ri(1,2),a=T3[0]*k,b=T3[1]*k,c=T3[2]*k;
    const fg=(la,lb,lc)=>fig([[0,0],[b,0],[0,a]],[],[[b/2,0,lb,0,18],[0,a/2,la,-8,4,'end'],[b/2,a/2,lc,10,-4,'start']]);
    if(t===0)return {q:'直角をはさむ 2 辺が '+a+' cm と '+b+' cm の直角三角形の斜辺は?',fig:fg(a+' cm',b+' cm','?'),f:[N(c,'cm')],ex:'三平方の定理 a² + b² = c²。'+a*a+' + '+b*b+' = '+c*c+' = '+c+'² → <b>'+c+' cm</b>'};

/* モンスターの絵: 単元ごとに決まる左右対称のドット絵をその場で作る */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return ()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sprites={};
function sprite(key,big){
  if(sprites[key]!=null)return sprites[key];
  try{
    const n=big?12:10,half=n/2,r=rng(hash(key)),hue=Math.floor(r()*360),px=8,ey=big?4:3,ec=half-2;
    const c=document.createElement('canvas');c.width=c.height=n*px;const x=c.getContext('2d');
    const col=['','hsl('+hue+' 55% 50%)','hsl('+hue+' 55% 36%)','hsl('+((hue+40)%360)+' 70% 68%)','#ffffff','#e8b923','#1c2b3a'];
    const g=[];
    for(let y=0;y<n;y++){g.push([]);for(let i=0;i<half;i++){
      const p=0.42+0.13*i-(y===0||y===n-1?0.25:0);
      g[y].push(r()<p?(r()<0.22?2:r()<0.18?3:1):0)}}
    for(let y=ey-1;y<=ey+3;y++)for(let i=ec-1;i<half;i++)if(i>=0&&!g[y][i])g[y][i]=1;
    g[ey][ec]=4;g[ey+2][half-1]=6;if(r()<0.5)g[ey+2][half-2]=6;
    if(big){g[0]=g[0].map((v,i)=>(half-1-i)%2===0?5:0);g[1]=g[1].map((v,i)=>i>=1?5:0)}
    for(let y=0;y<n;y++)for(let i=0;i<half;i++){const v=g[y][i];if(!v)continue;x.fillStyle=col[v];x.fillRect(i*px,y*px,px,px);x.fillRect((n-1-i)*px,y*px,px,px)}
    x.fillStyle=col[6];x.fillRect(ec*px+px/2,ey*px+px/2,px/2,px/2);x.fillRect((n-1-ec)*px,ey*px+px/2,px/2,px/2);
    sprites[key]=c.toDataURL();
  }catch(e){sprites[key]=''}
  return sprites[key];
}

const norm=s=>s.replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，\s　]/g,'').replace(/[−－ー‐–—﹣]/g,'-').replace(/＋/g,'+');
function judgeUn(q){
  const v=q.f.map((f,i)=>norm($('a'+i).value));
  if(v.some(x=>x===''||isNaN(Number(x))))return ['blank'];
  const a=v.map(Number).sort((x,y)=>x-y),b=q.f.map(f=>f.ans).sort((x,y)=>x-y);
  return [a.every((x,i)=>Math.abs(x-b[i])<1e-9)];
}

/* 返り値: true / false / 'blank' / 'reduce' */
function judgeField(f,i){
  if(f.k==='c'){const v=S.sel[i];return v==null?'blank':v===f.ans}
  if(f.k==='n'){
    const v=norm($('a'+i).value);if(v===''||isNaN(Number(v)))return 'blank';
    return Math.abs(Number(v)-f.ans)<1e-9;
  }
  const nv=norm($('a'+i+'n').value),dv=norm($('a'+i+'d').value);
  if(nv===''||isNaN(Number(nv)))return 'blank';
  if(dv===''){return Math.abs(Number(nv)-f.ans[0]/f.ans[1])<1e-9}
  const n=Number(nv),d=Number(dv);
  if(!Number.isInteger(n)||!Number.isInteger(d)||d<=0)return 'blank';
  if(n*f.ans[1]!==f.ans[0]*d)return false;
  return gcd(n,d)===1?true:'reduce';
}
$('sheet').addEventListener('submit',e=>{
  e.preventDefault();
  if(S.judged){next();return}
  const q=S.qs[S.i],r=q.un?judgeUn(q):q.f.map(judgeField);
  if(r.includes('blank')){$('qMsg').textContent=q.f.some(f=>f.k==='c')?'答えを 1 つ選んでください。':'答えを数字で入れてください。';return}
  if(!r.includes(false)&&r.includes('reduce')){$('qMsg').textContent='値は合っています。まだ約分できるので、約分してからもう一度。';return}
  stopTimer();reveal(r.every(x=>x===true),false);
});
function reveal(ok,timeout){
  const q=S.qs[S.i];
  S.res[S.i]=ok;S.judged=true;
  q.f.forEach((f,i)=>{
    if(f.k==='c'){$('a'+i).querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===f.ans)b.classList.add('right')});return}
    (f.k==='f'?['a'+i+'n','a'+i+'d']:['a'+i]).forEach(id=>{$(id).readOnly=true});
  });
  if(!S.retry){
    if(ok){S.ehp--;$('bLog').textContent=S.ehp>0?S.foe.name+' に 1 ダメージ!':S.foe.name+' を たおした!';anim($('bImg'),'hit')}
    else{S.hp--;$('bLog').textContent=S.foe.name+' の こうげき! '+(S.hp>0?'HP が 1 へった。':'ちからつきた…');anim($('bPhp'),'hurt')}
    renderBattle();
  }
  $('qMsg').textContent='';
  $('qActions').hidden=true;$('judge').hidden=false;
  $('jMark').textContent=ok?'○':'×';$('jMark').className='mark pop '+(ok?'ok':'ng');
  $('jText').innerHTML=ok?'正解':(timeout?'時間切れ。':'')+'正しい答えは '+ansHTML(q);
  $('jEx').innerHTML=q.ex;
  $('btnNext').textContent=isOver()?'結果を見る':'次の問題';
  $('btnNext').focus();
}
function next(){
  if(isOver()){finish();return}
  S.i++;if(!S.retry)S.qs.push(newQ());renderQ();
}
$('btnNext').addEventListener('click',next);
$('btnQuit').addEventListener('click',goHome);
function goHome(){stopTimer();renderHome();show('home')}

function finish(){
  const n=S.res.length,c=S.res.filter(Boolean).length;let head,sub='',comment,win=false;
  if(S.retry){head='とっくん おわり';comment=c===n?'全部できました。もう一度たたかってみましょう。':'× の問題の解き方をもう一度読んでおきましょう。'}
  else{
    win=S.ehp<=0;const gain=win?S.foe.xp+5*S.hp:c,before=lvOf(rpg.xp);
    rpg.xp+=gain;if(win)rpg.won[S.key]=(rpg.won[S.key]||0)+1;store.set('sansu-rpg',rpg);
    const after=lvOf(rpg.xp);
    head=win?S.foe.name+' を たおした!':'ちからつきた…';
    sub='けいけんち +'+gain+(after>before?' ・ レベルが '+after+' に上がった!'+(maxHp(after)>maxHp(before)?' 最大 HP が '+maxHp(after)+' になった。':''):'');
    comment=!win?'× の問題の解き方を読んで、とっくんしてからもう一度いどみましょう。':c===n?'ノーミスの完全勝利です。':'× の問題は、とっくんで確認しておきましょう。';
  }
  $('rTitle').textContent=S.title+(S.retry?'(とっくん)':'')+' の結果';
  $('rHead').textContent=head;$('rHead').className='r-head'+(win?' win':'');
  $('rXp').textContent=sub;$('rXp').hidden=!sub;
  $('rScore').innerHTML=c+'<small> / '+n+' 問 正解</small>';
  $('rComment').textContent=comment;
  $('rList').innerHTML=S.qs.slice(0,n).map((q,i)=>'<li><span class="mark '+(S.res[i]?'ok':'ng')+'">'+(S.res[i]?'○':'×')+'</span><div><div>'+q.q+'</div><div class="a">答え <b>'+ansHTML(q)+'</b>'+(S.res[i]?'':'<br>'+q.ex)+'</div></div></li>').join('');
  $('btnRetry').hidden=c===n;
  show('result');
}
$('btnRetry').addEventListener('click',()=>{const wrong=S.qs.filter((q,i)=>S.res[i]===false).map(q=>Object.assign({},q));start(S.key,S.pool,wrong)});
$('btnAgain').addEventListener('click',()=>start(S.key,S.pool));
$('btnHome').addEventListener('click',goHome);

window.__drill={G:G,ALL:ALL,cur:()=>S.qs[S.i],state:()=>S,MON:MON};
renderHome();
})();
</script>
