<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ほしかげの剣</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* レイアウト: 夜空の上に 4:3 のゲーム画面を1枚。下にタッチ用の十字キーとA/B。単一のダークな世界観 */
:root{
  --night:#080a1c; --night2:#141838; --ink:#f3f0ff; --sub:#9da3d6;
  --gold:#ffd451; --pad:#1c2046; --pad-edge:#3a4182; --pad-hi:#2f3678;
  --win:#000000; --edge:#f3f0ff; --warn:#ffae42; --poison:#8dff8a; --dead:#ff6a6a;
  --f-pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--f-pix);
  background:var(--night);
  background-image:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 9%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 32%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 90% 60%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 74%,#fff4 50%,transparent 51%),
    linear-gradient(var(--night),var(--night2));
  background-attachment:fixed;
  padding-block:12px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none;
}
.app{max-width:780px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:12px}
.bar{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px}
.bar h1{margin:0; font-size:1.05rem; font-weight:400; letter-spacing:.12em; color:var(--gold); text-shadow:0 0 8px #ffd45155}
.bar button{
  font:inherit; font-size:.85rem; color:var(--ink); background:var(--pad); border:1px solid var(--pad-edge);
  border-radius:999px; padding:4px 12px; cursor:pointer;
}
button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

.screen{
  --reserve:300px;
  position:relative; width:min(100%, max(280px, calc((100dvh - var(--reserve)) * 1.3636)));
  aspect-ratio:240/176; max-width:100%;
  container-type:inline-size; background:#000; border-radius:6px; overflow:hidden;
  box-shadow:0 0 0 2px #2a2f63, 0 12px 40px #000a;
}
.screen.shake{animation:shake .26s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-1.2%,.6%)}40%{transform:translate(1.2%,-.6%)}60%{transform:translate(-.8%,.4%)}80%{transform:translate(.8%,0)}}
canvas{display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges}
#ui{position:absolute; inset:0; pointer-events:none}
#ui .win, #ui input, #ui button{pointer-events:auto}
#fade{position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .2s linear}

/* DQ風ウインドウ: 黒地に白い角丸の枠 */
.win{
  position:absolute; background:var(--win); color:var(--ink);
  border:.75cqw solid var(--edge); border-radius:1.4cqw; outline:.5cqw solid #000;
  padding:1.4cqw 2.4cqw; font-size:3.7cqw; line-height:1.45; letter-spacing:.04em;
}
#msg{left:3%; right:3%; bottom:3%; height:30%; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:2cqw}
#msg p{margin:0; white-space:pre-wrap}
#msg .more{position:absolute; left:50%; bottom:.2cqw; transform:translateX(-50%); font-size:2.6cqw; animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.menu .wt{font-size:.85em; text-align:center; color:var(--ink); margin-bottom:.15em; opacity:.85}
.menu .grid{display:grid; column-gap:2.2cqw}
.menu .it{display:grid; grid-template-columns:3.2cqw minmax(0,1fr) auto; column-gap:.8cqw; white-space:nowrap}
.menu .rt{text-align:right; font-variant-numeric:tabular-nums}
.menu .dis .lb,.menu .dis .rt{opacity:.45}
.menu.active .sel .cur{animation:blink .5s steps(1) infinite}
.menu .desc{margin-top:.3em; font-size:.82em; color:var(--sub); white-space:normal}
.party{position:absolute; display:flex; gap:1cqw}
.party .stat{position:relative; width:20.5cqw; font-size:2.9cqw; line-height:1.35; padding:.8cqw 1.5cqw}
.stat .row{display:flex; justify-content:space-between; gap:1cqw; font-variant-numeric:tabular-nums}
.stat .lv{justify-content:center}
.stat.low{color:var(--warn); border-color:var(--warn)}
.stat.poison{color:var(--poison); border-color:var(--poison)}
.stat.dead{color:var(--dead); border-color:var(--dead)}
.stat.act{box-shadow:0 0 0 .7cqw var(--gold)}
.stat .nm{text-align:center; border-bottom:.4cqw solid currentColor; margin-bottom:.2em}
.chap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#000a; transition:opacity .45s; z-index:5}
.chap.out{opacity:0}
.chap .win{position:relative; text-align:center; padding:3cqw 7cqw}
.chap .no{font-size:3.4cqw; color:var(--sub); letter-spacing:.3em}
.chap .tt{font-size:6.4cqw; color:var(--gold); letter-spacing:.12em; margin-top:1cqw}
.toast{left:50%; top:4%; transform:translateX(-50%); white-space:nowrap; transition:opacity .4s}
.big{font-size:3.4cqw}
.big .row{display:flex; justify-content:space-between; gap:3cqw; font-variant-numeric:tabular-nums}

/* タイトル */
.title{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:12%; pointer-events:none; text-align:center}
.title .logo{font-size:10.5cqw; color:var(--gold); letter-spacing:.14em; text-shadow:0 .6cqw 0 #6a3d00, 0 0 3cqw #ffd45188; line-height:1.1}
.title .sub{font-size:3.2cqw; color:var(--sub); letter-spacing:.3em; margin-top:1.6cqw}
.title .foot{position:absolute; bottom:3%; font-size:2.6cqw; color:#8f95c8}
.namebox{left:50%; top:50%; transform:translate(-50%,-50%); width:68%; text-align:center}
.namebox input{
  width:100%; margin:2cqw 0; font:inherit; font-size:5cqw; text-align:center; color:var(--ink);
  background:#111; border:.5cqw solid #888; border-radius:1cqw; padding:1cqw;
}
.namebox input:focus{outline:none; border-color:var(--gold)}
.namebox button{font:inherit; font-size:3.6cqw; color:#000; background:var(--gold); border:0; border-radius:1cqw; padding:1cqw 4cqw; cursor:pointer}
.end{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none}
.end .logo{font-size:8cqw; color:var(--gold); letter-spacing:.14em; text-shadow:0 0 3cqw #ffd45188}
.end p{font-size:3.6cqw; margin:2cqw 0 0}

/* タッチ操作 */
.pad{width:min(100%,520px); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; touch-action:none}
.dpad{position:relative; width:136px; height:136px; touch-action:none}
.dpad .arm{position:absolute; background:var(--pad); border:2px solid var(--pad-edge)}
.dpad .v{left:44px; width:48px; top:0; height:136px; border-radius:10px}
.dpad .h{top:44px; height:48px; left:0; width:136px; border-radius:10px}
.dpad .hub{position:absolute; left:46px; top:46px; width:44px; height:44px; background:var(--pad)}
.dpad .tri{position:absolute; width:0; height:0; border:9px solid transparent; opacity:.7}
.dpad .tri.u{left:59px; top:10px; border-bottom:12px solid var(--ink); border-top:0}
.dpad .tri.d{left:59px; bottom:10px; border-top:12px solid var(--ink); border-bottom:0}
.dpad .tri.l{top:59px; left:10px; border-right:12px solid var(--ink); border-left:0}
.dpad .tri.r{top:59px; right:10px; border-left:12px solid var(--ink); border-right:0}
.dpad .glow{position:absolute; width:48px; height:48px; border-radius:10px; background:var(--pad-hi); opacity:0}
.dpad[data-dir="up"] .g-up,.dpad[data-dir="down"] .g-down,.dpad[data-dir="left"] .g-left,.dpad[data-dir="right"] .g-right{opacity:1}
.g-up{left:44px; top:0}.g-down{left:44px; bottom:0}.g-left{left:0; top:44px}.g-right{right:0; top:44px}
.pbtn{font:inherit; color:var(--ink); background:var(--pad); border:2px solid var(--pad-edge); cursor:pointer; touch-action:none}
.pbtn.on{background:var(--pad-hi)}
.ab{position:relative; width:150px; height:132px}
.ab .pbtn{position:absolute; width:62px; height:62px; border-radius:50%; font-size:1.3rem}
.ab .ba{right:0; top:6px; color:var(--gold); border-color:#8a7330}
.ab .bb{left:0; bottom:6px}
.ab .mbtn{left:0; top:0; width:auto; height:auto; border-radius:999px; padding:4px 12px; font-size:.75rem; letter-spacing:.08em; white-space:nowrap}
.ab small{position:absolute; font-size:.7rem; color:var(--sub)}
.keys{margin:0; font-size:.8rem; color:var(--sub); text-align:center; line-height:1.8; text-wrap:balance; display:none}
@media (hover:hover) and (pointer:fine){
  .pad{display:none}
  .keys{display:block}
  .screen{--reserve:150px}
}
@media (max-width:380px){
  .dpad{transform:scale(.88); transform-origin:left center}
  .ab{transform:scale(.88); transform-origin:right center}
}
</style>

<div class="app">
  <header class="bar">
    <h1>ほしかげの剣</h1>
    <button id="snd" type="button" aria-pressed="true">♪ おと ON</button>
  </header>
  <div class="screen" id="screen">
    <canvas id="cv"></canvas>
    <div id="ui"><div id="msg" class="win" hidden></div></div>
    <div id="fade"></div>
  </div>
  <div class="pad" id="pad">
    <div class="dpad" id="dpad" aria-label="十字キー">
      <div class="arm v"></div><div class="arm h"></div><div class="hub"></div>
      <div class="glow g-up"></div><div class="glow g-down"></div><div class="glow g-left"></div><div class="glow g-right"></div>
      <div class="tri u"></div><div class="tri d"></div><div class="tri l"></div><div class="tri r"></div>
    </div>
    <div></div>
    <div class="ab">
      <button class="pbtn mbtn" data-b="menu" type="button">メニュー</button>
      <button class="pbtn bb" data-b="b" type="button">B</button>
      <button class="pbtn ba" data-b="a" type="button">A</button>
    </div>
  </div>
  <p class="keys">矢印キー / WASD：いどう ・ Z / Enter / Space：けってい・はなす・しらべる ・ X / Esc：キャンセル・メニュー</p>
</div>

<script>
'use strict';
/* =========================================================
   ほしかげの剣 — オリジナルのフィールド探索型RPG
   ========================================================= */
const TS=16, VW=15, VH=11, SW=VW*TS, SH=VH*TS;
const cv=document.getElementById('cv'); cv.width=SW; cv.height=SH;
const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const ui=document.getElementById('ui'), msgEl=document.getElementById('msg');
const fadeEl=document.getElementById('fade'), screenEl=document.getElementById('screen');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickR=a=>a[Math.floor(Math.random()*a.length)];
let FAST=false, AUTO=false;   // テストプレイ よう（こうそく・じどう せんとう）
const sleep=ms=>FAST?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
};
const SAVE_KEY='hoshikage-save-v2';   // なかみは migrate() で しんしよう に そろえる

/* ---------- ピクセルアート ---------- */
function art(rows,pal,flip){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); let top=h, bot=0;
  for(let y=0;y<h;y++){const r=rows[y]; for(let x=0;x<r.length;x++){const col=pal[r[x]]; if(!col) continue;
    g.fillStyle=col; g.fillRect(flip?w-1-x:x,y,1,1); top=Math.min(top,y); bot=Math.max(bot,y);}}
  c.top=top; c.bot=bot; return c;
}
function mkTile(fn){const c=document.createElement('canvas'); c.width=c.height=16; const g=c.getContext('2d'); fn(g); return c;}
function R(g,c,x,y,w=1,h=1){g.fillStyle=c; g.fillRect(x,y,w,h);}
function prng(seed){let s=seed>>>0||1; return ()=>{s=(s*1664525+1013904223)>>>0; return s/4294967296;};}

/* 人物 (16x16) */
const PERSON={
 down:[[

"..kggggggggggk..","..ksgggbbgggsk..","..kkggggggggkk..","...kggggggggk...","...kbbk..kbbk...","...kkkk..kkkk..."],
 null],

"................",".....kkkkkk.....","....khhhhhhk....","...khhhhhhhhk...","...khhhhhhhhk...",
"...khhhhhhhhk...","...khhhhhhhhk...","...khhhhhhhhk...","....khhhhhhk....","...krrrrrrrrk...",
"..kggggggggggk..","..ksggggggggsk..","..kkggggggggkk..","...kggggggggk...","...kbbk..kbbk...","...kkkk..kkkk..."],
 null],
 side:[[
"................",".....kkkkkk.....","....khhhhhhk....","...khhhhhhhhk...","...khhhhhhhhk...",
"...khhhhhsssk...","...khhhhssksk...","...khhhssssssk..","....khssssssk...","....krrrrrrk....",
"...kggggggggk...","...kggggsgggk...","...kggggggggk...","....kggggggk....","...kbbk..kbbk...","...kkkk..kkkk..."],
 null],
};
for(const d of ['down','up','side']){
  const a=PERSON[d][0].slice();
  a[14]="....kbbkkbbk...."; a[15]="....kkkkkkkk....";
  PERSON[d][1]=a;
}
const PPAL={
  hero:{h:'#6e3f1e',g:'#3d8f52',r:'#e04a3a'},
  elder:{h:'#eeeeee',g:'#6a4a9a',r:'#a88ad0'},
  woman:{h:'#e0782c',g:'#d86a9a',r:'#f4e0a0'},
  kid:{h:'#3a2a1a',g:'#4a7ad8',r:'#f0d040'},
  merchant:{h:'#2a2020',g:'#a07040',r:'#f0c040'},
  guard:{h:'#9aa0b0',g:'#3a5ab0',r:'#c0c8d8'},
  granny:{h:'#c8c8d0',g:'#7a6a50',r:'#c09a6a'},
  inn:{h:'#8a3a2a',g:'#e8e0d0',r:'#c84a4a'},
  sage:{h:'#d0d0d8',g:'#2e6a6a',r:'#e0c040'},
  mira:{h:'#c03a6a',g:'#5a3aa0',r:'#f0d040'},
  gou:{h:'#2a1a10',g:'#b04a20',r:'#e8e8e8',s:'#d8a070'},
};
const sprCache={};
function personSprite(palName,dir,frame){
  const key=palName+dir+frame; if(sprCache[key]) return sprCache[key];
  const p=Object.assign({k:'#1a1226',s:'#f6c79f',b:'#5a3a22'},PPAL[palName]);
  const d=dir==='left'||dir==='right'?'side':dir;
  return sprCache[key]=art(PERSON[d][frame],p,dir==='left');
}

/* モンスター (16x16) — すべてオリジナルデザイン */
const MSPR={

  ".k11111k........","k1e11111k.....kk","k3111111kkkkkk1k",".kw111111111111k","..kk11111111111k",

  "k2k.k111111k.k2k","k22kk11ww11kk22k","k222k111111k222k","k2222k1111k2222k","k22222kkkk22222k",
  "k2k2k2k..k2k2k2k","kk.k.k....k.k.kk","................","................","................","................"],
 shroom:["................",".....kkkkkk.....","...kk11ww111kk..","..k111ww111111k.",".k11111111ww111k",
  ".k1ww1111111ww1k","..kkkkkkkkkkkk..","....k333333k....","....k3k33k3k....","....k333333k....",
  "...kk322223kk...","..k3k333333k3k..","...kk333333kk...","....k3kkkk3k....","....kkk..kkk....","................"],
 snake:["................",".......kkkk.....","......k1111k....",".....k1e11e1k...",".....k111111k...",
  "......k1ww1k....",".......k11k.....",".......k12k.....","....kkkk12kkk...","...k2111111112k.",
  "..k211222222112k","..k111111111111k",".k2112222222211k",".k111111111111k.","..kkkkkkkkkkkk..","................"],
 golem:["................","....kkkkkkkk....","...k11111111k...","...k1ee11ee1k...","...k11111111k...",
  ".kkk12222221kkk.","k111k111111k111k","k121k121121k121k","k111k111111k111k","k121k122221k121k",
  ".kkkk111111kkkk.","....k11kk11k....","....k11kk11k....","...k211kk112k...","...kkkkkkkkkk...","................"],
 skel:["................",".....kkkkkk.....","....kwwwwwwk....","....kkewwekk....","....kwwwwwwk....",
  ".....kwkwkwk....","......kkkk......","....kwwwwwwk....","...kwkwwwwkwk...","...kwkkwwkkwk...",
  "...kwkwwwwkwk...","..kwk.kwwk.kwk..",".....kwkkwk.....",".....kwk..kwk...","....kwwk..kwwk..","....kkkk..kkkk.."],
 mage:[".......kk.......","......k11k......",".....k1111k.....","....k111111k....","....k1kkkk1k....",
  "....k1ekke1k....","....k1kkkk1k....","...k11k33k11k...","..k1111331111k..","..k1111331111k..",
  ".k111113311111k.",".k122111111221k.","k11111111111111k","k12121212121212k","kkkkkkkkkkkkkkkk","................"],
 ghost:["................","......kkkk......","....kk1111kk....","...k11111111k...","..k1111111111k..",
  "..k11kk11kk11k..","..k11ke11ek11k..","..k1111111111k..","..k1111221111k..","k1k1111111111k1k",
  ".kk1111111111kk.","...k1111111111k.","....k22111111k..",".....k2221k2k...","......kkk..k....","................"],
 frog:["................","................","...kkk....kkk...","..kwwek..kewwk..","..kwwkkkkkkwwk..",
  "..k1111111111k..",".k111111111111k.",".k1kkkkkkkkkk1k.",".k122222222221k.","k11122222222111k",
  "k31112222221113k","k11111111111111k",".kk11kkkkkk11kk.","k11kk......kk11k","kkkk........kkkk","................"],
 plant:["................",".....kkkkkk.....","...kk333333kk...","..k3333333333k..",".k333k1111k333k.",
  ".k33k1e11e1k33k.",".k33k111111k33k.","..k33k1221k33k..","...kk3kkkk3kk...",".....kk22kk.....",
  "..kk..k22k..kk..",".k22k.k22k.k22k.","..k22kk22kk22k..","...kkk2222kkk...","....kkkkkkkk....","................"],
 dragon:["..........kk....",".........k22k...","..kk....k2222k..",".k11k..k222222k.","k1e11k.k2222222k",
  "k1111kk1k222222k",".kww11111kk2222k","..kk11111111kkk.","....k11333311k..","...k1133333311k.",
  "...k1133333311k.","..k111333311111k","..k11k1111k1kk1k","..k1k.k11k.k..k.","..kkk.kkkk......","................"],
 knight:["................",".....kkkkkk.....","....k111111k....","....k1kkkk1k....","....k1keek1k....",
  "....k111111k....","..kkk122221kkk..",".k11k111111k11k.",".k12k113311k21k.",".k11k113311k11k.",
  ".kk2k111111k2kk.","...kk111111kk...","....k11kk11k....","....k11kk11k....","...kk22kk22kk...","...kkkkkkkkkk..."],
};
const monCache={};
function monSprite(id,alt){
  const key=id+(alt?'*':''); if(monCache[key]) return monCache[key];
  const d=MON[id]; const pal=Object.assign({k:'#140c18',w:'#f4f2ea',e:'#ff3040'},d.p,alt?d.p2:null);
  return monCache[key]=art(MSPR[d.s],pal,false);
}

/* 宝箱 */
const CHEST_C=["................","................","..kkkkkkkkkkkk..",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kooooooooooook.",
 ".kkkkkkyykkkkkk.",".kooookyykooook.",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kooooooooooook.",".kooooooooooook.",".kkkkkkkkkkkkkk.","................"];

    R(g,'#3b2a1b',cx-hw,y); R(g,'#3b2a1b',cx+hw-1,y);}

/* ---------- じどうせいせい ダンジョン ----------
   シードが きまっているので、まいかい おなじ めいろに なる（セーブの たからばこIDが ずれない）。
   あなほり法で めいろを つくり、へやと まわりみちを たして、いちばん とおい ばしょに かいだん、
   いきどまりに たからばこを おく。 さいごの かいは いちばん とおい いきどまりに ボスと ごほうび。 */
function genFloor(o){
  const r=prng(o.seed), W=o.w, H=o.h;
  const g=[...Array(H)].map(()=>Array(W).fill(o.wall));
  const sx=1+2*Math.floor((W-2)/4), sy=H-2;
  g[sy][sx]=o.floor; const st=[[sx,sy]];
  while(st.length){
    const [x,y]=st[st.length-1];
    const ds=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const nx=x+dx,ny=y+dy; return nx>0&&ny>0&&nx<W-1&&ny<H-1&&g[ny][nx]===o.wall;});
    if(!ds.length){st.pop(); continue;}
    const [dx,dy]=ds[Math.floor(r()*ds.length)]; g[y+dy/2][x+dx/2]=o.floor; g[y+dy][x+dx]=o.floor; st.push([x+dx,y+dy]);
  }
  for(let i=0;i<o.rooms;i++){
    const rw=3+2*Math.floor(r()*2), rh=3+2*Math.floor(r()*2);
    const rx=1+2*Math.floor(r()*((W-rw-1)/2)), ry=1+2*Math.floor(r()*((H-rh-3)/2));
    for(let y=ry;y<ry+rh&&y<H-1;y++) for(let x=rx;x<rx+rw&&x<W-1;x++) g[y][x]=o.floor;
  }
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
    if(g[y][x]!==o.wall||(x+y)%2!==1||r()>=o.loops) continue;
    if((g[y][x-1]===o.floor&&g[y][x+1]===o.floor)||(g[y-1][x]===o.floor&&g[y+1][x]===o.floor)) g[y][x]=o.floor;
  }
  // スタートからの きょり
  const dist=[...Array(H)].map(()=>Array(W).fill(-1)); dist[sy][sx]=0; const q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy; if(g[ny]&&g[ny][nx]===o.floor&&dist[ny][nx]<0){dist[ny][nx]=dist[y][x]+1; q.push([nx,ny]);}}}
  const nb=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>g[b]&&g[b][a]===o.floor);
  const tiles=[]; for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++) if(dist[y][x]>0) tiles.push([x,y]);
  const far=tiles.reduce((a,b)=>dist[b[1]][b[0]]>dist[a[1]][a[0]]?b:a);
  const dead=tiles.filter(([x,y])=>nb(x,y).length===1).sort((a,b)=>dist[b[1]][b[0]]-dist[a[1]][a[0]]);
  return {g,sx,sy,far,dead,nb,r};
}

function buildDungeons(){
  const setW=(x,y,c)=>{WORLD[y]=WORLD[y].slice(0,x)+c+WORLD[y].slice(x+1);};
  const findIcon=c=>{const y=WORLD.findIndex(r=>r.includes(c)); return y<0?null:[WORLD[y].indexOf(c),y];};
  for(const D of NEWDG){
    let li=0;
    if(D.icon){ if(D.world) setW(D.world[0],D.world[1],D.icon); else D.world=findIcon(D.icon); W_ICON[D.icon]=D.id+'1'; }
    const fl=[];
    for(let f=1;f<=D.floors;f++) fl.push(genFloor({w:D.w,h:D.h,seed:D.seed*31+f*7,wall:D.wall,floor:D.floor,rooms:D.rooms,loops:D.loops}));
    // ちゅうボスの かいは、 いちばん とおい いきどまりに かいだんを おき、 その てまえに ボスを たたせる
    fl.forEach((F,i)=>{ if(D.mid&&D.mid.floor===i+1&&F.dead.length){ F.far=F.dead[0]; } });
    fl.forEach((F,i)=>{
      const f=i+1, id=D.id+f, last=f===D.floors, g=F.g;
      const startN=F.nb(F.sx,F.sy)[0];
      const fwd=D.up?'u':'d', back=D.up?'d':'u';
      const links={};
      g[F.sy][F.sx]=f===1?(D.from?'u':'U'):back;
      if(f===1&&D.from) links[F.sx+','+F.sy]=[D.from[0],D.from[1],D.from[2]-1,'up'];
      if(f>1){const P2=fl[i-1]; const n2=P2.nb(P2.far[0],P2.far[1])[0]; links[F.sx+','+F.sy]=[D.id+(f-1),n2[0],n2[1],'down'];}
      const npcs=[], chests=[]; let dead=F.dead.slice();
      const notStart=([x,y])=>!(x===F.sx&&y===F.sy)&&!(x===startN[0]&&y===startN[1]);
      if(!last){
        g[F.far[1]][F.far[0]]=fwd; const N=fl[i+1]; const n3=N.nb(N.sx,N.sy)[0];
        links[F.far[0]+','+F.far[1]]=[D.id+(f+1),n3[0],n3[1],'up'];
        dead=dead.filter(([x,y])=>!(x===F.far[0]&&y===F.far[1]));
        if(D.mid&&D.mid.floor===f){
          const bn=F.nb(F.far[0],F.far[1])[0];
          npcs.push({x:bn[0],y:bn[1],mon:D.mid.mon,dir:'down',cond:()=>!S.flags['mid_'+D.id],talk:()=>dungeonMid(D)});
          dead=dead.filter(([x,y])=>!(x===bn[0]&&y===bn[1]));
        }
      }else{
        const bd=dead.find(([x,y])=>notStart(F.nb(x,y)[0])&&notStart([x,y]));
        const bn=F.nb(bd[0],bd[1])[0];
        if(D.reward) chests.push({id:D.id+'_boss',x:bd[0],y:bd[1],item:D.reward});
        npcs.push({x:bn[0],y:bn[1],mon:D.boss,dir:'down',cond:()=>!S.flags['boss_'+D.id],talk:()=>dungeonBoss(D)});
        dead=dead.filter(([x,y])=>!(x===bd[0]&&y===bd[1])&&!(x===bn[0]&&y===bn[1]));
      }
      for(const [x,y] of dead.filter(notStart).slice(0,D.per)){
        const L=D.loot[li++ % D.loot.length]; chests.push({id:`${D.id}${f}_${chests.length}`,x,y,...(typeof L==='string'?{item:L}:L)});
      }
      if(D.lava){
        const busy=new Set([...chests,...npcs].map(o=>o.x+','+o.y).concat([startN.join(',')]));
        for(let y=1;y<D.h-1;y++) for(let x=1;x<D.w-1;x++) if(g[y][x]===D.floor&&!busy.has(x+','+y)&&F.r()<D.lava) g[y][x]='L';
      }
      MAPS[id]={name:D.name+(D.floors>1?(D.up?` ${f}かい`:` ちか${f}かい`):''),out:D.wall,bgm:last&&D.id==='noxcastle'?'boss':'dungeon',world:D.world||MAPS.town.world,
        entry:[startN[0],startN[1],'up'],enc:()=>D.zone,area:D.area,dark:D.dark,links,npcs,chests,rows:g.map(r=>r.join('')),dg:D.id,floor:f};
    });
    if(D.from){const t=MAPS[D.from[0]]; const [x,y]=[D.from[1],D.from[2]]; t.rows[y]=t.rows[y].slice(0,x)+'d'+t.rows[y].slice(x+1);
      const F=fl[0], n=F.nb(F.sx,F.sy)[0]; t.links=t.links||{}; t.links[x+','+y]=[D.id+'1',n[0],n[1],'up'];}
  }
  MAPS.volcano1.name='ほのおのやま 1ごうめ'; MAPS.volcano2.name='ほのおのやま 2ごうめ'; MAPS.volcano3.name='ほのおのやま 3ごうめ';
}

// しょうごとに かえる そうびの めやす（せんしの ぶき・よろい・たて）
const GEAR={1:[6,5,3],2:[11,10,3],3:[18,10,7],4:[27,16,7],5:[34,23,12],6:[36,28,12],7:[44,32,18],8:[52,38,18],9:[62,44,24],10:[70,50,30],
  11:[70,50,30],12:[84,60,38],13:[84,60,38],14:[84,60,38],15:[92,60,38],16:[105,72,44]};
const PARTY_AT=ch=>ch<2?['hero']:ch<4?['hero','mira']:ch<7?['hero','mira','gou']:['hero','mira','gou','sena'];
const AVG={hero:{hp:7.5,str:2.5,agi:2},mira:{hp:5,str:1.5,agi:2},gou:{hp:9.5,str:3.5,agi:1.5},sena:{hp:6.5,str:2,agi:1.5}};
function expectParty(L,ch){
  const g=GEAR[ch]||GEAR[16], who=PARTY_AT(ch), lv=L-1;
  const st=c=>({hp:CLS[c].base.hp+AVG[c].hp*lv,str:CLS[c].base.str+AVG[c].str*lv,agi:CLS[c].base.agi+AVG[c].agi*lv});
  const fighters=who.filter(c=>c==='hero'||c==='gou');
  const fAtk=fighters.reduce((s,c)=>s+st(c).str,0)/fighters.length+g[0];
  const hpAvg=who.reduce((s,c)=>s+st(c).hp,0)/who.length;
  const def=who.reduce((s,c)=>s+st(c).agi/2+(c==='hero'||c==='gou'?g[1]+g[2]:g[1]*.75+g[2]*.5),0)/who.length;
  const agi=who.reduce((s,c)=>s+st(c).agi,0)/who.length;
  const spell=who.includes('mira')?(2.4*L+12):0;
  return {fAtk,hpAvg,def,agi,who,spell};
}
const ARCH={norm:{hp:1,atk:1,def:1,agi:1},tank:{hp:1.45,atk:1.05,def:1.3,agi:.55},fast:{hp:.75,atk:.95,def:.85,agi:1.5},
  mage:{hp:.8,atk:.85,def:.8,agi:1.05},brute:{hp:1.25,atk:1.18,def:.9,agi:.8}};
function fstat(ML,ch,arch='norm'){
  const E=expectParty(ML,ch), A=ARCH[arch];
  const def=Math.round(E.fAtk*.55*A.def), per=(E.fAtk-def/2)/2;
  const exp=Math.round((expFor(ML+1)-expFor(ML))/9*(A.hp*.5+.5));
  return {hpRef:Math.round(E.hpAvg),hp:Math.round(per*3*A.hp),atk:Math.round((.2*E.hpAvg+E.def/2)*A.atk),def,agi:Math.round(E.agi*.9*A.agi),exp,g:Math.round(exp*1.6),ml:ML};
}
// ボス：よそうパーティが turns ターンで たおせる HP
function bstat(L,ch,o={}){
  const E=expectParty(L,ch), def=Math.round(E.fAtk*.55*(o.def||1)), per=(E.fAtk-def/2)/2;
  let dpt=0; for(const c of E.who){ if(c==='hero') dpt+=per*(E.who.length>1?.65:1); if(c==='gou') dpt+=per*1.35; if(c==='mira') dpt+=E.spell*.85; }
  const exp=Math.round((expFor(L+1)-expFor(L))*(o.expMul||1.2));
  return {hp:Math.round(dpt*(o.turns||12)*(o.hp||1)),atk:Math.round((.36*E.hpAvg+E.def/2)*(o.atk||1)),def,agi:Math.round(E.agi*1.1),
    exp,g:Math.round(exp*1.2),hpRef:Math.round(E.hpAvg),boss:1,ml:L};
}
function fmon(n,s,p,ML,ch,arch,sk,extra){return Object.assign({n,s,p,sk},fstat(ML,ch,arch),extra||{});}

const NEWICON={'1':'port','2':'kazan','3':'yukino','4':'alma','5':'lumina'};
function buildWorld2(){
  const W=120,H=90;
  for(let y=0;y<WORLD.length;y++) WORLD[y]=WORLD[y]+'~'.repeat(W-WORLD[y].length);
  while(WORLD.length<H) WORLD.push('~'.repeat(W));
  const g=WORLD.map(r=>r.split(''));
  const hsh=(x,y,s)=>{let h=(x*374761393+y*668265263+s*1442695041)>>>0; h=(h^(h>>>13))*1274126177>>>0; return ((h^(h>>>16))>>>0)/4294967296;};
  const blob=(cx,cy,rx,ry,o)=>{
    for(let y=Math.floor(cy-ry-2);y<=cy+ry+2;y++) for(let x=Math.floor(cx-rx-2);x<=cx+rx+2;x++){
      if(y<1||x<1||y>=H-1||x>=W-1) continue;
      const d=Math.hypot((x-cx)/rx,(y-cy)/ry)+(hsh(x,y,o.seed)-.5)*(o.wob??.18);
      if(d>1) continue;
      let c=o.ground;
      if(o.ring&&d>.78) c='^';
      else if(o.coast&&d>.82) c=o.coast;
      else if(o.trees&&hsh(x,y,o.seed+1)<o.trees) c=o.tree;
      else if(o.rocks&&hsh(x,y,o.seed+2)<o.rocks&&d<.7) c='^';
      g[y][x]=c;
    }
  };
  const put=(x,y,c,clear)=>{ for(const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]) if(clear&&g[y+dy][x+dx]!=='~'&&g[y+dy][x+dx]!=='^') g[y+dy][x+dx]=clear; g[y][x]=c; };
  blob(28,52,13,8,{seed:11,ground:'.',coast:':',trees:.14,tree:'T'});            // シオサイの たいりく
  blob(92,14,15,9,{seed:12,ground:'z',trees:.16,tree:'P',rocks:.05});           // こおりの たいりく
  blob(94,56,16,10,{seed:13,ground:':',trees:.04,tree:'k',rocks:.05});          // すなの たいりく
  blob(62,74,9,6,{seed:14,ground:'o',ring:1,wob:.06});                          // そらの しま（やまに かこまれる）
  blob(20,74,7,5.5,{seed:15,ground:'x',ring:1,wob:.06});                        // やみの しんでんの しま
  blob(108,80,8,6,{seed:16,ground:'x',ring:1,wob:.06});                         // ノクスの しま
  for(const [x,y] of [[89,57],[90,57],[89,58],[90,58]]) g[y][x]='~';            // オアシス
  put(24,50,'1','.'); put(37,55,'6',':'); put(84,17,'3','z'); put(99,10,'7','z'); put(87,59,'4',':'); put(103,52,'8',':');
  put(59,74,'5','o'); put(66,73,'9','o'); put(20,74,'0','x'); put(108,80,'!','x'); put(48,28,'2','.');
  for(let y=0;y<H;y++) WORLD[y]=g[y].join('');
  Object.assign(W_ICON,NEWICON,{'6':'seacave1','7':'icetemple1','8':'pyramid1','9':'windlab1','0':'darktemple1','!':'noxcastle1'});
}
// うみの つながり と ふねの とまる ばしょ
let OCEAN=null;
function ocean(){
  if(OCEAN) return OCEAN; OCEAN=new Set(); const q=[[0,0]]; OCEAN.add('0,0');
  while(q.length){const [x,y]=q.shift(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;
    if(OCEAN.has(k)||!WORLD[ny]||WORLD[ny][nx]!=='~') continue; OCEAN.add(k); q.push([nx,ny]);}}
  return OCEAN;
}
function dockFor(x,y){
  const oc=ocean(), seen=new Set([x+','+y]), q=[[x,y]];
  while(q.length){const [cx,cy]=q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy,k=nx+','+ny; if(seen.has(k)) continue; seen.add(k);
      if(oc.has(k)) return {x:nx,y:ny};
      const t=WORLD[ny]&&WORLD[ny][nx]; if(t&&!SOLID.has(t)&&t!=='~') q.push([nx,ny]);}}
  return null;
}

function makeTown(id,name,icon,theme){
  const base=MAPS.town.rows.map(r=>r.replace(/d/g,'s'));
  const sub={X:theme.wall||'X',s:theme.ground||'s','.':theme.grass||'.',Y:theme.tree||'Y','~':theme.pond||'~',F:theme.flower||'F'};
  const rows=base.map(r=>[...r].map(c=>sub[c]??c).join(''));
  const pos=WORLD.findIndex(r=>r.includes(icon)); const wx=WORLD[pos].indexOf(icon);
  MAPS[id]={name,out:sub.X,bgm:'town',edgeExit:1,world:[wx,pos],entry:[11,16,'up'],rows,town:1};
}

function audioInit(){
  if(Snd.ac){if(Snd.ac.state==='suspended') Snd.ac.resume(); return;}
  try{Snd.ac=new (window.AudioContext||window.webkitAudioContext)(); Snd.master=Snd.ac.createGain();
    Snd.master.gain.value=Snd.on?1:0; Snd.master.connect(Snd.ac.destination);}catch(e){Snd.ac=null; return;}
  if(Snd.want){const w=Snd.want; Snd.cur=null; playBgm(w);}
}
function tone(f,t,dur,type='square',vol=.05){
  const a=Snd.ac; if(!a) return; const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.setValueAtTime(vol,t+dur*.6); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g); g.connect(Snd.master); o.start(t); o.stop(t+dur+.03);
}
function noise(t,dur,vol=.08){
  const a=Snd.ac; if(!a) return; const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), g=a.createGain(); s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(Snd.master); s.start(t);
}
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function freq(n){const m=n.match(/^([A-G][#b]?)(\d)$/); if(!m) return 0; return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]+1)*12-69)/12);}
function seq(str,unit){ // "C4 . E4 -" : '.' のばす, '-' やすみ
  const out=[]; let t=0, cur=null;
  for(const tok of str.replace(/\|/g,' ').trim().split(/\s+/)){
    if(tok==='.'){if(cur) cur.len+=unit;}
    else if(tok==='-'){cur=null;}
    else {cur={f:freq(tok),st:t,len:unit}; out.push(cur);}
    t+=unit;
  }
  return {ev:out,len:t};
}
function song(bpm,mel,bass,mw='square',bw='triangle',mv=.035,bv=.06){
  const m=seq(mel,1), b=seq(bass,2);
  const ev=[...m.ev.map(e=>({...e,w:mw,v:mv})),...b.ev.map(e=>({...e,w:bw,v:bv}))].sort((x,y)=>x.st-y.st);
  return {bpm,ev,len:Math.max(m.len,b.len)};
}

function playBgm(name){
  Snd.want=name; if(Snd.cur===name) return;
  stopBgm(); Snd.cur=name; Snd.want=name;
  if(!Snd.ac||!name||!SONGS[name]) return;
  Snd.song=SONGS[name]; Snd.t0=Snd.ac.currentTime+.08; Snd.ptr=0; Snd.loop=0;
  Snd.timer=setInterval(bgmTick,40); bgmTick();
}
function stopBgm(){clearInterval(Snd.timer); Snd.timer=null; Snd.song=null; Snd.cur=null;}
function bgmTick(){
  const s=Snd.song, a=Snd.ac; if(!s||!a) return; const step=60/s.bpm/2, loopDur=s.len*step;
  for(let guard=0;guard<64;guard++){
    const e=s.ev[Snd.ptr]; const t=Snd.t0+Snd.loop*loopDur+e.st*step;
    if(t>a.currentTime+.3) break;
    if(t>=a.currentTime-.02) tone(e.f,t,e.len*step*.92,e.w,e.v);
    if(++Snd.ptr>=s.ev.length){Snd.ptr=0; Snd.loop++;}
  }

  return (t-a.currentTime)*1000;
}

function waitKey(){if(FAST) return Promise.resolve('a'); return new Promise(res=>{const h=b=>{if(b==='a'||b==='b'){popH(h); res(b);}}; pushH(h);});}
function waitOrKey(ms){if(FAST) return Promise.resolve(); return new Promise(res=>{let done=false; const fin=()=>{if(done) return; done=true; popH(h); clearTimeout(t); res();};
  const h=b=>{if(b==='a'||b==='b') fin();}; pushH(h); const t=setTimeout(fin,ms);});}
async function say(text,opt={}){
  const wait=opt.wait||'key';
  msgEl.hidden=false;
  if(FAST){const p=document.createElement('p'); p.textContent=text; msgEl.appendChild(p); while(msgEl.querySelectorAll('p').length>10) msgEl.querySelector('p').remove(); return;}
  const p=document.createElement('p'); msgEl.appendChild(p);
  while(msgEl.querySelectorAll('p').length>10) msgEl.querySelector('p').remove();
  let skip=false; const h=b=>{if(b==='a'||b==='b') skip=true;}; pushH(h);
  for(let i=1;i<=text.length;i++){
    if(skip){p.textContent=text; break;}
    p.textContent=text.slice(0,i);
    if(i%3===0&&text[i-1]!==' ') sfx.blip();
    await sleep(opt.speed||22);
  }
  popH(h);
  if(wait==='key'){const m=document.createElement('span'); m.className='more'; m.textContent='▼'; msgEl.appendChild(m); await waitKey(); sfx.blip(); m.remove();}
  else if(wait==='auto') await waitOrKey(opt.ms||650);
}
async function lines(arr){msgClear(); for(const t of arr) await say(t); msgClose();}

class Menu{
  constructor(o){this.o=o; this.i=o.start||0; this.items=o.items; this.el=win('menu',o.style); this.render();}
  setItems(it){this.items=it; this.i=clamp(this.i,0,it.length-1); this.render();}
  render(){
    const o=this.o, cols=o.cols||1;
    let h=o.title?`<div class="wt">${o.title}</div>`:'';
    h+=`<div class="grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">`;
    this.items.forEach((it,k)=>{const x=typeof it==='string'?{label:it}:it;
      h+=`<div class="it${k===this.i?' sel':''}${x.disabled?' dis':''}"><span class="cur">${k===this.i?'▶':''}</span><span class="lb">${x.label}</span><span class="rt">${x.right??''}</span></div>`;});
    h+='</div>';
    if(o.desc){const d=o.desc(this.i); if(d) h+=`<div class="desc">${d}</div>`;}
    this.el.innerHTML=h; this.el.classList.toggle('active',!!this.active);
  }
  pick(){
    return new Promise(res=>{
      this.active=true; this.render(); const n=this.items.length, cols=this.o.cols||1;
      const h=b=>{
        let j=this.i;
        if(b==='up') j=(this.i-cols+n*cols)%n;
        else if(b==='down') j=(this.i+cols)%n;
        else if(b==='left'&&cols>1) j=(this.i-1+n)%n;
        else if(b==='right'&&cols>1) j=(this.i+1)%n;
        else if(b==='a'){popH(h); this.active=false; this.render(); sfx.ok(); res(this.i); return;}
        else if(b==='b'||b==='menu'){if(this.o.cancel===false) return; popH(h); this.active=false; this.render(); sfx.blip(); res(-1); return;}
        if(j!==this.i){this.i=j; sfx.blip(); this.render(); this.o.onMove&&this.o.onMove(j);}
      };
      pushH(h); this.o.onMove&&this.o.onMove(this.i);
    });
  }
  close(){this.el.remove();}
}
async function yesNo(){const m=new Menu({items:['はい','いいえ'],style:{right:'3%',bottom:'35%',width:'24%'}}); const c=await m.pick(); m.close(); return c===0;}

function curMap(){return MAPS[S.map];}
function tileAt(x,y){const m=curMap(); const r=m.rows[y]; if(!r||x<0||x>=r.length) return m.out; return r[x];}
function inBounds(x,y){const m=curMap(); return y>=0&&y<m.rows.length&&x>=0&&x<m.rows[y].length;}
function loadNPCs(){
  const m=curMap();
  npcs=(m.npcs||[]).filter(n=>!n.cond||n.cond()).map(n=>({...n,def:n,ox:n.x,oy:n.y,fx:n.x,fy:n.y,t:1,moving:false,wt:1000+Math.random()*2000}));
}
function npcAt(x,y){return npcs.find(n=>(n.x===x&&n.y===y)||(n.moving&&n.fx===x&&n.fy===y));}
function chestAt(x,y){return (curMap().chests||[]).find(c=>c.x===x&&c.y===y);}
function blocked(x,y){
  if(!inBounds(x,y)) return !curMap().edgeExit;
  if(SOLID.has(tileAt(x,y))) return true;
  if(npcAt(x,y)) return true;
  return false;
}
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let lastBump=0;
const isWorld=()=>curMap().kind==='world';
const onShip=()=>S.veh==='ship', onWhale=()=>S.veh==='whale';
function bump(){const n=performance.now(); if(n-lastBump>260){sfx.bump(); lastBump=n;}}
function startMove(nx,ny){trail.unshift({x:P.x,y:P.y}); trail.length=Math.min(trail.length,4); P.fx=P.x; P.fy=P.y; P.x=nx; P.y=ny; P.t=0; P.moving=true;}
function tryMove(d){
  P.dir=d; const [dx,dy]=DV[d]; const nx=P.x+dx, ny=P.y+dy;
  if(isWorld()){
    if(!inBounds(nx,ny)){bump(); return;}
    const t=tileAt(nx,ny);
    if(onWhale()){P.fx=P.x; P.fy=P.y; P.x=nx; P.y=ny; P.t=0; P.moving=true; return;}
    if(onShip()){
      if(t==='~'){P.fx=P.x; P.fy=P.y; P.x=nx; P.y=ny; P.t=0; P.moving=true; return;}
      if(SOLID.has(t)||t==='='){bump(); return;}
      S.ship={x:P.x,y:P.y}; S.veh=null; trail=[];
    }
    if(S.ship&&S.ship.x===nx&&S.ship.y===ny){S.veh='ship'; trail=[]; sfx.ok(); P.fx=P.x; P.fy=P.y; P.x=nx; P.y=ny; P.t=0; P.moving=true; return;}
    if(S.whale&&S.whale.x===nx&&S.whale.y===ny){S.veh='whale'; S.whale=null; trail=[]; sfx.magic(); P.fx=P.x; P.fy=P.y; P.x=nx; P.y=ny; P.t=0; P.moving=true; return;}
    if(t==='K'&&!S.flags.opened){run(castleDoor); return;}
    const gate=ICON_GATE[t]&&ICON_GATE[t]();
    if(gate){run(()=>lines(gate)); return;}
  }
  if(!inBounds(nx,ny)&&curMap().edgeExit){run(exitToWorld); return;}
  if(blocked(nx,ny)){bump(); return;}
  startMove(nx,ny);
}
async function run(fn){if(scripting) return; scripting=true; try{await fn();}finally{scripting=false;}}
function onStep(){
  const m=curMap(), t=tileAt(P.x,P.y);
  if(isWorld()&&onWhale()) return;
  if(isWorld()&&!S.veh&&W_ICON[t]){run(()=>enterMap(W_ICON[t])); return;}
  if(t==='U'){run(exitToWorld); return;}
  if((t==='u'||t==='d')&&m.links&&m.links[P.x+','+P.y]){
    const key=S.map+':'+P.x+','+P.y, gate=LINK_GATE[key]&&LINK_GATE[key]();
    if(gate){run(async()=>{await lines(gate); const [dx,dy]=DV[P.dir]; P.x-=dx; P.y-=dy;}); return;}
    const l=m.links[P.x+','+P.y]; run(()=>gotoMap(l[0],l[1],l[2],l[3])); return;
  }
  if(!onShip()){
    let hurt=false;
    for(const p of aliveP()){
      let d=0; if(p.poison) d++; if(t==='%') d++; if(t==='L') d+=3;
      if(d&&p.hp>1){p.hp=Math.max(1,p.hp-d); hurt=true;}
    }
    if(hurt){flash(t==='L'?'rgba(255,90,20,.5)':t==='%'?'rgba(150,40,200,.45)':'rgba(120,255,80,.35)',160); const a=Snd.ac; a&&tone(180,a.currentTime,.06,'square',.03);}
  }
  if(m.enc){
    stepsSince++;
    const rate=ENC_RATE[t];
    if(rate&&stepsSince>4&&Math.random()<1/rate){
      const zone=m.enc(P.x,P.y); stepsSince=0;
      const area=onShip()?'sea':m.area||(m.kind==='world'?areaOfZone(zone,t):'cave');
      if(ENC[zone]) run(()=>battle(pickR(ENC[zone]),{area,zone}));
    }
  }
}
function areaOfZone(zone,t){
  return {ice:'ice',desert:'desert',sky:'sky',dark:'dark',nox:'nox',coast:t==='T'?'forest':'beach'}[zone]||(t==='T'?'forest':t===':'?'beach':t==='%'?'swamp':'field');
}
async function gotoMap(id,x,y,dir){
  sfx.stairs(); await fadeOut();
  if(id!=='world') S.veh=null;
  S.map=id; P.x=x; P.y=y; P.dir=dir; P.moving=false; trail=[]; stepsSince=0; loadNPCs(); playBgm(curMap().bgm);
  if(curMap().town){S.visited=S.visited||[]; if(!S.visited.includes(id)) S.visited.push(id); S.lastTown=id;}
  await fadeIn(); toast(curMap().name);
  if(id==='noxcastle5'&&(S.ch||1)<15) await startChapter(15);
}
async function enterMap(id){const m=MAPS[id]; await gotoMap(id,m.entry[0],m.entry[1],m.entry[2]);}
async function exitToWorld(){const m=curMap(); await gotoMap('world',m.world[0],m.world[1],'down');}
async function castleDoor(){
  msgClear();
  if(!has('key')){await say('おおきな とびらは ふしぎな ちからで かたく とざされている…'); msgClose(); return;}
  if(!has('moon')||!has('sun')){await say(`${HN()}は ほしのカギを さしこんだ。`); await say(`カギは ほのかに ひかったが、 とびらは ひらかない… ${!has('moon')?'つき':'たいよう'}の ちからが たりないようだ。`); msgClose(); return;}
  await say(`${HN()}は ほしのカギ、 つきのいし、 たいようのいしを かかげた！`);
  sfx.chest(); flash('#ffffff',300);
  await say('ほしと つきと たいようの ひかりが まざりあい、 とびらが ゆっくりと ひらいていく…');
  S.flags.opened=1; msgClose(); await enterMap('castle1');
}
function fieldPress(b){
  if(b==='menu'||b==='b'){run(fieldMenu); return;}
  if(b!=='a'||P.moving) return;
  if(isWorld()&&onWhale()){run(landWhale); return;}
  if(isWorld()&&onShip()){run(()=>lines(['うみの うえだ。 りくちに ちかづくと ふねから おりられる。'])); return;}
  const [dx,dy]=DV[P.dir]; let fx=P.x+dx, fy=P.y+dy;
  if(tileAt(fx,fy)==='c'){fx+=dx; fy+=dy;}
  const n=npcAt(fx,fy);
  if(n){run(async()=>{const back={up:'down',down:'up',left:'right',right:'left'}; if(!n.mon) n.dir=back[P.dir]; await n.talk(n); msgClose();}); return;}
  const c=chestAt(P.x,P.y)||chestAt(P.x+dx,P.y+dy);
  if(c){run(()=>openChest(c)); return;}
  run(async()=>{msgClear(); await say(`${HN()}は あしもとを しらべた。`,{wait:'auto',ms:300}); await say('しかし なにも みつからなかった。'); msgClose();});
}
async function landWhale(){
  const t=tileAt(P.x,P.y);
  if(t==='~'||SOLID.has(t)||W_ICON[t]||t==='='){await lines(['ここには おりられない。 ひらけた ちめんの うえで おりよう。']); return;}
  S.whale={x:P.x,y:P.y}; S.veh=null; trail=[]; sfx.ok();
}
const CHAPTER_ITEM={key:4,moon:5,sun:6,blue:8,red:9,white:10,golddrop:11};
async function openChest(c){

  else{addItem(c.item); await say(`${IT[c.item].n}を てにいれた！`); if(IT[c.item].key) await say(IT[c.item].d);}
  msgClose();
  await afterKeyItem(c.item);

async function afterKeyItem(id){

  const lead={key:['とおくで ひがしの はしの へいしが みちを あける おとが した…'],moon:['つきのいしが ひかると、 きたの もりの ほうから ふういんの とける おとが きこえた…'],

function followerSpots(){
  const out=[]; const k=P.moving?P.t:1;
  if(S.veh) return out;
  let prevTo={x:P.x,y:P.y}, prevFrom=P.moving?{x:P.fx,y:P.fy}:{x:P.x,y:P.y};
  for(let i=0;i<S.party.length-1;i++){
    const to=trail[i]||prevTo; const from=P.moving?(trail[i+1]||prevFrom):to;
    if(from.x!==to.x||from.y!==to.y) fdir[i]=to.x>from.x?'right':to.x<from.x?'left':to.y>from.y?'down':'up';
    out.push({x:from.x+(to.x-from.x)*k,y:from.y+(to.y-from.y)*k,tx:to.x,ty:to.y,dir:fdir[i]||'down',m:S.party[i+1]});
    prevTo=to; prevFrom=from;
  }
  return out;
}
function updateField(dt){
  if(P.moving){P.t+=dt/(onWhale()?95:onShip()?140:170); if(P.t>=1){P.t=1; P.moving=false; onStep();}}
  if(!P.moving&&!scripting&&!handlers.length&&mode==='field'){
    const d=held[held.length-1]; if(d) tryMove(d);
  }
  const fol=followerSpots();
  for(const n of npcs){
    if(n.moving){n.t+=dt/260; if(n.t>=1){n.t=1; n.moving=false;}}
    else if(n.wander&&!scripting){
      n.wt-=dt; if(n.wt<=0){n.wt=1200+Math.random()*2200;
        const d=pickR(['up','down','left','right']); const [dx,dy]=DV[d]; const nx=n.x+dx, ny=n.y+dy; n.dir=d;
        if(Math.abs(nx-n.ox)<=2&&Math.abs(ny-n.oy)<=2&&inBounds(nx,ny)&&!SOLID.has(tileAt(nx,ny))&&!npcAt(nx,ny)&&!chestAt(nx,ny)&&tileAt(nx,ny)!=='+'&&tileAt(nx,ny)!=='d'&&tileAt(nx,ny)!=='u'
          &&!(nx===P.x&&ny===P.y)&&!(P.moving&&nx===P.fx&&ny===P.fy)&&!fol.some(f=>f.tx===nx&&f.ty===ny)){n.fx=n.x; n.fy=n.y; n.x=nx; n.y=ny; n.t=0; n.moving=true;}}
    }
  }
}
function drawField(now){
  const m=curMap(); const k=P.moving?P.t:1;
  const pxx=P.moving?(P.fx+(P.x-P.fx)*k):P.x, pyy=P.moving?(P.fy+(P.y-P.fy)*k):P.y;
  const camX=Math.round(pxx*TS-(SW/2-8)), camY=Math.round(pyy*TS-(SH/2-8));
  const fr=Math.floor(now/500)%2;
  const x0=Math.floor(camX/TS), y0=Math.floor(camY/TS);
  for(let ty=y0;ty<=y0+VH+1;ty++) for(let tx=x0;tx<=x0+VW+1;tx++){
    const ch=tileAt(tx,ty); const t=TILES[ch]||TILES['.']; ctx.drawImage(t[ch==='~'||ch==='='||ch==='%'||ch==='L'||ch==='B'?fr:0],tx*TS-camX,ty*TS-camY);
  }
  for(const c of (m.chests||[])) ctx.drawImage(S.flags['ch_'+c.id]?chestOpen:chestClosed,c.x*TS-camX,c.y*TS-camY+1);
  if(m.kind==='world'){
    if(S.ship&&!onShip()) ctx.drawImage(SHIP_ART,S.ship.x*TS-camX,S.ship.y*TS-camY+(fr?1:0));
    if(S.whale&&!onWhale()) ctx.drawImage(WHALE_ART,S.whale.x*TS-camX,S.whale.y*TS-camY-2+(fr?1:0));
  }
  const walk=Math.floor(now/260)%2;
  const actors=npcs.map(n=>{const kk=n.moving?n.t:1; return {y:n.fy+(n.y-n.fy)*kk,x:n.fx+(n.x-n.fx)*kk,n,z:0};});
  followerSpots().forEach((f,i)=>actors.push({x:f.x,y:f.y,f,z:-1-i}));
  actors.push({x:pxx,y:pyy,hero:1,z:1});
  actors.sort((a,b)=>a.y-b.y||a.z-b.z);
  for(const a of actors){
    const sx=Math.round(a.x*TS-camX), sy=Math.round(a.y*TS-camY);
    if(a.hero){
      if(m.kind==='world'&&onShip()) ctx.drawImage(SHIP_ART,sx,sy+(fr?1:0));
      else if(m.kind==='world'&&onWhale()){ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(sx+3,sy+12,10,3); ctx.drawImage(WHALE_ART,sx,sy-6+(fr?1:0));}
      else ctx.drawImage(hero().hp>0?personSprite('hero',P.dir,walk):graveArt,sx,sy-2);
    }
    else if(a.f) ctx.drawImage(a.f.m.hp>0?personSprite(a.f.m.cls,a.f.dir,walk):graveArt,sx,sy-2);
    else if(a.n.mon){const sp=monSprite(a.n.mon); ctx.drawImage(sp,sx,sy-2+(walk?0:-1));}
    else ctx.drawImage(personSprite(a.n.pal,a.n.dir,a.n.wander||a.n.moving?walk:0),sx,sy-2);
  }
  if(m.dark){
    const g=ctx.createRadialGradient(SW/2,SH/2,30,SW/2,SH/2,120); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.72)');
    ctx.fillStyle=g; ctx.fillRect(0,0,SW,SH);
  }
}

function applyTo(src,eff,pow,tgt){
  if(eff==='heal'){if(tgt.hp<=0) return null; if(tgt.hp>=tgt.mhp) return 'full'; const v=Math.min(rnd(...pow),tgt.mhp-tgt.hp); tgt.hp+=v; sfx.heal(); return `${tgt.name}の HPが ${v}ポイント かいふくした！`;}
  if(eff==='mp'){if(tgt.hp<=0) return null; if(tgt.mp>=tgt.mmp) return 'full'; const v=Math.min(rnd(...pow),tgt.mmp-tgt.mp); tgt.mp+=v; sfx.heal(); return `${tgt.name}の MPが ${v}ポイント かいふくした！`;}
  if(eff==='cure'){if(tgt.hp<=0||!tgt.poison) return 'none'; tgt.poison=false; sfx.heal(); return `${tgt.name}の からだから どくが きえた！`;}
  if(eff==='purify'){if(tgt.hp<=0||(!tgt.poison&&!tgt.sleep)) return 'none'; tgt.poison=false; tgt.sleep=false; sfx.heal(); return `${tgt.name}の からだが きよめられた！`;}
  if(eff==='wake'){if(tgt.hp<=0||!tgt.sleep) return 'none'; tgt.sleep=false; sfx.ok(); return `${tgt.name}は めを さました！`;}
  if(eff==='revive'){if(tgt.hp>0) return 'none'; tgt.hp=src.full?tgt.mhp:Math.ceil(tgt.mhp/2); tgt.poison=false; tgt.sleep=false; sfx.heal(); flash('#fff8c0',300); return `${tgt.name}は いきかえった！`;}
  return null;
}
function healAll(pow){const out=[]; for(const p of aliveP()){const v=Math.min(rnd(...pow),p.mhp-p.hp); p.hp+=v; out.push(`${p.name}${v}`);} sfx.heal(); return 'みんなの HPが かいふくした！';}

async function useItemField(id){
  const it=IT[id]; msgClear();
  if(it.key){await say(it.d); msgClose(); return;}
  if(it.t==='return'){const r=await townWarp(it.n+'で どこへ いく？'); if(!r) return; delItem(id); return 'warp';}
  if(it.t==='wake'||it.t==='flee'){await say('いまは つかえない。'); msgClose(); return;}
  const tgt=S.party.length>1?await pickMember('だれに つかう？',it.t==='revive'?m=>m.hp<=0:null):hero();
  if(!tgt){msgClose(); return;}
  const r=applyTo(it,it.t,it.pow,tgt);
  if(!r||FULLMSG[r]){await say(FULLMSG[r]||'しかし なにも おこらなかった。'); msgClose(); return;}
  delItem(id); updStatus();
  await say(`${HN()}は ${it.n}を つかった！`,{wait:'auto',ms:350}); await say(r); msgClose();
}

  const vis=B.en.filter(e=>!(e.dieT&&performance.now()-e.dieT>420));
  const gap=8; const total=vis.reduce((s,e)=>s+16*escale(e),0)+gap*(vis.length-1);
  let x=SW/2-total/2; for(const e of vis){e.x=x+8*escale(e); x+=16*escale(e)+gap;}
}
const alive=()=>B.en.filter(e=>e.hp>0);
function enemySprite(e){
  if(e.form&&e.d.form2){const k=e.id+'#form'; if(!monCache[k]){const f=e.d.form2; monCache[k]=art(MSPR[f.s],Object.assign({k:'#140c18',w:'#f4f2ea',e:'#ff3040'},f.p));} return monCache[k];}
  return monSprite(e.id,e.alt);
}
function drawBattle(now){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,SW,SH);
  const c=BG[B.area]||BG.field; const bx=10,by=50,bw=SW-20,bh=68;
  let g=ctx.createLinearGradient(0,by,0,by+bh*.62); g.addColorStop(0,c[0]); g.addColorStop(1,c[1]);
  ctx.fillStyle=g; ctx.fillRect(bx,by,bw,bh*.62);
  g=ctx.createLinearGradient(0,by+bh*.62,0,by+bh); g.addColorStop(0,c[2]); g.addColorStop(1,c[3]);
  ctx.fillStyle=g; ctx.fillRect(bx,by+bh*.62,bw,bh*.38);
  if(['castle','cave','tower','crypt','sewer','dark','nox','lake'].includes(B.area)){ctx.fillStyle='rgba(255,255,255,.06)'; for(let i=0;i<6;i++) ctx.fillRect(bx+12+i*38,by+6,10,bh*.56);}
  if(B.area==='nox'||B.area==='abyss'||B.area==='sky'){ctx.fillStyle='rgba(255,250,220,.7)'; for(let i=0;i<14;i++){const sx=(i*53+17)%bw, sy=(i*29)%(bh*.5); ctx.fillRect(bx+sx,by+4+sy,1,1);}}
  ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
  for(let i=0;i<B.en.length;i++){
    const e=B.en[i]; const sp=enemySprite(e); const sc=escale(e);
    if(e.dieT&&now-e.dieT>420) continue;
    if(e.flashT&&now-e.flashT<360&&Math.floor((now-e.flashT)/60)%2===0) continue;
    const w=16*sc, h=(sp.bot+1)*sc; const bob=e.d.boss||e.sleep?0:Math.sin(now/300+i)*1.2;
    const x=Math.round(e.x-w/2), y=Math.round(112-h+bob);
    ctx.save();
    if(e.dieT){const k=(now-e.dieT)/420; ctx.globalAlpha=1-k; ctx.drawImage(sp,0,0,16,sp.height,x,y+k*10,w,sp.height*sc*(1-k*.4));}
    else ctx.drawImage(sp,0,0,16,sp.height,x,y,w,sp.height*sc);
    ctx.restore();
    if(e.prep&&e.hp>0&&Math.floor(now/200)%2===0){ctx.strokeStyle='#ffe060'; ctx.strokeRect(x-1,y-1,w+2,h+2);}
    if(e.sleep&&e.hp>0){ctx.fillStyle='#fff'; ctx.font='8px monospace'; const z=Math.floor(now/400)%3; ctx.fillText('z'.repeat(z+1),x+w-6,y+4-z*2);}
    if(B.hi===i&&e.hp>0&&Math.floor(now/250)%2===0){ctx.fillStyle='#fff'; const tx=Math.round(e.x); ctx.beginPath(); ctx.moveTo(tx-4,y-8); ctx.lineTo(tx+4,y-8); ctx.lineTo(tx,y-3); ctx.fill();}
  }
}
async function encounterFx(boss){
  sfx.enc(); stopBgm(); if(FAST) return;
  for(let i=0;i<(boss?2:3);i++){fadeEl.style.transitionDuration='0ms'; fadeEl.style.background='#fff'; fadeEl.style.opacity='.85'; await sleep(55); fadeEl.style.opacity='0'; await sleep(55);}
  fadeEl.style.background='#000'; await fadeOut(180);
}
function clearBuffs(){for(const p of S.party){p.sleep=false; p.defend=false; p.atkUp=false; p.defUp=false;}}
async function battle(ids,opt={}){
  await encounterFx(opt.boss);
  B={en:ids.map(id=>mkEnemy(id,opt.zone)),area:opt.area||'field',zone:opt.zone,boss:!!opt.boss,guard:false,hi:-1,act:-1,lastCmd:[],turn:0};
  labelEnemies(B.en); layoutEnemies(); clearBuffs();
  mode='battle'; playBgm(opt.boss?'boss':'battle'); msgClear();
  showStatus({left:'3%',top:'2.5%'});
  await fadeIn(160);
  if(B.en.length===1) await say(`${B.en[0].name}が あらわれた！`,{wait:'auto'});
  else if(new Set(ids).size===1) await say(`${B.en[0].name}が ${B.en.length}ひき あらわれた！`,{wait:'auto'});
  else await say(opt.boss?`${B.en.map(e=>e.name).join('と ')}が あらわれた！`:'まものの むれが あらわれた！',{wait:'auto'});
  let res=null;
  const check=()=>!alive().length?'win':!aliveP().length?'lose':null;
  while(!res){
    B.turn++;
    const cmds=await partyCommands();
    msgClear(); msgEl.hidden=false;
    S.party.forEach((p,i)=>{p.defend=!!(cmds[i]&&cmds[i].t==='defend');});
    const order=[...S.party.map((p,i)=>({p,i,sp:p.agi*(.6+Math.random()*.6)})).filter(a=>a.p.hp>0),
      ...alive().map(e=>({e,sp:e.agi*(.6+Math.random()*.6)}))].sort((a,b)=>b.sp-a.sp);
    for(const a of order){
      if(a.p){if(a.p.hp>0) res=await memberAct(a.p,cmds[a.i]);}
      else if(a.e.hp>0&&aliveP().length) await enemyAct(a.e);
      if(!res) res=check();
      if(res) break;
    }
    if(!res){
      for(const p of aliveP()) if(p.poison){
        const d=Math.max(1,Math.floor(p.mhp/12)); flash('rgba(120,255,80,.35)',160);
        await say(`${p.name}は どくに むしばまれている！`,{wait:'auto',ms:300}); await hurtMember(p,d,{raw:1});
      }
      res=check();
    }
    S.party.forEach(p=>p.defend=false);
    if(B.turn>200&&!res) res='lose';
  }
  window.__lastTurns=B.turn;
  if(res==='win') await victory();
  clearBuffs();
  if(res==='lose'){await defeat(); return 'lose';}
  await fadeOut(220); hideStatus(); msgClose(); B=null; mode='field'; playBgm(curMap().bgm); await fadeIn(220);
  return res;
}
async function partyCommands(){
  const cmds=[]; const idx=S.party.map((p,i)=>i).filter(i=>S.party[i].hp>0&&!S.party[i].sleep);
  let k=0;
  while(k<idx.length){
    const i=idx[k]; B.act=i; updStatus();
    const c=AUTO?autoCmd(S.party[i]):await memberCommand(S.party[i],i,k>0);
    if(c==='back'){k--; continue;}
    cmds[i]=c; k++;
  }
  B.act=-1; updStatus(); return cmds;
}
async function memberCommand(p,i,canBack){
  msgClear(); msgEl.hidden=true;
  const enList=win('',{right:'3%',bottom:'3%',width:'47%',height:'30%'});
  const updList=()=>{enList.innerHTML=alive().map(e=>`<div>${e.label}${e.sleep?'（ねむり）':''}${e.prep?'（！）':''}</div>`).join('');};
  updList();
  const flash2=async t=>{enList.textContent=t; sfx.bump(); await sleep(750); updList();};
  const cm=new Menu({title:p.name,items:['たたかう','じゅもん','どうぐ','ぼうぎょ','にげる'],cols:2,cancel:canBack,start:B.lastCmd[i]||0,style:{left:'3%',bottom:'3%',width:'48%'}});
  try{
    while(true){
      const c=await cm.pick(); if(c<0) return 'back'; B.lastCmd[i]=c;
      if(c===0){const t=await pickTarget(); if(t>=0) return {t:'attack',target:t}; continue;}
      if(c===1){
        const ks=learned(p).filter(k=>SP[k].battle);
        if(!ks.length){await flash2(p.cls==='gou'?'まだ わざを おぼえていない':'じゅもんを おぼえていない'); continue;}
        const sm=new Menu({items:ks.map(k=>({label:SP[k].n,right:SP[k].mp,disabled:p.mp<SP[k].mp})),title:`${p.cls==='gou'?'わざ':'じゅもん'}（MP ${p.mp}）`,style:{left:'26%',bottom:'3%',right:'3%'},desc:j=>SP[ks[j]].d});
        const j=await sm.pick(); sm.close(); if(j<0) continue;
        const sp=SP[ks[j]];
        if(p.mp<sp.mp){await flash2('MPが たりない！'); continue;}
        const tg=await pickFor(sp.tg); if(tg===undefined) continue;
        return {t:'spell',k:ks[j],target:tg};
      }
      if(c===2){
        const list=bagList(it=>!it.slot&&!it.key&&it.t!=='return');
        if(!list.length){await flash2('つかえる どうぐが ない'); continue;}
        const im=new Menu({items:list,title:'どうぐ',style:{left:'26%',bottom:'3%',right:'3%'},desc:j=>IT[list[j].id].d});
        const j=await im.pick(); im.close(); if(j<0) continue;
        const tg=await pickFor(IT[list[j].id].tg); if(tg===undefined) continue;
        return {t:'item',id:list[j].id,target:tg};
      }
      if(c===3) return {t:'defend'};
      if(c===4) return {t:'flee'};
    }
  } finally {cm.close(); enList.remove(); B.hi=-1;}
}
async function pickFor(tg){
  if(tg==='one'){const t=await pickTarget(); return t<0?undefined:t;}
  if(tg==='ally'){if(S.party.length===1) return 0; const m=await pickMember('だれに？',x=>x.hp>0,{right:'3%',bottom:'3%',width:'47%'}); return m?S.party.indexOf(m):undefined;}
  if(tg==='dead'){const m=await pickMember('だれに？',x=>x.hp<=0,{right:'3%',bottom:'3%',width:'47%'}); return m?S.party.indexOf(m):undefined;}
  return null;
}
async function pickTarget(){
  const al=alive(); if(al.length===1) return B.en.indexOf(al[0]);
  const m=new Menu({items:al.map(e=>e.label),style:{right:'3%',bottom:'3%',width:'47%'},onMove:i=>{B.hi=B.en.indexOf(al[i]);}});
  const i=await m.pick(); m.close(); B.hi=-1; return i<0?-1:B.en.indexOf(al[i]);
}

/* テストプレイ用の じどう せんとう（そこそこ うまい プレイヤーの まね） */
const OFFENSE={hero:['judge','starrain','holy'],mira:['nova','meteor','spear','storm','blaze','ice','bolt','fire'],gou:['musou','burst','sweep','smash'],sena:['sholy']};
function autoCmd(p){
  const al=aliveP(), dead=S.party.filter(m=>m.hp<=0), en=alive(), idx=m=>S.party.indexOf(m);
  const ks=learned(p).filter(k=>SP[k].battle&&p.mp>=SP[k].mp), can=k=>ks.includes(k);
  const low=al.filter(m=>m.hp<m.mhp*.5).sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp);
  const healer=p.cls==='sena'||(p.cls==='hero'&&!S.party.some(m=>m.cls==='sena'&&m.hp>0&&!m.sleep));
  if(dead.length){const k=['srevive','revive'].find(can); if(k) return {t:'spell',k,target:idx(dead[0])}; if(has('life')&&(healer||p.cls==='gou')) return {t:'item',id:'life',target:idx(dead[0])};}
  if(low.length>=2){const k=['sallbig','hheal','sall'].find(can); if(k) return {t:'spell',k};}
  if(low.length&&(healer||low[0].hp<low[0].mhp*.3)){const k=['sbig','heal2','sheal','heal'].find(can); if(k) return {t:'spell',k,target:idx(low[0])};
    if(low[0].hp<low[0].mhp*.3){if(has('herb2')) return {t:'item',id:'herb2',target:idx(low[0])}; if(has('herb')) return {t:'item',id:'herb',target:idx(low[0])};}}
  const sleeper=al.find(m=>m.sleep); if(sleeper&&can('purify')) return {t:'spell',k:'purify',target:idx(sleeper)};
  if(B.boss&&can('guard')&&!B.guard) return {t:'spell',k:'guard'};
  if(!B.boss&&AUTO==='trash'){const tgt=en.slice().sort((a,b)=>a.hp-b.hp)[0]; return {t:'attack',target:B.en.indexOf(tgt)};}
  if(B.boss&&can('power')){const t=al.find(m=>(m.cls==='gou'||m.cls==='hero')&&!m.atkUp); if(t) return {t:'spell',k:'power',target:idx(t)};}
  if(en.some(e=>e.prep)&&(p.cls==='mira'||p.cls==='sena')&&p.hp<p.mhp*.6) return {t:'defend'};
  const reserve=p.cls==='hero'?.45:p.cls==='sena'?.6:0;
  if(p.mp>p.mmp*reserve){
    const off=OFFENSE[p.cls].filter(can);
    const allK=off.find(k=>SP[k].tg==='all'), oneK=off.find(k=>SP[k].tg==='one');
    const k=en.length>=2&&allK?allK:(oneK||allK);
    if(k){const tgt=en.slice().sort((a,b)=>a.hp-b.hp)[0]; return {t:'spell',k,target:SP[k].tg==='one'?B.en.indexOf(tgt):null};}
  }
  const tgt=en.slice().sort((a,b)=>a.hp-b.hp)[0];
  return {t:'attack',target:B.en.indexOf(tgt)};
}

function physDmg(atk,def){const base=(atk-def/2)/2; if(base<1) return rnd(0,1); return Math.max(1,Math.floor(base*(.85+Math.random()*.3)));}
const battleAtk=p=>Math.round(atkOf(p)*(p.atkUp?1.4:1));
function a_kill(){const a=Snd.ac; a&&tone(880,a.currentTime,.12,'square',.04);}
async function hitEnemy(e,dmg){
  e.hp=Math.max(0,e.hp-dmg); e.flashT=performance.now();
  await say(dmg>0?`${e.label}に ${dmg}ポイントの ダメージ！`:`${e.label}に ダメージを あたえられない！`,{wait:'auto',ms:520});
  if(e.hp<=0){e.dieT=performance.now(); e.prep=null; a_kill(); await say(`${e.label}を やっつけた！`,{wait:'auto',ms:480}); return;}
  if(e.sleep&&dmg>0&&Math.random()<.3){e.sleep=false; await say(`${e.label}は めを さました！`,{wait:'auto',ms:400});}
}
const pickAliveEnemy=t=>{const e=B.en[t]; return e&&e.hp>0?e:alive()[0];};
async function memberAct(p,cmd){
  const n=p.name;
  if(p.sleep){
    if(Math.random()<.4){p.sleep=false; updStatus(); await say(`${n}は めを さました！`,{wait:'auto'});}
    else await say(`${n}は ねむっている。`,{wait:'auto',ms:450});
    return null;
  }
  if(!cmd) return null;
  if(cmd.t==='defend'){await say(`${n}は みを まもっている。`,{wait:'auto',ms:400}); return null;}
  if(cmd.t==='attack'){
    const e=pickAliveEnemy(cmd.target); if(!e) return null;
    await say(`${n}の こうげき！`,{wait:'auto',ms:300});
    if(Math.random()<1/32){sfx.miss(); await say(`ミス！ ${e.label}は ひらりと みをかわした！`,{wait:'auto'}); return null;}
    if(Math.random()<CLS[p.cls].crit){sfx.crit(); flash('#ffffff',160); shake(); await say('かいしんの いちげき！',{wait:'auto',ms:350});
      await hitEnemy(e,Math.floor(battleAtk(p)*(.85+Math.random()*.15))); return null;}
    sfx.hit(); await hitEnemy(e,physDmg(battleAtk(p),e.def)); return null;
  }
  if(cmd.t==='spell'){
    const sp=SP[cmd.k];
    if(p.mp<sp.mp){await say(`${n}は ${sp.n}を つかおうとした。 しかし MPが たりない！`,{wait:'auto'}); return null;}
    // かさねがけは できない：もう かかっていれば MPを つかわずに おしえる
    {const bt=S.party[cmd.target];
     const already=sp.t==='guard'?(B.guard&&'ひかりの かべは もう はられている！'):
       sp.t==='buffAtk'?(bt&&bt.hp>0&&bt.atkUp&&`${bt.name}の こうげきりょくは もう あがっている！`):
       sp.t==='buffDef'?(bt&&bt.hp>0&&bt.defUp&&`${bt.name}は もう ひかりの ころもに つつまれている！`):null;
     if(already){await say(`${n}は ${sp.n}を となえようとした。 しかし ${already} これいじょうは あがらない。`,{wait:'auto'}); await say('（MPは へらなかった）',{wait:'auto',ms:400}); return null;}}
    p.mp-=sp.mp; updStatus();
    if(sp.t==='phys'||sp.t==='roar') await say(`${n}の ${sp.n}！`,{wait:'auto',ms:350});
    else {await say(`${n}は ${sp.n}の じゅもんを となえた！`,{wait:'auto',ms:350}); sfx.magic(); await sleep(200);}
    if(sp.t==='guard'){B.guard=true; flash('#a0c8ff',260); await say('ひかりの かべが なかまたちを つつみこんだ！',{wait:'auto'}); return null;}
    if(sp.t==='sleep'||sp.t==='roar'){
      flash(sp.t==='roar'?'#ffffff':'#c0a0ff',260); if(sp.t==='roar') shake();
      for(const e of alive()){
        if(e.d.boss) await say(`${e.label}には ききめが なかった！`,{wait:'auto',ms:450});
        else if(!e.sleep&&Math.random()<(sp.t==='roar'?.5:.6)){e.sleep=true; await say(sp.t==='roar'?`${e.label}は ひるんで うごけなく なった！`:`${e.label}は ねむってしまった！`,{wait:'auto',ms:450});}
        else await say(`${e.label}には きかなかった！`,{wait:'auto',ms:400});
      }
      return null;
    }
    if(sp.t==='phys'){
      sfx.crit(); shake();
      const targets=sp.tg==='all'?alive():[pickAliveEnemy(cmd.target)];
      for(const e of targets) if(e&&e.hp>0) await hitEnemy(e,Math.round(physDmg(battleAtk(p),e.def)*sp.mult));
      return null;
    }
    if(sp.t==='atk'){
      if(['bolt','spear','storm'].includes(cmd.k)){sfx.bolt(); flash('#ffffff',300); shake();}
      else if(['holy','starrain','judge','sholy','nova','meteor'].includes(cmd.k)){sfx.bolt(); flash('#fff4b0',380);}
      else if(cmd.k==='ice'){sfx.bolt(); flash('#a0e8ff',300);}
      else {sfx.fire(); flash('#ff8a3a',260);}
      const targets=sp.tg==='all'?alive():[pickAliveEnemy(cmd.target)];
      for(const e of targets) if(e&&e.hp>0) await hitEnemy(e,rnd(...sp.pow));
      return null;
    }
    if(sp.t==='healAll'){flash('#7dffb0',260); await say(healAll(sp.pow),{wait:'auto'}); updStatus(); return null;}
    if(sp.t==='buffAtk'||sp.t==='buffDef'){
      const tgt=S.party[cmd.target]; if(!tgt||tgt.hp<=0){await say('しかし こうかが なかった！',{wait:'auto'}); return null;}
      if(sp.t==='buffAtk'){tgt.atkUp=true; flash('#ff8080',200); await say(`${tgt.name}の ちからが みなぎってきた！`,{wait:'auto'});}
      else {tgt.defUp=true; flash('#a0c8ff',200); await say(`${tgt.name}は ひかりの ころもに つつまれた！`,{wait:'auto'});}
      return null;
    }
    const tgt=S.party[cmd.target]; const r=tgt&&applyTo(sp,sp.t,sp.pow,tgt);
    updStatus(); flash('#7dffb0',200);
    await say(r&&!FULLMSG[r]?r:'しかし こうかが なかった！',{wait:'auto'}); return null;
  }
  if(cmd.t==='item'){
    const it=IT[cmd.id];
    if(!has(cmd.id)){await say(`${n}は どうぐを さがしたが みつからなかった！`,{wait:'auto'}); return null;}
    delItem(cmd.id);
    await say(`${n}は ${it.n}を つかった！`,{wait:'auto',ms:350});
    if(it.t==='flee'){if(B.boss){await say('しかし けむりは すぐに かきけされた！',{wait:'auto'}); return null;}
      await say('あたりが けむりに つつまれた！',{wait:'auto'}); await say('みんなは うまく にげきった！',{wait:'auto'}); return 'fled';}
    const tgt=S.party[cmd.target]; const r=tgt&&applyTo(it,it.t,it.pow,tgt); updStatus();
    await say(r&&!FULLMSG[r]?r:'しかし こうかが なかった！',{wait:'auto'}); return null;
  }
  if(cmd.t==='flee'){
    await say(`${n}たちは にげだした！`,{wait:'auto',ms:350});
    const mx=Math.max(...alive().map(e=>e.sleep?0:e.agi)), my=Math.max(...aliveP().map(x=>x.agi));
    const ch=B.boss?0:clamp(.55+(my-mx)/40,.25,.92);
    if(Math.random()<ch){sfx.stairs(); return 'fled';}
    await say(B.boss?'しかし にげられない！':'しかし まわりこまれてしまった！',{wait:'auto'}); return null;
  }
  return null;
}
async function hurtMember(p,dmg,o={}){
  if(!p) return;
  if(!o.raw){if(B.guard) dmg=Math.ceil(dmg/2); if(p.defend) dmg=Math.ceil(dmg/2); if(p.defUp) dmg=Math.ceil(dmg*.6);}
  p.hp=Math.max(0,p.hp-dmg); updStatus();
  if(dmg>0){sfx.hurt(); shake(); flash('rgba(255,40,40,.5)',140);}
  await say(dmg>0?`${p.name}は ${dmg}ポイントの ダメージを うけた！`:`${p.name}は ダメージを うけなかった！`,{wait:'auto',ms:520});
  if(p.hp<=0){p.poison=false; p.sleep=false; p.atkUp=false; p.defUp=false; updStatus(); await say(`${p.name}は ちからつきた…`,{wait:'auto',ms:600});}
  else if(p.sleep&&dmg>0&&!o.raw&&Math.random()<.3){p.sleep=false; updStatus(); await say(`${p.name}は いたみで めを さました！`,{wait:'auto',ms:400});}
}
async function poisonMember(p,ch=.6){
  if(!p||p.hp<=0||p.poison) return; if(Math.random()>=ch) return;
  p.poison=true; updStatus(); await say(`${p.name}は どくに おかされた！`,{wait:'auto',ms:450});
}
async function sleepMember(p,ch){
  if(!p||p.hp<=0||p.sleep) return;
  if(Math.random()<ch){p.sleep=true; updStatus(); await say(`${p.name}は うごけなく なった！`,{wait:'auto',ms:450});}
  else await say(`${p.name}は もちこたえた！`,{wait:'auto',ms:380});
}
const randAlly=()=>pickR(aliveP());
async function enemyAttack(e,mult=1,silent,tgt){
  const p=tgt||randAlly(); if(!p) return;
  if(!silent) await say(`${e.label}の こうげき！`,{wait:'auto',ms:300});
  if(Math.random()<1/40){sfx.miss(); await say(`${p.name}は すばやく みをかわした！`,{wait:'auto'}); return;}
  let dmg;
  if(!e.d.boss&&Math.random()<1/48){await say('つうこんの いちげき！',{wait:'auto',ms:300}); dmg=Math.floor(e.atk*.5*(1+Math.random()*.2));}
  else dmg=Math.floor(physDmg(e.atk,defOf(p))*mult);
  if(e.charge){dmg*=2; e.charge=false;}
  await hurtMember(p,dmg);
}
async function hitAll(lo,hi){for(const p of aliveP()) await hurtMember(p,rnd(lo,hi));}
function pickSkill(d){if(!d.sk) return null; let r=Math.random(); for(const s of d.sk){if(r<s.r) return s; r-=s.r;} return null;}
async function enemyAct(e){
  if(e.sleep){
    if(Math.random()<.35){e.sleep=false; await say(`${e.label}は めを さました！`,{wait:'auto',ms:420});}
    else await say(`${e.label}は うごけない。`,{wait:'auto',ms:380});
    return;
  }
  const d=e.d;
  if(d.ai==='zolga') return zolgaAct(e);
  if(d.ai==='witch') return witchAct(e);
  if(d.ai==='gen') return genAct(e);
  await enemyMove(e);
  if(d.acts&&aliveP().length&&e.hp>0&&Math.random()<.4) await enemyMove(e);
}
async function enemyMove(e){
  let sk=pickSkill(e.d); if(e.charge) sk=null;
  if(!sk) return enemyAttack(e);
  return doMove(e,sk);
}
// だんかいつき ボスの こうどう
async function genAct(e){
  const d=e.d; let ph=e.ph||0;
  while(d.phases[ph+1]&&e.hp<=e.mhp*d.phases[ph+1].at){
    ph++; e.ph=ph; const P=d.phases[ph];
    if(P.alt) e.alt=true;
    if(P.form){e.form=true; e.name=d.form2.n; e.label=e.name; layoutEnemies();}
    flash('#ff2050',400); shake();
    if(P.say) await say(P.say,{wait:FAST?'auto':'key'});
  }
  const P=d.phases[ph];
  await genMove(e,P);
  if(P.acts&&Math.random()<P.acts&&aliveP().length&&e.hp>0) await genMove(e,P);
}
async function genMove(e,P){
  if(e.prep){const mv=e.prep; e.prep=null; return doMove(e,mv);}
  const tot=P.moves.reduce((s,m)=>s+m.r,0); let r=Math.random()*tot, mv=P.moves[0];
  for(const m of P.moves){if(r<m.r){mv=m; break;} r-=m.r;}
  return doMove(e,mv);
}
async function doMove(e,mv){
  const msg=mv.m?mv.m.replace('%s',e.label):'';
  const ref=e.d.hpRef||60;
  const dm=()=>Math.round((mv.f?ref*mv.f*(.9+Math.random()*.2):rnd(...mv.pow))*(e.d.dmg||1));
  switch(mv.t){
    case 'attack': return enemyAttack(e);
    case 'str': await say(msg,{wait:'auto',ms:380}); return enemyAttack(e,1.5,true);
    case 'charge': await say(msg,{wait:'auto',ms:420}); e.charge=true; return;
    case 'prep': await say(msg,{wait:'auto',ms:600}); e.prep=mv.next; sfx.magic(); return;
    case 'mag': await say(msg,{wait:'auto',ms:380}); sfx.fire(); flash('#ff8a3a',200); return hurtMember(randAlly(),dm());
    case 'breath': await say(msg,{wait:'auto',ms:380}); sfx.fire(); flash(mv.f>.25?'#ffffff':'#ff8a3a',mv.f>.25?400:220); if(mv.f>.25) shake(); for(const p of aliveP()) await hurtMember(p,dm()); return;
    case 'poison': {const p=randAlly(); await say(msg,{wait:'auto',ms:380}); await enemyAttack(e,1,true,p); return poisonMember(p);}
    case 'sleep1': await say(msg,{wait:'auto',ms:380}); flash('#c0a0ff',200); return sleepMember(randAlly(),.5);
    case 'sleepAll': await say(msg,{wait:'auto',ms:380}); flash('#ffc0e0',240); for(const p of aliveP()) await sleepMember(p,mv.ch||.35); return;
    case 'mist': await say(msg,{wait:'auto',ms:380}); flash('rgba(120,255,80,.4)',260); for(const p of aliveP()){await hurtMember(p,dm()); await poisonMember(p,.35);} return;
    case 'summon': {
      if(alive().length>=3) return enemyAttack(e);
      await say(msg,{wait:'auto',ms:420}); const n=mkEnemy(mv.id,null,e.d.ml||30); n.noexp=1; B.en.push(n); labelEnemies(B.en); layoutEnemies(); return;
    }
    case 'heal': {
      e.heals=e.heals||0; if(e.heals>=(mv.max||2)||e.hp>e.mhp*.7) return enemyAttack(e);
      e.heals++; await say(msg,{wait:'auto',ms:380}); const v=Math.min(Math.round(e.mhp*(mv.f||.1)),e.mhp-e.hp); e.hp+=v; return say(`${e.label}の きずが ${v}ポイント かいふくした！`,{wait:'auto'});
    }
    case 'healAlly': {
      const tg=alive().filter(x=>x.hp<x.mhp*.7).sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[0]; if(!tg) return enemyAttack(e);
      await say(msg,{wait:'auto',ms:350}); const v=Math.min(mv.f?Math.round(tg.mhp*mv.f):rnd(...mv.pow),tg.mhp-tg.hp); tg.hp+=v; return say(`${tg.label}の きずが ${v}ポイント かいふくした！`,{wait:'auto'});
    }
  }
  return enemyAttack(e);
}
async function witchAct(e){
  const r=Math.random();
  if(r<.22){await say('ネムリアは ねむりの うたを うたった！',{wait:'auto',ms:380}); flash('#c0a0ff',300); for(const p of aliveP()) await sleepMember(p,.4);}
  else if(r<.42){await say('ネムリアは どくの きりを はきだした！',{wait:'auto',ms:380}); flash('rgba(120,255,80,.4)',300);
    for(const p of aliveP()){await hurtMember(p,rnd(12,18)); await poisonMember(p,.5);}}
  else if(r<.64){await say('ネムリアは ほのおの じゅもんを となえた！',{wait:'auto',ms:380}); sfx.fire(); flash('#ff8a3a',240); await hurtMember(randAlly(),rnd(30,40));}
  else if(r<.74&&e.hp<e.mhp*.6&&(e.heals||0)<3){e.heals=(e.heals||0)+1; await say('ネムリアは いやしの うたを うたった！',{wait:'auto',ms:380}); const v=Math.min(80,e.mhp-e.hp); e.hp+=v; await say(`ネムリアの きずが ${v}ポイント かいふくした！`,{wait:'auto'});}
  else await enemyAttack(e);
}
async function zolgaAct(e){
  if(!e.p2&&e.hp<e.mhp*.5){
    e.p2=true; e.alt=true; flash('#ff2050',400); shake();
    await say('ゾルガ「おのれ…！ ならば しんの すがたを みせてやろう！」',{wait:FAST?'auto':'key'});
    await say('ゾルガの からだから まがまがしい ひかりが あふれだした！',{wait:'auto'});
  }
  const acts=e.p2?2:1;
  for(let k=0;k<acts;k++){
    if(!aliveP().length) return;
    if(k===1&&Math.random()>.4) return;
    const r=Math.random();
    if(!e.p2){
      if(r<.35) await enemyAttack(e);
      else if(r<.63){await say('ゾルガは いかずちの あらしを よびよせた！',{wait:'auto',ms:380}); sfx.bolt(); flash('#ffffff',300); await hitAll(26,36);}
      else if(r<.83){await say('ゾルガは やみの いきを はきだした！',{wait:'auto',ms:380}); flash('#6a30a0',260); for(const p of aliveP()){await hurtMember(p,rnd(18,26)); await sleepMember(p,.2);}}
      else if((e.heals||0)<2&&e.hp<e.mhp*.8){e.heals=(e.heals||0)+1; await say('ゾルガは やみの ちからで きずを いやした！',{wait:'auto',ms:380}); const v=Math.min(120,e.mhp-e.hp); e.hp+=v; await say(`ゾルガの きずが ${v}ポイント かいふくした！`,{wait:'auto'});}
      else await say('ゾルガは ふきみに わらっている…',{wait:'auto'});
    }else{
      if(r<.3) await enemyAttack(e);
      else if(r<.62){await say('ゾルガは やみの ほのおを はなった！',{wait:'auto',ms:380}); sfx.fire(); flash('#a020ff',300); await hurtMember(randAlly(),rnd(55,70));}
      else if(r<.9){await say('ゾルガは いかずちの あらしを よびよせた！',{wait:'auto',ms:380}); sfx.bolt(); flash('#ffffff',300); await hitAll(28,38);}
      else await say('ゾルガは こちらを じっと にらんでいる…',{wait:'auto'});
    }
  }
}
async function victory(){
  const km=B.boss?1:(EXPMUL[B.zone]??1);
  const exp=Math.round(B.en.filter(e=>!e.noexp).reduce((s,e)=>s+e.d.exp,0)*km), gold=Math.round(B.en.filter(e=>!e.noexp).reduce((s,e)=>s+e.d.g,0)*(km+1)/2);

  if(gold){S.gold+=gold; await say(`${gold}ゴールドを てにいれた！`,{wait:'auto'});}

      const lms=sfx.lvl();
      await say(`${p.name}は レベル ${p.lv}に あがった！`,{wait:'auto',ms:Math.max(700,lms||0)});
      await say(`ちから+${d.str} すばやさ+${d.agi} さいだいHP+${d.hp}`+(d.mp?` さいだいMP+${d.mp}`:''),{wait:'auto',ms:800});
      for(const k of learned(p)) if(!before.includes(k)) await say(`${p.name}は ${SP[k].n}を おぼえた！`,{wait:'auto',ms:900});

}

function migrate(s){
  s.flags=s.flags||{}; const f=s.flags, h=id=>(s.items[id]||0)>0;
  if(!MAPS[s.map]) s.map='village';
  s.visited=s.visited||['village']; s.lastTown=s.lastTown||'village';
  if(f.mira&&!s.visited.includes('town')) s.visited.push('town');
  if(f.gou&&!s.visited.includes('hayate')) s.visited.push('hayate');
  for(const m of s.party) {m.poison=!!m.poison; if(m.cls==='gou'&&m.mmp===0&&m.lv>1) m.mmp=m.mp=Math.round((m.lv-1)*1.5);}
  if(!s.ch){
    if(f.boss_crypt&&!h('sun')) s.items.sun=1;
    if((f.mira||f.boss_sewer||f.guardian||h('key'))&&!h('letter')) s.items.letter=1;
    if(f.mira||f.boss_sewer) f.sewerOK=1;
    s.ch=f.zolga?7:h('sun')&&h('moon')&&h('key')?6:h('moon')?5:h('key')?4:(f.boss_sewer||f.guardian)?3:h('letter')?2:1;
    if(f.zolga&&!s.ship){const [hx,hy]=MAPS.hayate.world; s.ship=dockFor(hx,hy);}
    if(s.ch>1) f.intro=1;
  }
  return s;
}
