<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ほしかげの剣</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* レイアウト: 夜空の上に 4:3 のゲーム画面を1枚。下にタッチ用の十字キーとA/B。単一のダークな世界観 */
:root{
  --night:#080a1c; --night2:#141838; --ink:#f3f0ff; --sub:#9da3d6;
  --gold:#ffd451; --pad:#1c2046; --pad-edge:#3a4182; --pad-hi:#2f3678;
  --win:#000000; --edge:#f3f0ff; --warn:#ffae42; --poison:#8dff8a; --dead:#ff6a6a;
  --f-pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--f-pix);
  background:var(--night);
  background-image:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 9%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 32%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 90% 60%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 74%,#fff4 50%,transparent 51%),
    linear-gradient(var(--night),var(--night2));
  background-attachment:fixed;
  padding-block:12px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none;
}
.app{max-width:780px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:12px}
.bar{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px}
.bar h1{margin:0; font-size:1.05rem; font-weight:400; letter-spacing:.12em; color:var(--gold); text-shadow:0 0 8px #ffd45155}
.bar button{
  font:inherit; font-size:.85rem; color:var(--ink); background:var(--pad); border:1px solid var(--pad-edge);
  border-radius:999px; padding:4px 12px; cursor:pointer;
}
button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

.screen{
  --reserve:300px;
  position:relative; width:min(100%, max(280px, calc((100dvh - var(--reserve)) * 1.3636)));
  aspect-ratio:240/176; max-width:100%;
  container-type:inline-size; background:#000; border-radius:6px; overflow:hidden;
  box-shadow:0 0 0 2px #2a2f63, 0 12px 40px #000a;
}
.screen.shake{animation:shake .26s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-1.2%,.6%)}40%{transform:translate(1.2%,-.6%)}60%{transform:translate(-.8%,.4%)}80%{transform:translate(.8%,0)}}
canvas{display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges}
#ui{position:absolute; inset:0; pointer-events:none}
#ui .win, #ui input, #ui button{pointer-events:auto}
#fade{position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .2s linear}

/* DQ風ウインドウ: 黒地に白い角丸の枠 */
.win{
  position:absolute; background:var(--win); color:var(--ink);
  border:.75cqw solid var(--edge); border-radius:1.4cqw; outline:.5cqw solid #000;
  padding:1.4cqw 2.4cqw; font-size:3.7cqw; line-height:1.45; letter-spacing:.04em;
}
#msg{left:3%; right:3%; bottom:3%; height:30%; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:2cqw}
#msg p{margin:0; white-space:pre-wrap}
#msg .more{position:absolute; left:50%; bottom:.2cqw; transform:translateX(-50%); font-size:2.6cqw; animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.menu .wt{font-size:.85em; text-align:center; color:var(--ink); margin-bottom:.15em; opacity:.85}
.menu .grid{display:grid; column-gap:2.2cqw}
.menu .it{display:grid; grid-template-columns:3.2cqw minmax(0,1fr) auto; column-gap:.8cqw; white-space:nowrap}
.menu .rt{text-align:right; font-variant-numeric:tabular-nums}
.menu .dis .lb,.menu .dis .rt{opacity:.45}
.menu.active .sel .cur{animation:blink .5s steps(1) infinite}
.menu .desc{margin-top:.3em; font-size:.82em; color:var(--sub); white-space:normal}
.party{position:absolute; display:flex; gap:1cqw}
.party .stat{position:relative; width:20.5cqw; font-size:2.9cqw; line-height:1.35; padding:.8cqw 1.5cqw}
.stat .row{display:flex; justify-content:space-between; gap:1cqw; font-variant-numeric:tabular-nums}
.stat .lv{justify-content:center}
.stat.low{color:var(--warn); border-color:var(--warn)}
.stat.poison{color:var(--poison); border-color:var(--poison)}
.stat.dead{color:var(--dead); border-color:var(--dead)}
.stat.act{box-shadow:0 0 0 .7cqw var(--gold)}
.stat .nm{text-align:center; border-bottom:.4cqw solid currentColor; margin-bottom:.2em}
.toast{left:50%; top:4%; transform:translateX(-50%); white-space:nowrap; transition:opacity .4s}
.big{font-size:3.4cqw}
.big .row{display:flex; justify-content:space-between; gap:3cqw; font-variant-numeric:tabular-nums}

/* タイトル */
.title{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:12%; pointer-events:none; text-align:center}
.title .logo{font-size:10.5cqw; color:var(--gold); letter-spacing:.14em; text-shadow:0 .6cqw 0 #6a3d00, 0 0 3cqw #ffd45188; line-height:1.1}
.title .sub{font-size:3.2cqw; color:var(--sub); letter-spacing:.3em; margin-top:1.6cqw}
.title .foot{position:absolute; bottom:3%; font-size:2.6cqw; color:#8f95c8}
.namebox{left:50%; top:50%; transform:translate(-50%,-50%); width:68%; text-align:center}
.namebox input{
  width:100%; margin:2cqw 0; font:inherit; font-size:5cqw; text-align:center; color:var(--ink);
  background:#111; border:.5cqw solid #888; border-radius:1cqw; padding:1cqw;
}
.namebox input:focus{outline:none; border-color:var(--gold)}
.namebox button{font:inherit; font-size:3.6cqw; color:#000; background:var(--gold); border:0; border-radius:1cqw; padding:1cqw 4cqw; cursor:pointer}
.end{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none}
.end .logo{font-size:8cqw; color:var(--gold); letter-spacing:.14em; text-shadow:0 0 3cqw #ffd45188}
.end p{font-size:3.6cqw; margin:2cqw 0 0}

/* タッチ操作 */
.pad{width:min(100%,520px); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; touch-action:none}
.dpad{position:relative; width:136px; height:136px; touch-action:none}
.dpad .arm{position:absolute; background:var(--pad); border:2px solid var(--pad-edge)}
.dpad .v{left:44px; width:48px; top:0; height:136px; border-radius:10px}
.dpad .h{top:44px; height:48px; left:0; width:136px; border-radius:10px}
.dpad .hub{position:absolute; left:46px; top:46px; width:44px; height:44px; background:var(--pad)}
.dpad .tri{position:absolute; width:0; height:0; border:9px solid transparent; opacity:.7}
.dpad .tri.u{left:59px; top:10px; border-bottom:12px solid var(--ink); border-top:0}
.dpad .tri.d{left:59px; bottom:10px; border-top:12px solid var(--ink); border-bottom:0}
.dpad .tri.l{top:59px; left:10px; border-right:12px solid var(--ink); border-left:0}
.dpad .tri.r{top:59px; right:10px; border-left:12px solid var(--ink); border-right:0}
.dpad .glow{position:absolute; width:48px; height:48px; border-radius:10px; background:var(--pad-hi); opacity:0}
.dpad[data-dir="up"] .g-up,.dpad[data-dir="down"] .g-down,.dpad[data-dir="left"] .g-left,.dpad[data-dir="right"] .g-right{opacity:1}
.g-up{left:44px; top:0}.g-down{left:44px; bottom:0}.g-left{left:0; top:44px}.g-right{right:0; top:44px}
.pbtn{font:inherit; color:var(--ink); background:var(--pad); border:2px solid var(--pad-edge); cursor:pointer; touch-action:none}
.pbtn.on{background:var(--pad-hi)}
.ab{position:relative; width:150px; height:132px}
.ab .pbtn{position:absolute; width:62px; height:62px; border-radius:50%; font-size:1.3rem}
.ab .ba{right:0; top:6px; color:var(--gold); border-color:#8a7330}
.ab .bb{left:0; bottom:6px}
.ab .mbtn{left:0; top:0; width:auto; height:auto; border-radius:999px; padding:4px 12px; font-size:.75rem; letter-spacing:.08em; white-space:nowrap}
.ab small{position:absolute; font-size:.7rem; color:var(--sub)}
.keys{margin:0; font-size:.8rem; color:var(--sub); text-align:center; line-height:1.8; text-wrap:balance; display:none}
@media (hover:hover) and (pointer:fine){
  .pad{display:none}
  .keys{display:block}
  .screen{--reserve:150px}
}
@media (max-width:380px){
  .dpad{transform:scale(.88); transform-origin:left center}
  .ab{transform:scale(.88); transform-origin:right center}
}
</style>

<div class="app">
  <header class="bar">
    <h1>ほしかげの剣</h1>
    <button id="snd" type="button" aria-pressed="true">♪ おと ON</button>
  </header>
  <div class="screen" id="screen">
    <canvas id="cv"></canvas>
    <div id="ui"><div id="msg" class="win" hidden></div></div>
    <div id="fade"></div>
  </div>
  <div class="pad" id="pad">
    <div class="dpad" id="dpad" aria-label="十字キー">
      <div class="arm v"></div><div class="arm h"></div><div class="hub"></div>
      <div class="glow g-up"></div><div class="glow g-down"></div><div class="glow g-left"></div><div class="glow g-right"></div>
      <div class="tri u"></div><div class="tri d"></div><div class="tri l"></div><div class="tri r"></div>
    </div>
    <div></div>
    <div class="ab">
      <button class="pbtn mbtn" data-b="menu" type="button">メニュー</button>
      <button class="pbtn bb" data-b="b" type="button">B</button>
      <button class="pbtn ba" data-b="a" type="button">A</button>
    </div>
  </div>
  <p class="keys">矢印キー / WASD：いどう ・ Z / Enter / Space：けってい・はなす・しらべる ・ X / Esc：キャンセル・メニュー</p>
</div>

<script>
'use strict';
/* =========================================================
   ほしかげの剣 — オリジナルのフィールド探索型RPG
   ========================================================= */
const TS=16, VW=15, VH=11, SW=VW*TS, SH=VH*TS;
const cv=document.getElementById('cv'); cv.width=SW; cv.height=SH;
const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const ui=document.getElementById('ui'), msgEl=document.getElementById('msg');
const fadeEl=document.getElementById('fade'), screenEl=document.getElementById('screen');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickR=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
};
const SAVE_KEY='hoshikage-save-v2';

/* ---------- ピクセルアート ---------- */
function art(rows,pal,flip){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); let top=h, bot=0;
  for(let y=0;y<h;y++){const r=rows[y]; for(let x=0;x<r.length;x++){const col=pal[r[x]]; if(!col) continue;
    g.fillStyle=col; g.fillRect(flip?w-1-x:x,y,1,1); top=Math.min(top,y); bot=Math.max(bot,y);}}
  c.top=top; c.bot=bot; return c;
}
function mkTile(fn){const c=document.createElement('canvas'); c.width=c.height=16; const g=c.getContext('2d'); fn(g); return c;}
function R(g,c,x,y,w=1,h=1){g.fillStyle=c; g.fillRect(x,y,w,h);}
function prng(seed){let s=seed>>>0||1; return ()=>{s=(s*1664525+1013904223)>>>0; return s/4294967296;};}

/* 人物 (16x16) */
const PERSON={
 down:[[
"................",".....kkkkkk.....","....khhhhhhk....","...khhhhhhhhk...","...khhhhhhhhk...",
"...khsssssshk...","...kskssssksk...","...kssssssssk...","....kssssssk....","...krrrrrrrrk...",
"..kggggggggggk..","..ksgggbbgggsk..","..kkggggggggkk..","...kggggggggk...","...kbbk..kbbk...","...kkkk..kkkk..."],
 null],
 up:[[
"................",".....kkkkkk.....","....khhhhhhk....","...khhhhhhhhk...","...khhhhhhhhk...",
"...khhhhhhhhk...","...khhhhhhhhk...","...khhhhhhhhk...","....khhhhhhk....","...krrrrrrrrk...",
"..kggggggggggk..","..ksggggggggsk..","..kkggggggggkk..","...kggggggggk...","...kbbk..kbbk...","...kkkk..kkkk..."],
 null],
 side:[[
"................",".....kkkkkk.....","....khhhhhhk....","...khhhhhhhhk...","...khhhhhhhhk...",
"...khhhhhsssk...","...khhhhssksk...","...khhhssssssk..","....khssssssk...","....krrrrrrk....",
"...kggggggggk...","...kggggsgggk...","...kggggggggk...","....kggggggk....","...kbbk..kbbk...","...kkkk..kkkk..."],
 null],
};
for(const d of ['down','up','side']){
  const a=PERSON[d][0].slice();
  a[14]="....kbbkkbbk...."; a[15]="....kkkkkkkk....";
  PERSON[d][1]=a;
}
const PPAL={
  hero:{h:'#6e3f1e',g:'#3d8f52',r:'#e04a3a'},
  elder:{h:'#eeeeee',g:'#6a4a9a',r:'#a88ad0'},
  woman:{h:'#e0782c',g:'#d86a9a',r:'#f4e0a0'},
  kid:{h:'#3a2a1a',g:'#4a7ad8',r:'#f0d040'},
  merchant:{h:'#2a2020',g:'#a07040',r:'#f0c040'},
  guard:{h:'#9aa0b0',g:'#3a5ab0',r:'#c0c8d8'},
  granny:{h:'#c8c8d0',g:'#7a6a50',r:'#c09a6a'},
  inn:{h:'#8a3a2a',g:'#e8e0d0',r:'#c84a4a'},
  sage:{h:'#d0d0d8',g:'#2e6a6a',r:'#e0c040'},
  mira:{h:'#c03a6a',g:'#5a3aa0',r:'#f0d040'},
  gou:{h:'#2a1a10',g:'#b04a20',r:'#e8e8e8',s:'#d8a070'},
};
const sprCache={};
function personSprite(palName,dir,frame){
  const key=palName+dir+frame; if(sprCache[key]) return sprCache[key];
  const p=Object.assign({k:'#1a1226',s:'#f6c79f',b:'#5a3a22'},PPAL[palName]);
  const d=dir==='left'||dir==='right'?'side':dir;
  return sprCache[key]=art(PERSON[d][frame],p,dir==='left');
}

/* モンスター (16x16) — すべてオリジナルデザイン */
const MSPR={
 seed:["................","........kk......",".......k33k.....","......k33k......",".....kkk3kkk....",
  "....k1111111k...","...k111111111k..","..k11wk111wk11k.","..k11kk111kk11k.","..k11111111111k.",
  "..k12111111121k.","..k11112221111k.","...k222222222k..","....k2222222k...",".....kkkkkkk....","................"],
 beast:["................","................","................","..k..k..........",".k1kk1k.........",
  ".k11111k........","k1e11111k.....kk","k3111111kkkkkk1k",".kw111111111111k","..kk11111111111k",
  "...k11111111112k","...k1221111221k.","...k1kk1k1kk1k..","...kk.kk.kk.kk..","................","................"],
 bat:["................","......k..k......",".....k1kk1k.....","k...k111111k...k","kk..k1e11e1k..kk",
  "k2k.k111111k.k2k","k22kk11ww11kk22k","k222k111111k222k","k2222k1111k2222k","k22222kkkk22222k",
  "k2k2k2k..k2k2k2k","kk.k.k....k.k.kk","................","................","................","................"],
 shroom:["................",".....kkkkkk.....","...kk11ww111kk..","..k111ww111111k.",".k11111111ww111k",
  ".k1ww1111111ww1k","..kkkkkkkkkkkk..","....k333333k....","....k3k33k3k....","....k333333k....",
  "...kk322223kk...","..k3k333333k3k..","...kk333333kk...","....k3kkkk3k....","....kkk..kkk....","................"],
 snake:["................",".......kkkk.....","......k1111k....",".....k1e11e1k...",".....k111111k...",
  "......k1ww1k....",".......k11k.....",".......k12k.....","....kkkk12kkk...","...k2111111112k.",
  "..k211222222112k","..k111111111111k",".k2112222222211k",".k111111111111k.","..kkkkkkkkkkkk..","................"],
 golem:["................","....kkkkkkkk....","...k11111111k...","...k1ee11ee1k...","...k11111111k...",
  ".kkk12222221kkk.","k111k111111k111k","k121k121121k121k","k111k111111k111k","k121k122221k121k",
  ".kkkk111111kkkk.","....k11kk11k....","....k11kk11k....","...k211kk112k...","...kkkkkkkkkk...","................"],
 skel:["................",".....kkkkkk.....","....kwwwwwwk....","....kkewwekk....","....kwwwwwwk....",
  ".....kwkwkwk....","......kkkk......","....kwwwwwwk....","...kwkwwwwkwk...","...kwkkwwkkwk...",
  "...kwkwwwwkwk...","..kwk.kwwk.kwk..",".....kwkkwk.....",".....kwk..kwk...","....kwwk..kwwk..","....kkkk..kkkk.."],
 mage:[".......kk.......","......k11k......",".....k1111k.....","....k111111k....","....k1kkkk1k....",
  "....k1ekke1k....","....k1kkkk1k....","...k11k33k11k...","..k1111331111k..","..k1111331111k..",
  ".k111113311111k.",".k122111111221k.","k11111111111111k","k12121212121212k","kkkkkkkkkkkkkkkk","................"],
 ghost:["................","......kkkk......","....kk1111kk....","...k11111111k...","..k1111111111k..",
  "..k11kk11kk11k..","..k11ke11ek11k..","..k1111111111k..","..k1111221111k..","k1k1111111111k1k",
  ".kk1111111111kk.","...k1111111111k.","....k22111111k..",".....k2221k2k...","......kkk..k....","................"],
 frog:["................","................","...kkk....kkk...","..kwwek..kewwk..","..kwwkkkkkkwwk..",
  "..k1111111111k..",".k111111111111k.",".k1kkkkkkkkkk1k.",".k122222222221k.","k11122222222111k",
  "k31112222221113k","k11111111111111k",".kk11kkkkkk11kk.","k11kk......kk11k","kkkk........kkkk","................"],
 plant:["................",".....kkkkkk.....","...kk333333kk...","..k3333333333k..",".k333k1111k333k.",
  ".k33k1e11e1k33k.",".k33k111111k33k.","..k33k1221k33k..","...kk3kkkk3kk...",".....kk22kk.....",
  "..kk..k22k..kk..",".k22k.k22k.k22k.","..k22kk22kk22k..","...kkk2222kkk...","....kkkkkkkk....","................"],
 knight:["................",".....kkkkkk.....","....k111111k....","....k1kkkk1k....","....k1keek1k....",
  "....k111111k....","..kkk122221kkk..",".k11k111111k11k.",".k12k113311k21k.",".k11k113311k11k.",
  ".kk2k111111k2kk.","...kk111111kk...","....k11kk11k....","....k11kk11k....","...kk22kk22kk...","...kkkkkkkkkk..."],
};
const monCache={};
function monSprite(id,alt){
  const key=id+(alt?'*':''); if(monCache[key]) return monCache[key];
  const d=MON[id]; const pal=Object.assign({k:'#140c18',w:'#f4f2ea',e:'#ff3040'},d.p,alt?d.p2:null);
  return monCache[key]=art(MSPR[d.s],pal,false);
}

/* 宝箱 */
const CHEST_C=["................","................","..kkkkkkkkkkkk..",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kooooooooooook.",
 ".kkkkkkyykkkkkk.",".kooookyykooook.",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kooooooooooook.",".kooooooooooook.",".kkkkkkkkkkkkkk.","................"];
const CHEST_O=["................","..kkkkkkkkkkkk..",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kkkkkkkkkkkkkk.",".kddddddddddddk.",
 ".kddddddddddddk.",".kooookyykooook.",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kooooooooooook.",".kooooooooooook.",".kkkkkkkkkkkkkk.","................"];
const CPAL={k:'#2a160a',o:'#a8642c',y:'#f0c040',d:'#120a06'};
const chestClosed=art(CHEST_C,CPAL), chestOpen=art(CHEST_O,CPAL);
const graveArt=art(["................","................",".......kk.......","......kwwk......","....kkkwwkkk....","....kwwwwwwk....",
 "....kkkwwkkk....","......kwwk......","......kwwk......","......kwwk......","....kkkkkkkk....","...kggggggggk...","...kkkkkkkkkk..."],{k:'#1a1226',w:'#c8c8d4',g:'#7a5a3a'});

/* ---------- タイル ---------- */
function grass(g,seed){R(g,'#57a43c',0,0,16,16); const r=prng(seed);

const handlers=[]; const held=[];
const pushH=f=>handlers.push(f);
const popH=f=>{const i=handlers.lastIndexOf(f); if(i>=0) handlers.splice(i,1);};
const isDir=b=>b==='up'||b==='down'||b==='left'||b==='right';
function press(b){
  audioInit();
  const h=handlers[handlers.length-1];
  if(h){h(b); return;}
  if(mode==='field'&&!scripting) fieldPress(b);
}
function hold(b){if(isDir(b)&&!held.includes(b)) held.push(b);}
function release(b){const i=held.indexOf(b); if(i>=0) held.splice(i,1);}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',
  KeyZ:'a',Enter:'a',NumpadEnter:'a',Space:'a',KeyX:'b',Escape:'b',Backspace:'b',KeyM:'menu'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  const b=KEYMAP[e.code]; if(!b) return;
  e.preventDefault(); hold(b);
  if(!e.repeat||isDir(b)) press(b);
});
addEventListener('keyup',e=>{const b=KEYMAP[e.code]; if(b) release(b);});
addEventListener('blur',()=>{held.length=0; setDpad(null);});
// タッチ: 十字キーは指をすべらせても方向が変わる
const dpad=document.getElementById('dpad'); let dpadDir=null, repT=null;
function setDpad(d){
  if(d===dpadDir) return;
  if(dpadDir) release(dpadDir);
  clearInterval(repT); dpadDir=d; dpad.dataset.dir=d||'';
  if(d){hold(d); press(d); let n=0; repT=setInterval(()=>{if(++n>3&&handlers.length) press(d);},90);}
}
function dpadFrom(e){
  const r=dpad.getBoundingClientRect(); const x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
  if(Math.hypot(x,y)<12) return dpadDir;
  return Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up');
}
dpad.addEventListener('pointerdown',e=>{e.preventDefault(); dpad.setPointerCapture(e.pointerId); setDpad(dpadFrom(e));});
dpad.addEventListener('pointermove',e=>{if(dpadDir) setDpad(dpadFrom(e));});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dpad.addEventListener(t,()=>setDpad(null)));
document.querySelectorAll('.pbtn[data-b]').forEach(btn=>{
  btn.addEventListener('pointerdown',e=>{e.preventDefault(); btn.classList.add('on'); press(btn.dataset.b);});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,()=>btn.classList.remove('on')));
  btn.addEventListener('click',e=>e.preventDefault());

function audioInit(){
  if(Snd.ac){if(Snd.ac.state==='suspended') Snd.ac.resume(); return;}
  try{Snd.ac=new (window.AudioContext||window.webkitAudioContext)(); Snd.master=Snd.ac.createGain();
    Snd.master.gain.value=Snd.on?1:0; Snd.master.connect(Snd.ac.destination);}catch(e){Snd.ac=null; return;}
  if(Snd.want){const w=Snd.want; Snd.cur=null; playBgm(w);}
}
function tone(f,t,dur,type='square',vol=.05){
  const a=Snd.ac; if(!a) return; const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.setValueAtTime(vol,t+dur*.6); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g); g.connect(Snd.master); o.start(t); o.stop(t+dur+.03);
}
function noise(t,dur,vol=.08){
  const a=Snd.ac; if(!a) return; const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), g=a.createGain(); s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(Snd.master); s.start(t);
}
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function freq(n){const m=n.match(/^([A-G][#b]?)(\d)$/); if(!m) return 0; return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]+1)*12-69)/12);}
function seq(str,unit){ // "C4 . E4 -" : '.' のばす, '-' やすみ
  const out=[]; let t=0, cur=null;
  for(const tok of str.replace(/\|/g,' ').trim().split(/\s+/)){
    if(tok==='.'){if(cur) cur.len+=unit;}
    else if(tok==='-'){cur=null;}
    else {cur={f:freq(tok),st:t,len:unit}; out.push(cur);}
    t+=unit;
  }
  return {ev:out,len:t};
}
function song(bpm,mel,bass,mw='square',bw='triangle',mv=.035,bv=.06){
  const m=seq(mel,1), b=seq(bass,2);
  const ev=[...m.ev.map(e=>({...e,w:mw,v:mv})),...b.ev.map(e=>({...e,w:bw,v:bv}))].sort((x,y)=>x.st-y.st);
  return {bpm,ev,len:Math.max(m.len,b.len)};
}

function playBgm(name){
  Snd.want=name; if(Snd.cur===name) return;
  stopBgm(); Snd.cur=name; Snd.want=name;
  if(!Snd.ac||!name||!SONGS[name]) return;
  Snd.song=SONGS[name]; Snd.t0=Snd.ac.currentTime+.08; Snd.ptr=0; Snd.loop=0;
  Snd.timer=setInterval(bgmTick,40); bgmTick();
}
function stopBgm(){clearInterval(Snd.timer); Snd.timer=null; Snd.song=null; Snd.cur=null;}
function bgmTick(){
  const s=Snd.song, a=Snd.ac; if(!s||!a) return; const step=60/s.bpm/2, loopDur=s.len*step;
  for(let guard=0;guard<64;guard++){
    const e=s.ev[Snd.ptr]; const t=Snd.t0+Snd.loop*loopDur+e.st*step;
    if(t>a.currentTime+.3) break;
    if(t>=a.currentTime-.02) tone(e.f,t,e.len*step*.92,e.w,e.v);
    if(++Snd.ptr>=s.ev.length){Snd.ptr=0; Snd.loop++;}
  }
}
function jingle(notes,unit=.11,type='square',vol=.05){
  const a=Snd.ac; if(!a) return 0; let t=a.currentTime+.02;
  for(const n of notes){const [nm,len=1]=n.split(':'); if(nm!=='-') tone(freq(nm),t,unit*len*.95,type,vol); t+=unit*len;}
  return (t-a.currentTime)*1000;
}
const sfx={

  bump(){const a=Snd.ac; a&&tone(110,a.currentTime,.07,'square',.05);},
  hit(){const a=Snd.ac; if(a){noise(a.currentTime,.12,.12); tone(220,a.currentTime,.08,'square',.04);}},
  crit(){const a=Snd.ac; if(a){noise(a.currentTime,.25,.16); tone(660,a.currentTime,.06,'square',.05); tone(330,a.currentTime+.06,.12,'square',.05);}},
  hurt(){const a=Snd.ac; if(a){noise(a.currentTime,.18,.14); tone(140,a.currentTime,.15,'sawtooth',.05);}},
  miss(){const a=Snd.ac; a&&tone(440,a.currentTime,.12,'triangle',.06);},
  magic(){const a=Snd.ac; if(a){for(let i=0;i<6;i++) tone(500+i*160,a.currentTime+i*.035,.05,'square',.03);}},
  heal(){jingle(['C5','E5','G5','C6:2'],.07,'triangle',.08);},

  enc(){const a=Snd.ac; if(a){for(let i=0;i<8;i++) tone(i%2?392:523,a.currentTime+i*.045,.04,'square',.05);}},
  stairs(){jingle(['G4','E4','C4'],.07);},
  chest(){jingle(['G4','C5','E5','G5:2'],.08);},
  buy(){jingle(['E6','C6:2'],.06);},
  win(){return jingle(['C5','E5','G5','C6','-','G5','C6:4'],.1);},

function win(cls,style,html){const d=document.createElement('div'); d.className='win '+(cls||''); Object.assign(d.style,style||{}); if(html!=null) d.innerHTML=html; ui.appendChild(d); return d;}
function msgClear(){msgEl.innerHTML='';}
function msgClose(){msgEl.hidden=true; msgClear();}
function waitKey(){return new Promise(res=>{const h=b=>{if(b==='a'||b==='b'){popH(h); res(b);}}; pushH(h);});}
function waitOrKey(ms){return new Promise(res=>{let done=false; const fin=()=>{if(done) return; done=true; popH(h); clearTimeout(t); res();};
  const h=b=>{if(b==='a'||b==='b') fin();}; pushH(h); const t=setTimeout(fin,ms);});}
async function say(text,opt={}){
  const wait=opt.wait||'key';
  msgEl.hidden=false;
  const p=document.createElement('p'); msgEl.appendChild(p);
  while(msgEl.querySelectorAll('p').length>10) msgEl.querySelector('p').remove();
  let skip=false; const h=b=>{if(b==='a'||b==='b') skip=true;}; pushH(h);
  for(let i=1;i<=text.length;i++){
    if(skip){p.textContent=text; break;}
    p.textContent=text.slice(0,i);
    if(i%3===0&&text[i-1]!==' ') sfx.blip();
    await sleep(opt.speed||22);
  }
  popH(h);
  if(wait==='key'){const m=document.createElement('span'); m.className='more'; m.textContent='▼'; msgEl.appendChild(m); await waitKey(); sfx.blip(); m.remove();}
  else if(wait==='auto') await waitOrKey(opt.ms||650);
}
async function lines(arr){msgClear(); for(const t of arr) await say(t); msgClose();}

class Menu{
  constructor(o){this.o=o; this.i=o.start||0; this.items=o.items; this.el=win('menu',o.style); this.render();}
  setItems(it){this.items=it; this.i=clamp(this.i,0,it.length-1); this.render();}
  render(){
    const o=this.o, cols=o.cols||1;
    let h=o.title?`<div class="wt">${o.title}</div>`:'';
    h+=`<div class="grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">`;
    this.items.forEach((it,k)=>{const x=typeof it==='string'?{label:it}:it;
      h+=`<div class="it${k===this.i?' sel':''}${x.disabled?' dis':''}"><span class="cur">${k===this.i?'▶':''}</span><span class="lb">${x.label}</span><span class="rt">${x.right??''}</span></div>`;});
    h+='</div>';
    if(o.desc){const d=o.desc(this.i); if(d) h+=`<div class="desc">${d}</div>`;}
    this.el.innerHTML=h; this.el.classList.toggle('active',!!this.active);
  }
  pick(){
    return new Promise(res=>{
      this.active=true; this.render(); const n=this.items.length, cols=this.o.cols||1;
      const h=b=>{
        let j=this.i;
        if(b==='up') j=(this.i-cols+n*cols)%n;
        else if(b==='down') j=(this.i+cols)%n;
        else if(b==='left'&&cols>1) j=(this.i-1+n)%n;
        else if(b==='right'&&cols>1) j=(this.i+1)%n;
        else if(b==='a'){popH(h); this.active=false; this.render(); sfx.ok(); res(this.i); return;}
        else if(b==='b'||b==='menu'){if(this.o.cancel===false) return; popH(h); this.active=false; this.render(); sfx.blip(); res(-1); return;}
        if(j!==this.i){this.i=j; sfx.blip(); this.render(); this.o.onMove&&this.o.onMove(j);}
      };
      pushH(h); this.o.onMove&&this.o.onMove(this.i);
    });
  }
  close(){this.el.remove();}
}

/* ---------- フィールド ---------- */
function curMap(){return MAPS[S.map];}
function tileAt(x,y){const m=curMap(); const r=m.rows[y]; if(!r||x<0||x>=r.length) return m.out; return r[x];}
function inBounds(x,y){const m=curMap(); return y>=0&&y<m.rows.length&&x>=0&&x<m.rows[y].length;}
function loadNPCs(){
  const m=curMap();
  npcs=(m.npcs||[]).filter(n=>!n.cond||n.cond()).map(n=>({...n,def:n,ox:n.x,oy:n.y,fx:n.x,fy:n.y,t:1,moving:false,wt:1000+Math.random()*2000}));
}
function npcAt(x,y){return npcs.find(n=>(n.x===x&&n.y===y)||(n.moving&&n.fx===x&&n.fy===y));}
function chestAt(x,y){return (curMap().chests||[]).find(c=>c.x===x&&c.y===y);}
function blocked(x,y){
  if(!inBounds(x,y)) return !curMap().edgeExit;
  if(SOLID.has(tileAt(x,y))) return true;
  if(npcAt(x,y)) return true;
  if(chestAt(x,y)) return true;
  return false;
}
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let lastBump=0;
function tryMove(d){
  P.dir=d; const [dx,dy]=DV[d]; const nx=P.x+dx, ny=P.y+dy;
  if(curMap().kind==='world'&&tileAt(nx,ny)==='K'&&!S.flags.opened){run(castleDoor); return;}
  if(!inBounds(nx,ny)&&curMap().edgeExit){run(exitToWorld); return;}
  if(blocked(nx,ny)){const n=performance.now(); if(n-lastBump>260){sfx.bump(); lastBump=n;} return;}
  trail.unshift({x:P.x,y:P.y}); trail.length=Math.min(trail.length,3);
  P.fx=P.x; P.fy=P.y; P.x=nx; P.y=ny; P.t=0; P.moving=true;
}
async function run(fn){if(scripting) return; scripting=true; try{await fn();}finally{scripting=false;}}
function onStep(){
  const m=curMap(), t=tileAt(P.x,P.y);
  if(m.kind==='world'&&W_ICON[t]){run(()=>enterMap(W_ICON[t])); return;}
  if(t==='U'){run(exitToWorld); return;}
  if((t==='u'||t==='d')&&m.links&&m.links[P.x+','+P.y]){const l=m.links[P.x+','+P.y]; run(()=>gotoMap(l[0],l[1],l[2],l[3])); return;}
  // どく・ぬま
  let hurt=false;
  for(const p of aliveP()){
    let d=0; if(p.poison) d++; if(t==='%') d++;
    if(d&&p.hp>1){p.hp=Math.max(1,p.hp-d); hurt=true;}
  }

function followerSpots(){
  const out=[]; const k=P.moving?P.t:1;
  let prevTo={x:P.x,y:P.y}, prevFrom=P.moving?{x:P.fx,y:P.fy}:{x:P.x,y:P.y};
  for(let i=0;i<S.party.length-1;i++){
    const to=trail[i]||prevTo; const from=P.moving?(trail[i+1]||prevFrom):to;
    if(from.x!==to.x||from.y!==to.y) fdir[i]=to.x>from.x?'right':to.x<from.x?'left':to.y>from.y?'down':'up';
    out.push({x:from.x+(to.x-from.x)*k,y:from.y+(to.y-from.y)*k,tx:to.x,ty:to.y,dir:fdir[i]||'down',m:S.party[i+1]});
    prevTo=to; prevFrom=from;
  }
  return out;
}
function updateField(dt){
  if(P.moving){P.t+=dt/170; if(P.t>=1){P.t=1; P.moving=false; onStep();}}
  if(!P.moving&&!scripting&&!handlers.length&&mode==='field'){
    const d=held[held.length-1]; if(d) tryMove(d);
  }
  const fol=followerSpots();
  for(const n of npcs){
    if(n.moving){n.t+=dt/260; if(n.t>=1){n.t=1; n.moving=false;}}
    else if(n.wander&&!scripting){
      n.wt-=dt; if(n.wt<=0){n.wt=1200+Math.random()*2200;
        const d=pickR(['up','down','left','right']); const [dx,dy]=DV[d]; const nx=n.x+dx, ny=n.y+dy; n.dir=d;
        if(Math.abs(nx-n.ox)<=2&&Math.abs(ny-n.oy)<=2&&inBounds(nx,ny)&&!SOLID.has(tileAt(nx,ny))&&!npcAt(nx,ny)&&!chestAt(nx,ny)&&tileAt(nx,ny)!=='+'
          &&!(nx===P.x&&ny===P.y)&&!(P.moving&&nx===P.fx&&ny===P.fy)&&!fol.some(f=>f.tx===nx&&f.ty===ny)){n.fx=n.x; n.fy=n.y; n.x=nx; n.y=ny; n.t=0; n.moving=true;}}
    }
  }
}
function drawField(now){
  const m=curMap(); const k=P.moving?P.t:1;
  const pxx=P.moving?(P.fx+(P.x-P.fx)*k):P.x, pyy=P.moving?(P.fy+(P.y-P.fy)*k):P.y;
  const camX=Math.round(pxx*TS-(SW/2-8)), camY=Math.round(pyy*TS-(SH/2-8));
  const fr=Math.floor(now/500)%2;
  const x0=Math.floor(camX/TS), y0=Math.floor(camY/TS);
  for(let ty=y0;ty<=y0+VH+1;ty++) for(let tx=x0;tx<=x0+VW+1;tx++){
    const ch=tileAt(tx,ty); const t=TILES[ch]||TILES['.']; ctx.drawImage(t[ch==='~'||ch==='='||ch==='%'?fr:0],tx*TS-camX,ty*TS-camY);
  }
  for(const c of (m.chests||[])) ctx.drawImage(S.flags['ch_'+c.id]?chestOpen:chestClosed,c.x*TS-camX,c.y*TS-camY+1);
  const walk=Math.floor(now/260)%2;
  const actors=npcs.map(n=>{const kk=n.moving?n.t:1; return {y:n.fy+(n.y-n.fy)*kk,x:n.fx+(n.x-n.fx)*kk,n,z:0};});
  followerSpots().forEach((f,i)=>actors.push({x:f.x,y:f.y,f,z:-1-i}));
  actors.push({x:pxx,y:pyy,hero:1,z:1});
  actors.sort((a,b)=>a.y-b.y||a.z-b.z);
  for(const a of actors){
    const sx=Math.round(a.x*TS-camX), sy=Math.round(a.y*TS-camY);
    if(a.hero) ctx.drawImage(hero().hp>0?personSprite('hero',P.dir,walk):graveArt,sx,sy-2);
    else if(a.f) ctx.drawImage(a.f.m.hp>0?personSprite(a.f.m.cls,a.f.dir,walk):graveArt,sx,sy-2);
    else if(a.n.mon){const sp=monSprite(a.n.mon); ctx.drawImage(sp,sx,sy-2+(walk?0:-1));}
    else ctx.drawImage(personSprite(a.n.pal,a.n.dir,a.n.wander||a.n.moving?walk:0),sx,sy-2);
  }
  if(m.dark){
    const g=ctx.createRadialGradient(SW/2,SH/2,30,SW/2,SH/2,120); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.72)');
    ctx.fillStyle=g; ctx.fillRect(0,0,SW,SH);
  }
}

function applyTo(t,eff,pow,tgt){
  if(eff==='heal'){if(tgt.hp<=0) return null; if(tgt.hp>=tgt.mhp) return 'full'; const v=Math.min(rnd(...pow),tgt.mhp-tgt.hp); tgt.hp+=v; sfx.heal(); return `${tgt.name}の HPが ${v}ポイント かいふくした！`;}
  if(eff==='mp'){if(tgt.hp<=0) return null; if(tgt.mp>=tgt.mmp) return 'full'; const v=Math.min(rnd(...pow),tgt.mmp-tgt.mp); tgt.mp+=v; sfx.heal(); return `${tgt.name}の MPが ${v}ポイント かいふくした！`;}
  if(eff==='cure'){if(tgt.hp<=0||!tgt.poison) return 'none'; tgt.poison=false; sfx.heal(); return `${tgt.name}の からだから どくが きえた！`;}
  if(eff==='wake'){if(tgt.hp<=0||!tgt.sleep) return 'none'; tgt.sleep=false; sfx.ok(); return `${tgt.name}は めを さました！`;}
  if(eff==='revive'){if(tgt.hp>0) return 'none'; tgt.hp=Math.ceil(tgt.mhp/2); tgt.poison=false; tgt.sleep=false; sfx.heal(); flash('#fff8c0',300); return `${tgt.name}は いきかえった！`;}
  return null;
}

/* ---------- 戦闘 ---------- */
const BG={
  field:['#3a6ad0','#9ac8f0','#4a9a3c','#2e6a26'],
  forest:['#2a5a6a','#7ab0a0','#2e6a2a','#1a4a1c'],
  beach:['#3a7ae0','#bfe4f8','#e0c886','#b89a5a'],
  swamp:['#3a2a5a','#8a7aa8','#5a3a6a','#3a2448'],
  cave:['#120c0a','#3a2e26','#5a4a3c','#3a2e24'],
  tower:['#1a2a24','#4a6a5a','#5a6a52','#34442e'],
  castle:['#140a24','#3e2460','#4a3a5a','#2a1e38'],
};
function mkEnemy(id){const d=MON[id]; return {id,d,name:d.n,hp:d.hp,mhp:d.hp,atk:d.atk,def:d.def,agi:d.agi,flashT:0,dieT:0,x:0,sleep:false};}
function labelEnemies(en){
  const cnt={}; en.forEach(e=>cnt[e.id]=(cnt[e.id]||0)+1); const seen={};
  en.forEach(e=>{if(cnt[e.id]>1){seen[e.id]=(seen[e.id]||0)+1; e.label=e.name+' '+'ABC'[seen[e.id]-1];} else e.label=e.name;});
}
function layoutEnemies(){
  const sc=e=>e.d.scale||3; const gap=8; const total=B.en.reduce((s,e)=>s+16*sc(e),0)+gap*(B.en.length-1);
  let x=SW/2-total/2; for(const e of B.en){e.x=x+8*sc(e); x+=16*sc(e)+gap;}
}
const alive=()=>B.en.filter(e=>e.hp>0);
function drawBattle(now){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,SW,SH);
  const c=BG[B.area]||BG.field; const bx=10,by=50,bw=SW-20,bh=68;
  let g=ctx.createLinearGradient(0,by,0,by+bh*.62); g.addColorStop(0,c[0]); g.addColorStop(1,c[1]);
  ctx.fillStyle=g; ctx.fillRect(bx,by,bw,bh*.62);
  g=ctx.createLinearGradient(0,by+bh*.62,0,by+bh); g.addColorStop(0,c[2]); g.addColorStop(1,c[3]);
  ctx.fillStyle=g; ctx.fillRect(bx,by+bh*.62,bw,bh*.38);
  if(B.area==='castle'||B.area==='cave'||B.area==='tower'){ctx.fillStyle='rgba(255,255,255,.06)'; for(let i=0;i<6;i++) ctx.fillRect(bx+12+i*38,by+6,10,bh*.56);}
  ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
  for(let i=0;i<B.en.length;i++){
    const e=B.en[i]; const sp=monSprite(e.id,e.alt); const sc=e.d.scale||3;
    if(e.dieT&&now-e.dieT>420) continue;
    if(e.flashT&&now-e.flashT<360&&Math.floor((now-e.flashT)/60)%2===0) continue;
    const w=16*sc, h=(sp.bot+1)*sc; const bob=e.d.boss||e.sleep?0:Math.sin(now/300+i)*1.2;
    const x=Math.round(e.x-w/2), y=Math.round(112-h+bob);
    ctx.save();
    if(e.dieT){const k=(now-e.dieT)/420; ctx.globalAlpha=1-k; ctx.drawImage(sp,0,0,16,sp.height,x,y+k*10,w,sp.height*sc*(1-k*.4));}
    else ctx.drawImage(sp,0,0,16,sp.height,x,y,w,sp.height*sc);
    ctx.restore();
    if(e.sleep&&e.hp>0){ctx.fillStyle='#fff'; ctx.font='8px monospace'; const z=Math.floor(now/400)%3; ctx.fillText('z'.repeat(z+1),x+w-6,y+4-z*2);}
    if(B.hi===i&&e.hp>0&&Math.floor(now/250)%2===0){ctx.fillStyle='#fff'; const tx=Math.round(e.x); ctx.beginPath(); ctx.moveTo(tx-4,y-8); ctx.lineTo(tx+4,y-8); ctx.lineTo(tx,y-3); ctx.fill();}
  }
}
async function encounterFx(boss){
  sfx.enc(); stopBgm();
  for(let i=0;i<(boss?2:3);i++){fadeEl.style.transitionDuration='0ms'; fadeEl.style.background='#fff'; fadeEl.style.opacity='.85'; await sleep(55); fadeEl.style.opacity='0'; await sleep(55);}
  fadeEl.style.background='#000'; await fadeOut(180);
}
async function battle(ids,opt={}){
  await encounterFx(opt.boss);
  B={en:ids.map(mkEnemy),area:opt.area||'field',boss:!!opt.boss,guard:false,hi:-1,act:-1,lastCmd:[]};
  labelEnemies(B.en); layoutEnemies();
  for(const p of S.party){p.sleep=false; p.defend=false;}
  mode='battle'; playBgm(opt.boss?'boss':'battle'); msgClear();
  showStatus({left:'3%',top:'2.5%'});
  await fadeIn(160);
  if(B.en.length===1) await say(`${B.en[0].name}が あらわれた！`,{wait:'auto'});
  else if(new Set(ids).size===1) await say(`${B.en[0].name}が ${B.en.length}ひき あらわれた！`,{wait:'auto'});
  else await say('まものの むれが あらわれた！',{wait:'auto'});
  let res=null;
  const check=()=>!alive().length?'win':!aliveP().length?'lose':null;
  while(!res){
    const cmds=await partyCommands();
    msgClear(); msgEl.hidden=false;
    S.party.forEach((p,i)=>{p.defend=!!(cmds[i]&&cmds[i].t==='defend');});
    const order=[...S.party.map((p,i)=>({p,i,sp:p.agi*(.6+Math.random()*.6)})).filter(a=>a.p.hp>0),
      ...alive().map(e=>({e,sp:e.agi*(.6+Math.random()*.6)}))].sort((a,b)=>b.sp-a.sp);
    for(const a of order){
      if(a.p){if(a.p.hp>0) res=await memberAct(a.p,cmds[a.i]);}
      else if(a.e.hp>0&&aliveP().length) await enemyAct(a.e);
      if(!res) res=check();
      if(res) break;
    }
    if(!res){
      for(const p of aliveP()) if(p.poison){
        const d=Math.max(1,Math.floor(p.mhp/12)); flash('rgba(120,255,80,.35)',160);
        await say(`${p.name}は どくに むしばまれている！`,{wait:'auto',ms:300}); await hurtMember(p,d,{raw:1});
      }
      res=check();
    }
    S.party.forEach(p=>p.defend=false);
  }
  if(res==='win') await victory();
  for(const p of S.party){p.sleep=false; p.defend=false;}
  if(res==='lose'){await defeat(); return 'lose';}
  await fadeOut(220); hideStatus(); msgClose(); B=null; mode='field'; playBgm(curMap().bgm); await fadeIn(220);
  return res;
}
async function partyCommands(){
  const cmds=[]; const idx=S.party.map((p,i)=>i).filter(i=>S.party[i].hp>0&&!S.party[i].sleep);
  let k=0;
  while(k<idx.length){
    const i=idx[k]; B.act=i; updStatus();
    const c=await memberCommand(S.party[i],i,k>0);
    if(c==='back'){k--; continue;}
    cmds[i]=c; k++;
  }
  B.act=-1; updStatus(); return cmds;
}
async function memberCommand(p,i,canBack){
  msgClear(); msgEl.hidden=true;
  const enList=win('',{right:'3%',bottom:'3%',width:'47%',height:'30%'});
  const updList=()=>{enList.innerHTML=alive().map(e=>`<div>${e.label}${e.sleep?'（ねむり）':''}</div>`).join('');};
  updList();
  const flash2=async t=>{enList.textContent=t; sfx.bump(); await sleep(750); updList();};
  const cm=new Menu({title:p.name,items:['たたかう','じゅもん','どうぐ','ぼうぎょ','にげる'],cols:2,cancel:canBack,start:B.lastCmd[i]||0,style:{left:'3%',bottom:'3%',width:'48%'}});
  try{
    while(true){
      const c=await cm.pick(); if(c<0) return 'back'; B.lastCmd[i]=c;
      if(c===0){const t=await pickTarget(); if(t>=0) return {t:'attack',target:t}; continue;}
      if(c===1){
        const ks=learned(p).filter(k=>SP[k].battle);
        if(!ks.length){await flash2('じゅもんを おぼえていない'); continue;}
        const sm=new Menu({items:ks.map(k=>({label:SP[k].n,right:SP[k].mp,disabled:p.mp<SP[k].mp})),title:`じゅもん（MP ${p.mp}）`,style:{left:'26%',bottom:'3%',right:'3%'},desc:j=>SP[ks[j]].d});
        const j=await sm.pick(); sm.close(); if(j<0) continue;
        const sp=SP[ks[j]];
        if(p.mp<sp.mp){await flash2('MPが たりない！'); continue;}
        const tg=await pickFor(sp.tg); if(tg===undefined) continue;
        return {t:'spell',k:ks[j],target:tg};
      }
      if(c===2){
        const list=bagList(it=>!it.slot&&!it.key&&it.t!=='return');
        if(!list.length){await flash2('つかえる どうぐが ない'); continue;}
        const im=new Menu({items:list,title:'どうぐ',style:{left:'26%',bottom:'3%',right:'3%'},desc:j=>IT[list[j].id].d});
        const j=await im.pick(); im.close(); if(j<0) continue;
        const tg=await pickFor(IT[list[j].id].tg); if(tg===undefined) continue;
        return {t:'item',id:list[j].id,target:tg};
      }
      if(c===3) return {t:'defend'};
      if(c===4) return {t:'flee'};
    }
  } finally {cm.close(); enList.remove(); B.hi=-1;}
}
// たいしょうを えらぶ。 キャンセルなら undefined
async function pickFor(tg){
  if(tg==='one'){const t=await pickTarget(); return t<0?undefined:t;}
  if(tg==='ally'){if(S.party.length===1) return 0; const m=await pickMember('だれに？',x=>x.hp>0,{right:'3%',bottom:'3%',width:'47%'}); return m?S.party.indexOf(m):undefined;}
  if(tg==='dead'){const m=await pickMember('だれに？',x=>x.hp<=0,{right:'3%',bottom:'3%',width:'47%'}); return m?S.party.indexOf(m):undefined;}
  return null;
}
async function pickTarget(){
  const al=alive(); if(al.length===1) return B.en.indexOf(al[0]);
  const m=new Menu({items:al.map(e=>e.label),style:{right:'3%',bottom:'3%',width:'47%'},onMove:i=>{B.hi=B.en.indexOf(al[i]);}});
  const i=await m.pick(); m.close(); B.hi=-1; return i<0?-1:B.en.indexOf(al[i]);
}
function physDmg(atk,def){const base=(atk-def/2)/2; if(base<1) return rnd(0,1); return Math.max(1,Math.floor(base*(.85+Math.random()*.3)));}
function a_kill(){const a=Snd.ac; a&&tone(880,a.currentTime,.12,'square',.04);}
async function hitEnemy(e,dmg){
  e.hp=Math.max(0,e.hp-dmg); e.flashT=performance.now();
  await say(dmg>0?`${e.label}に ${dmg}ポイントの ダメージ！`:`${e.label}に ダメージを あたえられない！`,{wait:'auto',ms:520});
  if(e.hp<=0){e.dieT=performance.now(); a_kill(); await say(`${e.label}を やっつけた！`,{wait:'auto',ms:480}); return;}
  if(e.sleep&&dmg>0&&Math.random()<.3){e.sleep=false; await say(`${e.label}は めを さました！`,{wait:'auto',ms:400});}
}
async function memberAct(p,cmd){
  const n=p.name;
  if(p.sleep){
    if(Math.random()<.4){p.sleep=false; updStatus(); await say(`${n}は めを さました！`,{wait:'auto'});}
    else await say(`${n}は ねむっている。`,{wait:'auto',ms:450});
    return null;
  }
  if(!cmd) return null;
  if(cmd.t==='defend'){await say(`${n}は みを まもっている。`,{wait:'auto',ms:400}); return null;}
  if(cmd.t==='attack'){
    let e=B.en[cmd.target]; if(!e||e.hp<=0) e=alive()[0]; if(!e) return null;
    await say(`${n}の こうげき！`,{wait:'auto',ms:300});
    if(Math.random()<1/32){sfx.miss(); await say(`ミス！ ${e.label}は ひらりと みをかわした！`,{wait:'auto'}); return null;}
    if(Math.random()<CLS[p.cls].crit){sfx.crit(); flash('#ffffff',160); shake(); await say('かいしんの いちげき！',{wait:'auto',ms:350});
      await hitEnemy(e,Math.floor(atkOf(p)*(.85+Math.random()*.15))); return null;}
    sfx.hit(); await hitEnemy(e,physDmg(atkOf(p),e.def)); return null;
  }
  if(cmd.t==='spell'){
    const sp=SP[cmd.k];
    if(p.mp<sp.mp){await say(`${n}は じゅもんを となえようとした。 しかし MPが たりない！`,{wait:'auto'}); return null;}
    p.mp-=sp.mp; updStatus();
    await say(`${n}は ${sp.n}の じゅもんを となえた！`,{wait:'auto',ms:350}); sfx.magic(); await sleep(200);
    if(sp.t==='guard'){B.guard=true; flash('#a0c8ff',260); await say('ひかりの かべが なかまたちを つつみこんだ！',{wait:'auto'}); return null;}
    if(sp.t==='sleep'){
      flash('#c0a0ff',260);
      for(const e of alive()){
        if(e.d.boss) await say(`${e.label}には ききめが なかった！`,{wait:'auto',ms:450});
        else if(!e.sleep&&Math.random()<.6){e.sleep=true; await say(`${e.label}は ねむってしまった！`,{wait:'auto',ms:450});}
        else await say(`${e.label}は ねむらなかった！`,{wait:'auto',ms:400});
      }
      return null;
    }
    if(sp.t==='atk'){
      if(cmd.k==='bolt'){sfx.bolt(); flash('#ffffff',300); shake();}
      else if(cmd.k==='holy'){sfx.bolt(); flash('#fff4b0',380);}
      else if(cmd.k==='ice'){sfx.bolt(); flash('#a0e8ff',300);}
      else {sfx.fire(); flash('#ff8a3a',260);}
      const targets=sp.tg==='all'?alive():[B.en[cmd.target]&&B.en[cmd.target].hp>0?B.en[cmd.target]:alive()[0]];
      for(const e of targets) if(e&&e.hp>0) await hitEnemy(e,rnd(...sp.pow));
      return null;
    }
    const tgt=S.party[cmd.target]; const r=tgt&&applyTo(sp,sp.t,sp.pow,tgt);
    updStatus(); flash('#7dffb0',200);
    await say(r&&!FULLMSG[r]?r:'しかし こうかが なかった！',{wait:'auto'}); return null;
  }
  if(cmd.t==='item'){
    const it=IT[cmd.id];
    if(!has(cmd.id)){await say(`${n}は どうぐを さがしたが みつからなかった！`,{wait:'auto'}); return null;}
    delItem(cmd.id);
    await say(`${n}は ${it.n}を つかった！`,{wait:'auto',ms:350});
    if(it.t==='flee'){if(B.boss){await say('しかし けむりは すぐに かきけされた！',{wait:'auto'}); return null;}
      await say('あたりが けむりに つつまれた！',{wait:'auto'}); await say('みんなは うまく にげきった！',{wait:'auto'}); return 'fled';}
    const tgt=S.party[cmd.target]; const r=tgt&&applyTo(it,it.t,it.pow,tgt); updStatus();
    await say(r&&!FULLMSG[r]?r:'しかし こうかが なかった！',{wait:'auto'}); return null;
  }
  if(cmd.t==='flee'){

async function hurtMember(p,dmg,o={}){

  p.hp=Math.max(0,p.hp-dmg); updStatus();
  if(dmg>0){sfx.hurt(); shake(); flash('rgba(255,40,40,.5)',140);}
  await say(dmg>0?`${p.name}は ${dmg}ポイントの ダメージを うけた！`:`${p.name}は ダメージを うけなかった！`,{wait:'auto',ms:520});
  if(p.hp<=0){p.poison=false; p.sleep=false; updStatus(); await say(`${p.name}は ちからつきた…`,{wait:'auto',ms:600});}
  else if(p.sleep&&dmg>0&&!o.raw&&Math.random()<.3){p.sleep=false; updStatus(); await say(`${p.name}は いたみで めを さました！`,{wait:'auto',ms:400});}
}
async function poisonMember(p,ch=.6){
  if(p.hp<=0||p.poison) return; if(Math.random()>=ch) return;
  p.poison=true; updStatus(); await say(`${p.name}は どくに おかされた！`,{wait:'auto',ms:450});
}
async function sleepMember(p,ch){
  if(p.hp<=0||p.sleep) return;
  if(Math.random()<ch){p.sleep=true; updStatus(); await say(`${p.name}は ねむってしまった！`,{wait:'auto',ms:450});}
  else await say(`${p.name}は ねむらなかった！`,{wait:'auto',ms:380});
}
const randAlly=()=>pickR(aliveP());
async function enemyAttack(e,mult=1,silent,tgt){
  const p=tgt||randAlly(); if(!p) return;
  if(!silent) await say(`${e.label}の こうげき！`,{wait:'auto',ms:300});
  if(Math.random()<1/40){sfx.miss(); await say(`${p.name}は すばやく みをかわした！`,{wait:'auto'}); return;}
  let dmg;
  if(!e.d.boss&&Math.random()<1/48){await say('つうこんの いちげき！',{wait:'auto',ms:300}); dmg=Math.floor(e.atk*.5*(1+Math.random()*.2));}
  else dmg=Math.floor(physDmg(e.atk,defOf(p))*mult);
  if(e.charge){dmg*=2; e.charge=false;}
  await hurtMember(p,dmg);
}
async function hitAll(lo,hi){for(const p of aliveP()) await hurtMember(p,rnd(lo,hi));}
function pickSkill(d){if(!d.sk) return null; let r=Math.random(); for(const s of d.sk){if(r<s.r) return s; r-=s.r;} return null;}
async function enemyAct(e){
  if(e.sleep){
    if(Math.random()<.35){e.sleep=false; await say(`${e.label}は めを さました！`,{wait:'auto',ms:420});}
    else await say(`${e.label}は ねむっている。`,{wait:'auto',ms:380});
    return;
  }
  const d=e.d;
  if(d.ai==='zolga') return zolgaAct(e);
  if(d.ai==='witch') return witchAct(e);
  let sk=pickSkill(d); if(e.charge) sk=null;
  if(sk&&sk.t==='healAlly'){
    const tg=alive().filter(x=>x.hp<x.mhp*.6).sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[0];
    if(!tg) sk=null; else{await say(sk.m.replace('%s',e.label),{wait:'auto',ms:350}); const v=Math.min(rnd(...sk.pow),tg.mhp-tg.hp); tg.hp+=v; await say(`${tg.label}の きずが ${v}ポイント かいふくした！`,{wait:'auto'}); return;}
  }
  if(!sk) return enemyAttack(e);
  await say(sk.m.replace('%s',e.label),{wait:'auto',ms:380});
  if(sk.t==='mag'){sfx.fire(); flash('#ff8a3a',200); await hurtMember(randAlly(),rnd(...sk.pow));}
  else if(sk.t==='breath'){sfx.fire(); flash('#ff8a3a',220); await hitAll(...sk.pow);}
  else if(sk.t==='str') await enemyAttack(e,1.5,true);
  else if(sk.t==='charge') e.charge=true;
  else if(sk.t==='poison'){const p=randAlly(); await enemyAttack(e,1,true,p); await poisonMember(p);}
  else if(sk.t==='sleep1'){flash('#c0a0ff',200); await sleepMember(randAlly(),.5);}
  else if(sk.t==='sleepAll'){flash('#ffc0e0',240); for(const p of aliveP()) await sleepMember(p,.35);}
}
async function witchAct(e){
  const r=Math.random();
  if(r<.22){await say('ネムリアは ねむりの うたを うたった！',{wait:'auto',ms:380}); flash('#c0a0ff',300); for(const p of aliveP()) await sleepMember(p,.4);}
  else if(r<.42){await say('ネムリアは どくの きりを はきだした！',{wait:'auto',ms:380}); flash('rgba(120,255,80,.4)',300);
    for(const p of aliveP()){await hurtMember(p,rnd(12,18)); await poisonMember(p,.5);}}
  else if(r<.64){await say('ネムリアは ほのおの じゅもんを となえた！',{wait:'auto',ms:380}); sfx.fire(); flash('#ff8a3a',240); await hurtMember(randAlly(),rnd(30,40));}
  else if(r<.74&&e.hp<e.mhp*.6&&(e.heals||0)<3){e.heals=(e.heals||0)+1; await say('ネムリアは いやしの うたを うたった！',{wait:'auto',ms:380}); const v=Math.min(80,e.mhp-e.hp); e.hp+=v; await say(`ネムリアの きずが ${v}ポイント かいふくした！`,{wait:'auto'});}
  else await enemyAttack(e);
}
async function zolgaAct(e){
  if(!e.p2&&e.hp<e.mhp*.5){
    e.p2=true; e.alt=true; flash('#ff2050',400); shake();
    await say('ゾルガ「おのれ…！ ならば しんの すがたを みせてやろう！」',{wait:'key'});
    await say('ゾルガの からだから まがまがしい ひかりが あふれだした！',{wait:'auto'});
  }
  const acts=e.p2?2:1;
  for(let k=0;k<acts;k++){
    if(!aliveP().length) return;
    if(k===1&&Math.random()>.4) return;
    const r=Math.random();
    if(!e.p2){
      if(r<.35) await enemyAttack(e);
      else if(r<.63){await say('ゾルガは いかずちの あらしを よびよせた！',{wait:'auto',ms:380}); sfx.bolt(); flash('#ffffff',300); await hitAll(26,36);}
      else if(r<.83){await say('ゾルガは やみの いきを はきだした！',{wait:'auto',ms:380}); flash('#6a30a0',260); for(const p of aliveP()){await hurtMember(p,rnd(18,26)); await sleepMember(p,.2);}}
      else if((e.heals||0)<2&&e.hp<e.mhp*.8){e.heals=(e.heals||0)+1; await say('ゾルガは やみの ちからで きずを いやした！',{wait:'auto',ms:380}); const v=Math.min(120,e.mhp-e.hp); e.hp+=v; await say(`ゾルガの きずが ${v}ポイント かいふくした！`,{wait:'auto'});}
      else await say('ゾルガは ふきみに わらっている…',{wait:'auto'});
    }else{
      if(r<.3) await enemyAttack(e);
      else if(r<.62){await say('ゾルガは やみの ほのおを はなった！',{wait:'auto',ms:380}); sfx.fire(); flash('#a020ff',300); await hurtMember(randAlly(),rnd(55,70));}
      else if(r<.9){await say('ゾルガは いかずちの あらしを よびよせた！',{wait:'auto',ms:380}); sfx.bolt(); flash('#ffffff',300); await hitAll(28,38);}
      else await say('ゾルガは こちらを じっと にらんでいる…',{wait:'auto'});
    }
  }
}
async function victory(){
  const exp=B.en.reduce((s,e)=>s+e.d.exp,0), gold=B.en.reduce((s,e)=>s+e.d.g,0);
  stopBgm(); const ms=sfx.win();
  await say(B.en.length>1?'まものたちを やっつけた！':`${B.en[0].name}を たおした！`,{wait:'auto',ms:Math.max(500,(ms||0)-200)});
  if(exp){aliveP().forEach(p=>p.exp+=exp); await say(S.party.length>1?`みんなは けいけんち ${exp}ポイントを かくとく！`:`けいけんち ${exp}ポイントを かくとく！`,{wait:'auto'});}
  if(gold){S.gold+=gold; await say(`${gold}ゴールドを てにいれた！`,{wait:'auto'});}
  if(!B.boss&&Math.random()<.1){const it=pickR(['herb','herb','antidote']); addItem(it); await say(`まものは ${IT[it].n}を おとしていった！`,{wait:'auto'});}
  for(const p of aliveP()){
    while(p.lv<MAXLV&&p.exp>=expFor(p.lv+1)){
      const before=learned(p); const d=growth(p); p.hp+=d.hp; p.mp+=d.mp; updStatus();
      const lms=sfx.lvl();
      await say(`${p.name}は レベル ${p.lv}に あがった！`,{wait:'auto',ms:Math.max(700,lms||0)});
      await say(`ちから+${d.str} すばやさ+${d.agi} さいだいHP+${d.hp}`+(d.mp?` さいだいMP+${d.mp}`:''),{wait:'auto',ms:800});
      for(const k of learned(p)) if(!before.includes(k)) await say(`${p.name}は ${SP[k].n}の じゅもんを おぼえた！`,{wait:'auto',ms:900});
    }
  }
  {const m=document.createElement('span'); m.className='more'; m.textContent='▼'; msgEl.appendChild(m); await waitKey(); m.remove();}
}
async function defeat(){
  stopBgm(); const ms=sfx.lose();
  await say(S.party.length>1?'ぜんめつ してしまった…':`${HN()}は ちからつきた…`,{wait:'auto',ms:Math.max(1200,ms||0)});
  {const m=document.createElement('span'); m.className='more'; m.textContent='▼'; msgEl.appendChild(m); await waitKey(); m.remove();}
  await fadeOut(700); hideStatus(); msgClose(); B=null; mode='field';
  restoreAll(); S.gold=Math.floor(S.gold/2);
  S.map='village'; P.x=3; P.y=5; P.dir='up'; P.moving=false; trail=[]; stepsSince=0; loadNPCs(); playBgm('town');
  await sleep(400); await fadeIn(600);
  msgClear();
  await say('…きがつくと そこは ミナモむらの やどやだった。');
  await say('「たおれていた あなたたちを むらの ひとが はこんで きたのよ。 むりは しないでね。」');
  await say('（もっていた ゴールドが はんぶんに なってしまった）'); msgClose();
}

/* ---------- エンディング ---------- */
const stars=[...Array(90)].map(()=>({x:Math.random()*SW,y:Math.random()*SH*.8,p:Math.random()*6,s:Math.random()<.15?2:1}));
let endStars=0;
function drawSky(now,count){
  const g=ctx.createLinearGradient(0,0,0,SH); g.addColorStop(0,'#05061a'); g.addColorStop(1,'#1c2250');
  ctx.fillStyle=g; ctx.fillRect(0,0,SW,SH);
  for(let i=0;i<Math.min(count,stars.length);i++){const s=stars[i]; const a=.5+.5*Math.sin(now/500+s.p); ctx.fillStyle=`rgba(255,250,220,${a})`; ctx.fillRect(s.x|0,s.y|0,s.s,s.s);}
  ctx.fillStyle='#0b0e24'; ctx.beginPath(); ctx.moveTo(0,SH); for(let x=0;x<=SW;x+=8) ctx.lineTo(x,SH-28-Math.sin(x/30)*8-Math.sin(x/11)*3); ctx.lineTo(SW,SH); ctx.fill();
}
async function ending(){
  msgClear();
  await say('ゾルガ「ば… ばかな… この わしが… にんげん ごときに…」');
  flash('#ffffff',600); shake();
  await say('ゾルガは くろい きりと なって きえていった…');
  S.flags.zolga=1; addItem('orb'); loadNPCs(); sfx.chest();
  await say(`${HN()}たちは ほしのたまを とりもどした！`);
  msgClose(); await fadeOut(900);
  mode='ending'; endStars=0; playBgm('town'); await fadeIn(900);
  const grow=setInterval(()=>{endStars=Math.min(stars.length,endStars+2);},90);
  msgClear();
  await say('ほしのたまが まばゆい ひかりを はなち、 よぞらへ のぼっていく…');
  await say('ひとつ、 またひとつ。 そらに ほしが もどってきた。');
  const names=S.party.map(p=>p.name).join('と ');
  await say(`ひとびとは ほしぞらを みあげ、 ${names}の なまえを いつまでも たたえたという。`);
  msgClose(); clearInterval(grow); endStars=stars.length;
  endUI=document.createElement('div'); endUI.className='end';
  endUI.innerHTML=`<div class="logo">おわり</div><p>あそんでくれて ありがとう！</p><p style="font-size:2.8cqw;color:var(--sub)">${S.party.map(p=>p.name+' Lv'+p.lv).join('　')}</p>`;
  ui.appendChild(endUI);
  const m=new Menu({items:['ぼうけんを つづける'],cancel:false,style:{left:'50%',bottom:'6%',transform:'translateX(-50%)'}});
  await m.pick(); m.close(); endUI.remove(); endUI=null;
  await fadeOut(500);
  mode='field'; S.map='village'; P.x=14; P.y=12; P.dir='up'; P.moving=false; trail=[]; loadNPCs(); playBgm('town'); saveGame();
  await fadeIn(500); toast('ミナモむら');
}

/* ---------- タイトル ---------- */
async function titleScreen(){
  mode='title'; playBgm('town');
  titleUI=document.createElement('div'); titleUI.className='title';
  titleUI.innerHTML='<div class="logo">ほしかげの剣</div><div class="sub">― きえた ほしの ものがたり ―</div><div class="foot">A：けってい　B：もどる</div>';
  ui.appendChild(titleUI);
  const sv=loadSave();
  const m=new Menu({items:[{label:'はじめから'},{label:'つづきから',disabled:!sv}],cancel:false,start:sv?1:0,style:{left:'50%',top:'56%',transform:'translateX(-50%)',width:'40%'}});
  let c;
  while(true){c=await m.pick(); if(c===1&&!sv){sfx.bump(); continue;} break;}
  m.close();
  if(c===1){
    titleUI.remove(); titleUI=null;
    await fadeOut(300);
    S=sv; S.flags=S.flags||{}; if(!MAPS[S.map]) S.map='village';
    P.x=S.x; P.y=S.y; P.dir=S.dir||'down'; P.moving=false; trail=[]; mode='field'; loadNPCs(); playBgm(curMap().bgm);
    await fadeIn(300); toast(curMap().name||'フィールド');
    return;
  }
  const name=await askName();
  titleUI.remove(); titleUI=null;
  newGame(name); await fadeOut(400);
  mode='ending'; endStars=0; stopBgm(); await fadeIn(400);
  msgClear();
  await say('ある よる、 そらから すべての ほしが きえた。');
  await say('まおう ゾルガが ほしの ちからを やどす『ほしのたま』を うばったのだ。');
  await say(`ちいさな ミナモむらで くらす わかもの ${HN()}は、 むらの ちょうろうに よばれた…`);
  msgClose(); await fadeOut(500);
  scripting=true;
  try{
    mode='field'; P.x=S.x; P.y=S.y; P.dir=S.dir; P.moving=false; trail=[]; loadNPCs(); playBgm('town');
    await fadeIn(500); toast('ミナモむら');
    await elderTalk();
  } finally {scripting=false;}
}
function askName(){
  return new Promise(res=>{
    const w=win('namebox',{},'<div>なまえを いれてください</div><input id="hero-name" maxlength="6" value="ユウ" autocomplete="off" aria-label="ゆうしゃの なまえ"><button type="button" id="name-ok">けってい</button>');
    const inp=w.querySelector('input'), btn=w.querySelector('button');
    const done=()=>{const v=(inp.value||'').trim().slice(0,6)||'ユウ'; popH(h); w.remove(); sfx.ok(); res(v);};
    const h=b=>{if(b==='a') done();};
    pushH(h);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault(); done();}});
    btn.addEventListener('click',done);
    setTimeout(()=>{if(matchMedia('(pointer:fine)').matches) inp.focus();},50);
  });
}

/* ---------- メインループ ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last); last=now;
  if(mode==='field'&&S){updateField(dt); drawField(now);}
  else if(mode==='battle'&&B) drawBattle(now);
  else if(mode==='title') drawSky(now,stars.length);
  else if(mode==='ending') drawSky(now,endStars);
  if(flashFx){const k=(now-flashFx.t0)/flashFx.ms; if(k>=1) flashFx=null; else{ctx.save(); ctx.globalAlpha=(1-k)*.8; ctx.fillStyle=flashFx.color; ctx.fillRect(0,0,SW,SH); ctx.restore();}}
  requestAnimationFrame(frame);
}
defineObjects();
requestAnimationFrame(frame);
function start(){titleScreen();}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) try{hot.snapshot(()=>({}));}catch(e){}
if(hot&&hot.ready) hot.ready(start); else start();
window.__rpg={get busy(){return scripting||handlers.length>0}, get S(){return S}, get B(){return B}, P, MAPS, battle, gotoMap, press, get mode(){return mode}, expFor, MON, MSPR, PERSON, mkMember, joinParty};
</script>
