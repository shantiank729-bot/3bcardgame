<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ほしかげの剣</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* レイアウト: 夜空の上に 4:3 のゲーム画面を1枚。下にタッチ用の十字キーとA/B。単一のダークな世界観 */
:root{
  --night:#080a1c; --night2:#141838; --ink:#f3f0ff; --sub:#9da3d6;
  --gold:#ffd451; --pad:#1c2046; --pad-edge:#3a4182; --pad-hi:#2f3678;
  --win:#000000; --edge:#f3f0ff; --warn:#ffae42;
  --f-pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--f-pix);
  background:var(--night);
  background-image:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 9%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 32%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 90% 60%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 74%,#fff4 50%,transparent 51%),
    linear-gradient(var(--night),var(--night2));
  background-attachment:fixed;
  padding-block:12px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none;
}
.app{max-width:780px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:12px}
.bar{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px}
.bar h1{margin:0; font-size:1.05rem; font-weight:400; letter-spacing:.12em; color:var(--gold); text-shadow:0 0 8px #ffd45155}
.bar button{
  font:inherit; font-size:.85rem; color:var(--ink); background:var(--pad); border:1px solid var(--pad-edge);
  border-radius:999px; padding:4px 12px; cursor:pointer;
}
button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

.screen{
  --reserve:300px;
  position:relative; width:min(100%, max(280px, calc((100dvh - var(--reserve)) * 1.3636)));
  aspect-ratio:240/176; max-width:100%;
  container-type:inline-size; background:#000; border-radius:6px; overflow:hidden;
  box-shadow:0 0 0 2px #2a2f63, 0 12px 40px #000a;
}
.screen.shake{animation:shake .26s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-1.2%,.6%)}40%{transform:translate(1.2%,-.6%)}60%{transform:translate(-.8%,.4%)}80%{transform:translate(.8%,0)}}
canvas{display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges}
#ui{position:absolute; inset:0; pointer-events:none}
#ui .win, #ui input, #ui button{pointer-events:auto}
#fade{position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .2s linear}

/* DQ風ウインドウ: 黒地に白い角丸の枠 */
.win{
  position:absolute; background:var(--win); color:var(--ink);
  border:.75cqw solid var(--edge); border-radius:1.4cqw; outline:.5cqw solid #000;
  padding:1.4cqw 2.4cqw; font-size:3.7cqw; line-height:1.45; letter-spacing:.04em;
}
#msg{left:3%; right:3%; bottom:3%; height:30%; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:2cqw}
#msg p{margin:0; white-space:pre-wrap}
#msg .more{position:absolute; left:50%; bottom:.2cqw; transform:translateX(-50%); font-size:2.6cqw; animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.menu .wt{font-size:.85em; text-align:center; color:var(--ink); margin-bottom:.15em; opacity:.85}
.menu .grid{display:grid; column-gap:2.2cqw}
.menu .it{display:grid; grid-template-columns:3.2cqw minmax(0,1fr) auto; column-gap:.8cqw; white-space:nowrap}
.menu .rt{text-align:right; font-variant-numeric:tabular-nums}
.menu .dis .lb,.menu .dis .rt{opacity:.45}
.menu.active .sel .cur{animation:blink .5s steps(1) infinite}
.menu .desc{margin-top:.3em; font-size:.82em; color:var(--sub); white-space:normal}
.stat .row{display:flex; justify-content:space-between; gap:2cqw; font-variant-numeric:tabular-nums}
.stat.low{color:var(--warn); border-color:var(--warn)}
.stat .nm{text-align:center; border-bottom:.4cqw solid currentColor; margin-bottom:.2em}
.toast{left:50%; top:4%; transform:translateX(-50%); white-space:nowrap; transition:opacity .4s}
.big{font-size:3.4cqw}
.big .row{display:flex; justify-content:space-between; gap:3cqw; font-variant-numeric:tabular-nums}

/* タイトル */
.title{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:12%; pointer-events:none; text-align:center}
.title .logo{font-size:10.5cqw; color:var(--gold); letter-spacing:.14em; text-shadow:0 .6cqw 0 #6a3d00, 0 0 3cqw #ffd45188; line-height:1.1}
.title .sub{font-size:3.2cqw; color:var(--sub); letter-spacing:.3em; margin-top:1.6cqw}
.title .foot{position:absolute; bottom:3%; font-size:2.6cqw; color:#8f95c8}
.namebox{left:50%; top:50%; transform:translate(-50%,-50%); width:68%; text-align:center}
.namebox input{
  width:100%; margin:2cqw 0; font:inherit; font-size:5cqw; text-align:center; color:var(--ink);
  background:#111; border:.5cqw solid #888; border-radius:1cqw; padding:1cqw;
}
.namebox input:focus{outline:none; border-color:var(--gold)}
.namebox button{font:inherit; font-size:3.6cqw; color:#000; background:var(--gold); border:0; border-radius:1cqw; padding:1cqw 4cqw; cursor:pointer}
.end{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none}
.end .logo{font-size:8cqw; color:var(--gold); letter-spacing:.14em; text-shadow:0 0 3cqw #ffd45188}
.end p{font-size:3.6cqw; margin:2cqw 0 0}

/* タッチ操作 */
.pad{width:min(100%,520px); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; touch-action:none}
.dpad{position:relative; width:136px; height:136px; touch-action:none}
.dpad .arm{position:absolute; background:var(--pad); border:2px solid var(--pad-edge)}
.dpad .v{left:44px; width:48px; top:0; height:136px; border-radius:10px}
.dpad .h{top:44px; height:48px; left:0; width:136px; border-radius:10px}
.dpad .hub{position:absolute; left:46px; top:46px; width:44px; height:44px; background:var(--pad)}
.dpad .tri{position:absolute; width:0; height:0; border:9px solid transparent; opacity:.7}
.dpad .tri.u{left:59px; top:10px; border-bottom:12px solid var(--ink); border-top:0}
.dpad .tri.d{left:59px; bottom:10px; border-top:12px solid var(--ink); border-bottom:0}
.dpad .tri.l{top:59px; left:10px; border-right:12px solid var(--ink); border-left:0}
.dpad .tri.r{top:59px; right:10px; border-left:12px solid var(--ink); border-right:0}
.dpad .glow{position:absolute; width:48px; height:48px; border-radius:10px; background:var(--pad-hi); opacity:0}
.dpad[data-dir="up"] .g-up,.dpad[data-dir="down"] .g-down,.dpad[data-dir="left"] .g-left,.dpad[data-dir="right"] .g-right{opacity:1}
.g-up{left:44px; top:0}.g-down{left:44px; bottom:0}.g-left{left:0; top:44px}.g-right{right:0; top:44px}
.pbtn{font:inherit; color:var(--ink); background:var(--pad); border:2px solid var(--pad-edge); cursor:pointer; touch-action:none}
.pbtn.on{background:var(--pad-hi)}
.ab{position:relative; width:150px; height:132px}
.ab .pbtn{position:absolute; width:62px; height:62px; border-radius:50%; font-size:1.3rem}
.ab .ba{right:0; top:6px; color:var(--gold); border-color:#8a7330}
.ab .bb{left:0; bottom:6px}
.ab .mbtn{left:0; top:0; width:auto; height:auto; border-radius:999px; padding:4px 12px; font-size:.75rem; letter-spacing:.08em; white-space:nowrap}
.ab small{position:absolute; font-size:.7rem; color:var(--sub)}
.keys{margin:0; font-size:.8rem; color:var(--sub); text-align:center; line-height:1.8; text-wrap:balance; display:none}
@media (hover:hover) and (pointer:fine){
  .pad{display:none}
  .keys{display:block}
  .screen{--reserve:150px}
}
@media (max-width:380px){
  .dpad{transform:scale(.88); transform-origin:left center}
  .ab{transform:scale(.88); transform-origin:right center}
}
</style>

<div class="app">
  <header class="bar">
    <h1>ほしかげの剣</h1>
    <button id="snd" type="button" aria-pressed="true">♪ おと ON</button>
  </header>
  <div class="screen" id="screen">
    <canvas id="cv"></canvas>
    <div id="ui"><div id="msg" class="win" hidden></div></div>
    <div id="fade"></div>
  </div>
  <div class="pad" id="pad">
    <div class="dpad" id="dpad" aria-label="十字キー">
      <div class="arm v"></div><div class="arm h"></div><div class="hub"></div>
      <div class="glow g-up"></div><div class="glow g-down"></div><div class="glow g-left"></div><div class="glow g-right"></div>
      <div class="tri u"></div><div class="tri d"></div><div class="tri l"></div><div class="tri r"></div>
    </div>
    <div></div>
    <div class="ab">
      <button class="pbtn mbtn" data-b="menu" type="button">メニュー</button>
      <button class="pbtn bb" data-b="b" type="button">B</button>
      <button class="pbtn ba" data-b="a" type="button">A</button>
    </div>
  </div>
  <p class="keys">矢印キー / WASD：いどう ・ Z / Enter / Space：けってい・はなす・しらべる ・ X / Esc：キャンセル・メニュー</p>
</div>

<script>
'use strict';
/* =========================================================
   ほしかげの剣 — オリジナルのフィールド探索型RPG
   ========================================================= */
const TS=16, VW=15, VH=11, SW=VW*TS, SH=VH*TS;
const cv=document.getElementById('cv'); cv.width=SW; cv.height=SH;
const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const ui=document.getElementById('ui'), msgEl=document.getElementById('msg');
const fadeEl=document.getElementById('fade'), screenEl=document.getElementById('screen');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickR=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
};
const SAVE_KEY='hoshikage-save-v1';

/* ---------- ピクセルアート ---------- */
function art(rows,pal,flip){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); let top=h, bot=0;
  for(let y=0;y<h;y++){const r=rows[y]; for(let x=0;x<r.length;x++){const col=pal[r[x]]; if(!col) continue;
    g.fillStyle=col; g.fillRect(flip?w-1-x:x,y,1,1); top=Math.min(top,y); bot=Math.max(bot,y);}}
  c.top=top; c.bot=bot; return c;
}
function mkTile(fn){const c=document.createElement('canvas'); c.width=c.height=16; const g=c.getContext('2d'); fn(g); return c;}
function R(g,c,x,y,w=1,h=1){g.fillStyle=c; g.fillRect(x,y,w,h);}
function prng(seed){let s=seed>>>0||1; return ()=>{s=(s*1664525+1013904223)>>>0; return s/4294967296;};}

/* 人物 (16x16) */
const PERSON={
 down:[[
"................",".....kkkkkk.....","....khhhhhhk....","...khhhhhhhhk...","...khhhhhhhhk...",
"...khsssssshk...","...kskssssksk...","...kssssssssk...","....kssssssk....","...krrrrrrrrk...",
"..kggggggggggk..","..ksgggbbgggsk..","..kkggggggggkk..","...kggggggggk...","...kbbk..kbbk...","...kkkk..kkkk..."],
 null],
 up:[[
"................",".....kkkkkk.....","....khhhhhhk....","...khhhhhhhhk...","...khhhhhhhhk...",
"...khhhhhhhhk...","...khhhhhhhhk...","...khhhhhhhhk...","....khhhhhhk....","...krrrrrrrrk...",
"..kggggggggggk..","..ksggggggggsk..","..kkggggggggkk..","...kggggggggk...","...kbbk..kbbk...","...kkkk..kkkk..."],
 null],
 side:[[
"................",".....kkkkkk.....","....khhhhhhk....","...khhhhhhhhk...","...khhhhhhhhk...",
"...khhhhhsssk...","...khhhhssksk...","...khhhssssssk..","....khssssssk...","....krrrrrrk....",
"...kggggggggk...","...kggggsgggk...","...kggggggggk...","....kggggggk....","...kbbk..kbbk...","...kkkk..kkkk..."],
 null],
};
for(const d of ['down','up','side']){
  const a=PERSON[d][0].slice();
  a[14]="....kbbkkbbk...."; a[15]="....kkkkkkkk....";
  PERSON[d][1]=a;
}
const PPAL={
  hero:{h:'#6e3f1e',g:'#3d8f52',r:'#e04a3a'},
  elder:{h:'#eeeeee',g:'#6a4a9a',r:'#a88ad0'},
  woman:{h:'#e0782c',g:'#d86a9a',r:'#f4e0a0'},
  kid:{h:'#3a2a1a',g:'#4a7ad8',r:'#f0d040'},
  merchant:{h:'#2a2020',g:'#a07040',r:'#f0c040'},
  guard:{h:'#9aa0b0',g:'#3a5ab0',r:'#c0c8d8'},
  granny:{h:'#c8c8d0',g:'#7a6a50',r:'#c09a6a'},
  inn:{h:'#8a3a2a',g:'#e8e0d0',r:'#c84a4a'},
  sage:{h:'#d0d0d8',g:'#2e6a6a',r:'#e0c040'},
};
const sprCache={};
function personSprite(palName,dir,frame){
  const key=palName+dir+frame; if(sprCache[key]) return sprCache[key];
  const p=Object.assign({k:'#1a1226',s:'#f6c79f',b:'#5a3a22'},PPAL[palName]);
  const d=dir==='left'||dir==='right'?'side':dir;
  return sprCache[key]=art(PERSON[d][frame],p,dir==='left');
}

/* モンスター (16x16) — すべてオリジナルデザイン */
const MSPR={
 seed:["................","........kk......",".......k33k.....","......k33k......",".....kkk3kkk....",
  "....k1111111k...","...k111111111k..","..k11wk111wk11k.","..k11kk111kk11k.","..k11111111111k.",
  "..k12111111121k.","..k11112221111k.","...k222222222k..","....k2222222k...",".....kkkkkkk....","................"],
 beast:["................","................","................","..k..k..........",".k1kk1k.........",
  ".k11111k........","k1e11111k.....kk","k3111111kkkkkk1k",".kw111111111111k","..kk11111111111k",
  "...k11111111112k","...k1221111221k.","...k1kk1k1kk1k..","...kk.kk.kk.kk..","................","................"],
 bat:["................","......k..k......",".....k1kk1k.....","k...k111111k...k","kk..k1e11e1k..kk",
  "k2k.k111111k.k2k","k22kk11ww11kk22k","k222k111111k222k","k2222k1111k2222k","k22222kkkk22222k",
  "k2k2k2k..k2k2k2k","kk.k.k....k.k.kk","................","................","................","................"],
 shroom:["................",".....kkkkkk.....","...kk11ww111kk..","..k111ww111111k.",".k11111111ww111k",
  ".k1ww1111111ww1k","..kkkkkkkkkkkk..","....k333333k....","....k3k33k3k....","....k333333k....",
  "...kk322223kk...","..k3k333333k3k..","...kk333333kk...","....k3kkkk3k....","....kkk..kkk....","................"],
 snake:["................",".......kkkk.....","......k1111k....",".....k1e11e1k...",".....k111111k...",
  "......k1ww1k....",".......k11k.....",".......k12k.....","....kkkk12kkk...","...k2111111112k.",
  "..k211222222112k","..k111111111111k",".k2112222222211k",".k111111111111k.","..kkkkkkkkkkkk..","................"],
 golem:["................","....kkkkkkkk....","...k11111111k...","...k1ee11ee1k...","...k11111111k...",
  ".kkk12222221kkk.","k111k111111k111k","k121k121121k121k","k111k111111k111k","k121k122221k121k",
  ".kkkk111111kkkk.","....k11kk11k....","....k11kk11k....","...k211kk112k...","...kkkkkkkkkk...","................"],
 skel:["................",".....kkkkkk.....","....kwwwwwwk....","....kkewwekk....","....kwwwwwwk....",
  ".....kwkwkwk....","......kkkk......","....kwwwwwwk....","...kwkwwwwkwk...","...kwkkwwkkwk...",
  "...kwkwwwwkwk...","..kwk.kwwk.kwk..",".....kwkkwk.....",".....kwk..kwk...","....kwwk..kwwk..","....kkkk..kkkk.."],
 mage:[".......kk.......","......k11k......",".....k1111k.....","....k111111k....","....k1kkkk1k....",
  "....k1ekke1k....","....k1kkkk1k....","...k11k33k11k...","..k1111331111k..","..k1111331111k..",
  ".k111113311111k.",".k122111111221k.","k11111111111111k","k12121212121212k","kkkkkkkkkkkkkkkk","................"],
 ghost:["................","......kkkk......","....kk1111kk....","...k11111111k...","..k1111111111k..",
  "..k11kk11kk11k..","..k11ke11ek11k..","..k1111111111k..","..k1111221111k..","k1k1111111111k1k",
  ".kk1111111111kk.","...k1111111111k.","....k22111111k..",".....k2221k2k...","......kkk..k....","................"],
 knight:["................",".....kkkkkk.....","....k111111k....","....k1kkkk1k....","....k1keek1k....",
  "....k111111k....","..kkk122221kkk..",".k11k111111k11k.",".k12k113311k21k.",".k11k113311k11k.",
  ".kk2k111111k2kk.","...kk111111kk...","....k11kk11k....","....k11kk11k....","...kk22kk22kk...","...kkkkkkkkkk..."],
};
const monCache={};
function monSprite(id,alt){
  const key=id+(alt?'*':''); if(monCache[key]) return monCache[key];
  const d=MON[id]; const pal=Object.assign({k:'#140c18',w:'#f4f2ea',e:'#ff3040'},d.p,alt?d.p2:null);
  return monCache[key]=art(MSPR[d.s],pal,false);
}

/* 宝箱 */
const CHEST_C=["................","................","..kkkkkkkkkkkk..",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kooooooooooook.",
 ".kkkkkkyykkkkkk.",".kooookyykooook.",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kooooooooooook.",".kooooooooooook.",".kkkkkkkkkkkkkk.","................"];
const CHEST_O=["................","..kkkkkkkkkkkk..",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kkkkkkkkkkkkkk.",".kddddddddddddk.",
 ".kddddddddddddk.",".kooookyykooook.",".kooooooooooook.",".kyyyyyyyyyyyyk.",".kooooooooooook.",".kooooooooooook.",".kkkkkkkkkkkkkk.","................"];
const CPAL={k:'#2a160a',o:'#a8642c',y:'#f0c040',d:'#120a06'};
const chestClosed=art(CHEST_C,CPAL), chestOpen=art(CHEST_O,CPAL);

/* ---------- タイル ---------- */
function grass(g,seed){R(g,'#57a43c',0,0,16,16); const r=prng(seed);
  for(let i=0;i<5;i++){const x=(r()*13)|0,y=(r()*13)|0; R(g,'#3f8a33',x,y); R(g,'#3f8a33',x+1,y+1); R(g,'#3f8a33',x+2,y);}
  for(let i=0;i<4;i++) R(g,'#7cc25a',(r()*16)|0,(r()*16)|0);}
const TREE=["..kkkk..",".kGGGGk.","kGGgGGGk","kGgGGGGk","kGGGGgGk",".kGGGGk.","..kttk..","...tt..."];
const treeArt=art(TREE,{k:'#173f1d',G:'#2e7a34',g:'#62b04e',t:'#6b4423'});
function forest(g,seed){grass(g,seed); g.drawImage(treeArt,0,0); g.drawImage(treeArt,8,3); g.drawImage(treeArt,3,8);}
function mountain(g,snowy){grass(g,7); const cx=8;
  for(let y=1;y<16;y++){const hw=Math.min(8,Math.floor(y*0.55)+1);
    for(let x=cx-hw;x<cx+hw;x++){const right=x>=cx+Math.floor(hw/3);
      let col=right?'#7d5c3c':'#a67f56'; if(y<5&&snowy!==false) col=right?'#cdd5e2':'#f6f8fc'; R(g,col,x,y);}
    R(g,'#3b2a1b',cx-hw,y); R(g,'#3b2a1b',cx+hw-1,y);}
  R(g,'#3b2a1b',cx-1,0,2,1); R(g,'#5e4430',5,9,2,1); R(g,'#5e4430',9,12,3,1);}
function water(g,f){R(g,'#2b62c4',0,0,16,16); const o=f?3:0;
  for(const [x,y] of [[1,3],[9,6],[4,11],[11,13]]){R(g,'#6a9cf0',(x+o)%14,y,3,1); R(g,'#6a9cf0',(x+o+3)%14,y-1,2,1);}}

const handlers=[]; const held=[];
const pushH=f=>handlers.push(f);
const popH=f=>{const i=handlers.lastIndexOf(f); if(i>=0) handlers.splice(i,1);};
const isDir=b=>b==='up'||b==='down'||b==='left'||b==='right';
function press(b){
  audioInit();

}
function hold(b){if(isDir(b)&&!held.includes(b)) held.push(b);}
function release(b){const i=held.indexOf(b); if(i>=0) held.splice(i,1);}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',
  KeyZ:'a',Enter:'a',NumpadEnter:'a',Space:'a',KeyX:'b',Escape:'b',Backspace:'b',KeyM:'menu'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  const b=KEYMAP[e.code]; if(!b) return;
  e.preventDefault(); hold(b);
  if(!e.repeat||isDir(b)) press(b);
});
addEventListener('keyup',e=>{const b=KEYMAP[e.code]; if(b) release(b);});

const dpad=document.getElementById('dpad'); let dpadDir=null, repT=null;
function setDpad(d){
  if(d===dpadDir) return;
  if(dpadDir) release(dpadDir);
  clearInterval(repT); dpadDir=d; dpad.dataset.dir=d||'';
  if(d){hold(d); press(d); let n=0; repT=setInterval(()=>{if(++n>3&&handlers.length) press(d);},90);}
}
function dpadFrom(e){
  const r=dpad.getBoundingClientRect(); const x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
  if(Math.hypot(x,y)<12) return dpadDir;
  return Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up');
}
dpad.addEventListener('pointerdown',e=>{e.preventDefault(); dpad.setPointerCapture(e.pointerId); setDpad(dpadFrom(e));});
dpad.addEventListener('pointermove',e=>{if(dpadDir) setDpad(dpadFrom(e));});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dpad.addEventListener(t,()=>setDpad(null)));

const Snd={on:store.get('hoshikage-sound')!=='off',ac:null,master:null,want:null,cur:null,song:null,timer:null};

  if(Snd.master) Snd.master.gain.value=Snd.on?1:0; sndBtn.blur();});
function audioInit(){
  if(Snd.ac){if(Snd.ac.state==='suspended') Snd.ac.resume(); return;}
  try{Snd.ac=new (window.AudioContext||window.webkitAudioContext)(); Snd.master=Snd.ac.createGain();
    Snd.master.gain.value=Snd.on?1:0; Snd.master.connect(Snd.ac.destination);}catch(e){Snd.ac=null; return;}
  if(Snd.want){const w=Snd.want; Snd.cur=null; playBgm(w);}
}
function tone(f,t,dur,type='square',vol=.05){
  const a=Snd.ac; if(!a) return; const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.setValueAtTime(vol,t+dur*.6); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g); g.connect(Snd.master); o.start(t); o.stop(t+dur+.03);
}
function noise(t,dur,vol=.08){
  const a=Snd.ac; if(!a) return; const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), g=a.createGain(); s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(Snd.master); s.start(t);
}
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function freq(n){const m=n.match(/^([A-G][#b]?)(\d)$/); if(!m) return 0; return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]+1)*12-69)/12);}
function seq(str,unit){ // "C4 . E4 -" : '.' のばす, '-' やすみ
  const out=[]; let t=0, cur=null;
  for(const tok of str.replace(/\|/g,' ').trim().split(/\s+/)){
    if(tok==='.'){if(cur) cur.len+=unit;}
    else if(tok==='-'){cur=null;}
    else {cur={f:freq(tok),st:t,len:unit}; out.push(cur);}
    t+=unit;
  }
  return {ev:out,len:t};
}
function song(bpm,mel,bass,mw='square',bw='triangle',mv=.035,bv=.06){
  const m=seq(mel,1), b=seq(bass,2);
  const ev=[...m.ev.map(e=>({...e,w:mw,v:mv})),...b.ev.map(e=>({...e,w:bw,v:bv}))].sort((x,y)=>x.st-y.st);
  return {bpm,ev,len:Math.max(m.len,b.len)};
}

function playBgm(name){
  Snd.want=name; if(Snd.cur===name) return;
  stopBgm(); Snd.cur=name; Snd.want=name;
  if(!Snd.ac||!name||!SONGS[name]) return;
  Snd.song=SONGS[name]; Snd.t0=Snd.ac.currentTime+.08; Snd.ptr=0; Snd.loop=0;
  Snd.timer=setInterval(bgmTick,40); bgmTick();
}
function stopBgm(){clearInterval(Snd.timer); Snd.timer=null; Snd.song=null; Snd.cur=null;}
function bgmTick(){
  const s=Snd.song, a=Snd.ac; if(!s||!a) return; const step=60/s.bpm/2, loopDur=s.len*step;
  for(let guard=0;guard<64;guard++){
    const e=s.ev[Snd.ptr]; const t=Snd.t0+Snd.loop*loopDur+e.st*step;
    if(t>a.currentTime+.3) break;
    if(t>=a.currentTime-.02) tone(e.f,t,e.len*step*.92,e.w,e.v);
    if(++Snd.ptr>=s.ev.length){Snd.ptr=0; Snd.loop++;}
  }
}
function jingle(notes,unit=.11,type='square',vol=.05){
  const a=Snd.ac; if(!a) return 0; let t=a.currentTime+.02;
  for(const n of notes){const [nm,len=1]=n.split(':'); if(nm!=='-') tone(freq(nm),t,unit*len*.95,type,vol); t+=unit*len;}
  return (t-a.currentTime)*1000;
}

function win(cls,style,html){const d=document.createElement('div'); d.className='win '+(cls||''); Object.assign(d.style,style||{}); if(html!=null) d.innerHTML=html; ui.appendChild(d); return d;}
function msgClear(){msgEl.innerHTML='';}
function msgClose(){msgEl.hidden=true; msgClear();}
function waitKey(){return new Promise(res=>{const h=b=>{if(b==='a'||b==='b'){popH(h); res(b);}}; pushH(h);});}
function waitOrKey(ms){return new Promise(res=>{let done=false; const fin=()=>{if(done) return; done=true; popH(h); clearTimeout(t); res();};
  const h=b=>{if(b==='a'||b==='b') fin();}; pushH(h); const t=setTimeout(fin,ms);});}
async function say(text,opt={}){
  const wait=opt.wait||'key';
  msgEl.hidden=false;
  const p=document.createElement('p'); msgEl.appendChild(p);
  while(msgEl.querySelectorAll('p').length>10) msgEl.querySelector('p').remove();
  let skip=false; const h=b=>{if(b==='a'||b==='b') skip=true;}; pushH(h);
  for(let i=1;i<=text.length;i++){
    if(skip){p.textContent=text; break;}
    p.textContent=text.slice(0,i);
    if(i%3===0&&text[i-1]!==' ') sfx.blip();
    await sleep(opt.speed||22);
  }
  popH(h);
  if(wait==='key'){const m=document.createElement('span'); m.className='more'; m.textContent='▼'; msgEl.appendChild(m); await waitKey(); sfx.blip(); m.remove();}
  else if(wait==='auto') await waitOrKey(opt.ms||650);
}
async function lines(arr){msgClear(); for(const t of arr) await say(t); msgClose();}

class Menu{
  constructor(o){this.o=o; this.i=o.start||0; this.items=o.items; this.el=win('menu',o.style); this.render();}
  setItems(it){this.items=it; this.i=clamp(this.i,0,it.length-1); this.render();}
  render(){
    const o=this.o, cols=o.cols||1;
    let h=o.title?`<div class="wt">${o.title}</div>`:'';
    h+=`<div class="grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">`;
    this.items.forEach((it,k)=>{const x=typeof it==='string'?{label:it}:it;
      h+=`<div class="it${k===this.i?' sel':''}${x.disabled?' dis':''}"><span class="cur">${k===this.i?'▶':''}</span><span class="lb">${x.label}</span><span class="rt">${x.right??''}</span></div>`;});
    h+='</div>';
    if(o.desc){const d=o.desc(this.i); if(d) h+=`<div class="desc">${d}</div>`;}
    this.el.innerHTML=h; this.el.classList.toggle('active',!!this.active);
  }
  pick(){
    return new Promise(res=>{
      this.active=true; this.render(); const n=this.items.length, cols=this.o.cols||1;
      const h=b=>{
        let j=this.i;
        if(b==='up') j=(this.i-cols+n*cols)%n;
        else if(b==='down') j=(this.i+cols)%n;
        else if(b==='left'&&cols>1) j=(this.i-1+n)%n;
        else if(b==='right'&&cols>1) j=(this.i+1)%n;
        else if(b==='a'){popH(h); this.active=false; this.render(); sfx.ok(); res(this.i); return;}
        else if(b==='b'||b==='menu'){if(this.o.cancel===false) return; popH(h); this.active=false; this.render(); sfx.blip(); res(-1); return;}
        if(j!==this.i){this.i=j; sfx.blip(); this.render(); this.o.onMove&&this.o.onMove(j);}
      };
      pushH(h); this.o.onMove&&this.o.onMove(this.i);
    });
  }
  close(){this.el.remove();}
}
async function yesNo(){const m=new Menu({items:['はい','いいえ'],style:{right:'3%',bottom:'35%',width:'24%'}}); const c=await m.pick(); m.close(); return c===0;}

function fadeOut(ms=220){fadeEl.style.transitionDuration=ms+'ms'; fadeEl.style.opacity='1'; return sleep(ms+20);}
function fadeIn(ms=220){fadeEl.style.transitionDuration=ms+'ms'; fadeEl.style.opacity='0'; return sleep(ms+20);}
function shake(){if(reduceMotion) return; screenEl.classList.remove('shake'); void screenEl.offsetWidth; screenEl.classList.add('shake');}
let flashFx=null;
function flash(color,ms=180){flashFx={color,t0:performance.now(),ms};}

/* ---------- フィールド ---------- */
function curMap(){return MAPS[S.map];}
function tileAt(x,y){const m=curMap(); const r=m.rows[y]; if(!r||x<0||x>=r.length) return m.out; return r[x];}
function inBounds(x,y){const m=curMap(); return y>=0&&y<m.rows.length&&x>=0&&x<m.rows[y].length;}
function loadNPCs(){
  const m=curMap();
  npcs=(m.npcs||[]).filter(n=>!n.cond||n.cond()).map(n=>({...n,def:n,ox:n.x,oy:n.y,fx:n.x,fy:n.y,t:1,moving:false,wt:1000+Math.random()*2000}));
}
function npcAt(x,y){return npcs.find(n=>(n.x===x&&n.y===y)||(n.moving&&n.fx===x&&n.fy===y));}
function chestAt(x,y){return (curMap().chests||[]).find(c=>c.x===x&&c.y===y);}
function blocked(x,y){
  if(!inBounds(x,y)) return !curMap().edgeExit;
  if(SOLID.has(tileAt(x,y))) return true;
  if(npcAt(x,y)) return true;
  if(chestAt(x,y)) return true;
  return false;
}
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let lastBump=0;
function tryMove(d){
  P.dir=d; const [dx,dy]=DV[d]; const nx=P.x+dx, ny=P.y+dy;
  if(curMap().kind==='world'&&tileAt(nx,ny)==='K'&&!S.flags.opened){run(castleDoor); return;}
  if(!inBounds(nx,ny)&&curMap().edgeExit){run(exitToWorld); return;}
  if(blocked(nx,ny)){const n=performance.now(); if(n-lastBump>260){sfx.bump(); lastBump=n;} return;}
  P.fx=P.x; P.fy=P.y; P.x=nx; P.y=ny; P.t=0; P.moving=true;
}
async function run(fn){if(scripting) return; scripting=true; try{await fn();}finally{scripting=false;}}
function onStep(){
  const m=curMap(), t=tileAt(P.x,P.y);
  if(m.kind==='world'&&W_ICON[t]){run(()=>enterMap(W_ICON[t])); return;}
  if(t==='U'){run(exitToWorld); return;}
  if(m.enc){
    stepsSince++;
    const rate=ENC_RATE[t];
    if(rate&&stepsSince>4&&Math.random()<1/rate){
      const zone=m.enc(P.x,P.y); stepsSince=0;
      run(()=>battle(pickR(ENC[zone]),{area:m.kind==='world'?(t==='T'?'forest':t===':'?'beach':'field'):S.map}));
    }
  }
}
async function gotoMap(id,x,y,dir){
  sfx.stairs(); await fadeOut();
  S.map=id; P.x=x; P.y=y; P.dir=dir; P.moving=false; stepsSince=0; loadNPCs(); playBgm(curMap().bgm);
  await fadeIn(); toast(curMap().name);
}
async function enterMap(id){const m=MAPS[id]; await gotoMap(id,m.entry[0],m.entry[1],m.entry[2]);}
async function exitToWorld(){const m=curMap(); await gotoMap('world',m.world[0],m.world[1],'down');}
async function castleDoor(){
  msgClear();
  if(!has('key')){await say('おおきな とびらは ふしぎな ちからで かたく とざされている…'); msgClose(); return;}
  await say(`${S.name}は ほしのカギを とりだした！`);
  sfx.chest(); flash('#ffffff',300);
  await say('とびらが ゆっくりと ひらいていく…');
  S.flags.opened=1; msgClose(); await enterMap('castle');
}
function fieldPress(b){
  if(b==='menu'||b==='b'){run(fieldMenu); return;}
  if(b!=='a'||P.moving) return;
  const [dx,dy]=DV[P.dir]; let fx=P.x+dx, fy=P.y+dy;
  if(tileAt(fx,fy)==='c'){fx+=dx; fy+=dy;}
  const n=npcAt(fx,fy);
  if(n){run(async()=>{const back={up:'down',down:'up',left:'right',right:'left'}; if(!n.mon) n.dir=back[P.dir]; await n.talk(n); msgClose();}); return;}
  const c=chestAt(P.x+dx,P.y+dy);
  if(c){run(()=>openChest(c)); return;}
  run(async()=>{msgClear(); await say(`${S.name}は あしもとを しらべた。`,{wait:'auto',ms:300}); await say('しかし なにも みつからなかった。'); msgClose();});
}
async function openChest(c){
  msgClear();
  if(S.flags['ch_'+c.id]){await say('たからばこは からっぽだ。'); msgClose(); return;}
  S.flags['ch_'+c.id]=1; sfx.chest();
  await say(`${S.name}は たからばこを あけた！`,{wait:'auto',ms:400});
  if(c.gold){S.gold+=c.gold; await say(`${c.gold}ゴールドを てにいれた！`);}
  else{addItem(c.item); await say(`${IT[c.item].n}を てにいれた！`);
    if(c.item==='key') await say('ほしの もようが きざまれた ふしぎな カギだ。');}
  msgClose();
}
function updateField(dt){
  if(P.moving){P.t+=dt/170; if(P.t>=1){P.t=1; P.moving=false; onStep();}}
  if(!P.moving&&!scripting&&!handlers.length&&mode==='field'){
    const d=held[held.length-1]; if(d) tryMove(d);
  }
  for(const n of npcs){
    if(n.moving){n.t+=dt/260; if(n.t>=1){n.t=1; n.moving=false;}}
    else if(n.wander&&!scripting){
      n.wt-=dt; if(n.wt<=0){n.wt=1200+Math.random()*2200;
        const d=pickR(['up','down','left','right']); const [dx,dy]=DV[d]; const nx=n.x+dx, ny=n.y+dy; n.dir=d;
        if(Math.abs(nx-n.ox)<=2&&Math.abs(ny-n.oy)<=2&&inBounds(nx,ny)&&!SOLID.has(tileAt(nx,ny))&&!npcAt(nx,ny)&&!chestAt(nx,ny)&&tileAt(nx,ny)!=='+'
          &&!(nx===P.x&&ny===P.y)&&!(P.moving&&nx===P.fx&&ny===P.fy)){n.fx=n.x; n.fy=n.y; n.x=nx; n.y=ny; n.t=0; n.moving=true;}}
    }
  }
}
function drawField(now){
  const m=curMap(); const k=P.moving?P.t:1;
  const px=(P.fx+(P.x-P.fx)*k), py=(P.fy+(P.y-P.fy)*k);
  const pxx=P.moving?px:P.x, pyy=P.moving?py:P.y;
  const camX=Math.round(pxx*TS-(SW/2-8)), camY=Math.round(pyy*TS-(SH/2-8));
  const fr=Math.floor(now/500)%2;
  const x0=Math.floor(camX/TS), y0=Math.floor(camY/TS);
  for(let ty=y0;ty<=y0+VH+1;ty++) for(let tx=x0;tx<=x0+VW+1;tx++){
    const ch=tileAt(tx,ty); const t=TILES[ch]||TILES['.']; ctx.drawImage(t[ch==='~'||ch==='='?fr:0],tx*TS-camX,ty*TS-camY);
  }
  for(const c of (m.chests||[])) ctx.drawImage(S.flags['ch_'+c.id]?chestOpen:chestClosed,c.x*TS-camX,c.y*TS-camY+1);
  const walk=Math.floor(now/260)%2;
  const actors=npcs.map(n=>{const kk=n.moving?n.t:1; return {y:n.fy+(n.y-n.fy)*kk,x:n.fx+(n.x-n.fx)*kk,n};});
  actors.push({x:pxx,y:pyy,hero:1});
  actors.sort((a,b)=>a.y-b.y);
  for(const a of actors){
    const sx=Math.round(a.x*TS-camX), sy=Math.round(a.y*TS-camY);
    if(a.hero) ctx.drawImage(personSprite('hero',P.dir,walk),sx,sy-2);
    else if(a.n.mon){const sp=monSprite(a.n.mon); ctx.drawImage(sp,sx,sy-2+(walk?0:-1));}
    else ctx.drawImage(personSprite(a.n.pal,a.n.dir,a.n.wander||a.n.moving?walk:0),sx,sy-2);
  }
  if(m.dark){ // どうくつは まわりが くらい
    const g=ctx.createRadialGradient(SW/2,SH/2,30,SW/2,SH/2,120); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.72)');
    ctx.fillStyle=g; ctx.fillRect(0,0,SW,SH);
  }
}

async function fieldMenu(){
  showStatus({right:'3%',top:'3%',width:'26%'});
  const m=new Menu({items:['つよさ','どうぐ','じゅもん','そうび','セーブ'],style:{left:'3%',top:'3%',width:'30%'}});
  try{
    while(true){
      const c=await m.pick(); if(c<0) break;
      let r=null;
      if(c===0) await showStats();
      if(c===1) r=await bagMenu();
      if(c===2) r=await spellMenuField();
      if(c===3) await equipMenu();
      if(c===4){msgClear(); if(saveGame()) {sfx.ok(); await say('ぼうけんのしょに きろくしました。');} else await say('このブラウザでは きろくできませんでした。'); msgClose();}
      updStatus(); if(r==='warp') break;
    }
  } finally {m.close(); hideStatus(); msgClose();}
}

function bagList(filter){return Object.keys(S.items).filter(id=>!filter||filter(IT[id])).map(id=>({id,label:IT[id].n,right:IT[id].key?'':'×'+S.items[id]}));}
async function bagMenu(){
  const list=bagList(it=>!it.slot);
  if(!list.length){msgClear(); await say('どうぐを なにも もっていない。'); msgClose(); return;}
  const m=new Menu({items:list,style:{left:'20%',top:'8%',width:'60%'},title:'どうぐ',desc:i=>IT[list[i].id].d});
  try{
    while(true){
      const i=await m.pick(); if(i<0) return;
      const r=await useItemField(list[i].id); updStatus();
      if(r==='warp') return 'warp';
      const nl=bagList(it=>!it.slot); if(!nl.length) return; list.length=0; list.push(...nl); m.setItems(list);
    }
  } finally {m.close();}
}
async function useItemField(id){
  const it=IT[id]; msgClear();
  if(it.key){await say(it.d); msgClose(); return;}
  if(it.t==='heal'){
    if(S.hp>=S.mhp){await say('HPは もう まんたんだ。'); msgClose(); return;}
    delItem(id); const v=Math.min(rnd(...it.pow),S.mhp-S.hp); S.hp+=v; sfx.heal(); updStatus();
    await say(`${S.name}は ${it.n}を つかった！`,{wait:'auto',ms:350}); await say(`HPが ${v}ポイント かいふくした！`); msgClose(); return;
  }
  if(it.t==='mp'){
    if(S.mp>=S.mmp){await say('MPは もう まんたんだ。'); msgClose(); return;}
    delItem(id); const v=Math.min(rnd(...it.pow),S.mmp-S.mp); S.mp+=v; sfx.heal(); updStatus();
    await say(`${S.name}は ${it.n}を つかった！`,{wait:'auto',ms:350}); await say(`MPが ${v}ポイント かいふくした！`); msgClose(); return;
  }
  if(it.t==='return'){
    delItem(id); await say(`${S.name}は もどりのはねを そらに なげた！`,{wait:'auto'}); msgClose(); await warpHome(); return 'warp';
  }
  await say('いまは つかえない。'); msgClose();
}
async function warpHome(){
  sfx.magic(); flash('#ffffff',250); await sleep(200);
  await gotoMap('world',MAPS.village.world[0],MAPS.village.world[1]+1,'up');
}
async function spellMenuField(){
  const ks=learned();
  if(!ks.length){msgClear(); await say('まだ じゅもんを おぼえていない。'); msgClose(); return;}
  const items=ks.map(k=>({label:SP[k].n,right:SP[k].mp,disabled:!SP[k].field}));
  const m=new Menu({items,style:{left:'20%',top:'8%',width:'60%'},title:'じゅもん（しょうひMP）',desc:i=>SP[ks[i]].d});
  try{
    while(true){
      const i=await m.pick(); if(i<0) return;
      const sp=SP[ks[i]]; msgClear();
      if(!sp.field){await say('その じゅもんは せんとうで つかう じゅもんだ。'); msgClose(); continue;}
      if(S.mp<sp.mp){await say('MPが たりない！'); msgClose(); continue;}
      if(sp.t==='heal'&&S.hp>=S.mhp){await say('HPは もう まんたんだ。'); msgClose(); continue;}
      S.mp-=sp.mp; updStatus();
      await say(`${S.name}は ${sp.n}の じゅもんを となえた！`,{wait:'auto',ms:350});
      if(sp.t==='heal'){const v=Math.min(rnd(...sp.pow),S.mhp-S.hp); S.hp+=v; sfx.heal(); updStatus(); await say(`HPが ${v}ポイント かいふくした！`); msgClose();}
      if(sp.t==='return'){msgClose(); await warpHome(); return 'warp';}
    }
  } finally {m.close();}
}
async function equipMenu(){
  const slots=['w','a','s'];
  const lab=()=>slots.map(s=>({label:SLOTN[s],right:S.eq[s]?IT[S.eq[s]].n:'なし'}));
  const m=new Menu({items:lab(),style:{left:'14%',top:'8%',width:'72%'},title:'そうび',desc:()=>`こうげき ${atkOf()}　しゅび ${defOf()}`});
  try{
    while(true){
      const i=await m.pick(); if(i<0) return;
      const s=slots[i]; const own=Object.keys(S.items).filter(id=>IT[id].slot===s);
      const opts=[...own.map(id=>({id,label:IT[id].n,right:s==='w'?'こう+'+IT[id].atk:'しゅ+'+IT[id].def})),{id:null,label:'はずす',right:''}];
      const sub=new Menu({items:opts,style:{left:'24%',top:'30%',width:'64%'},title:SLOTN[s]+'を えらぶ'});
      const j=await sub.pick(); sub.close();
      if(j>=0){equip(opts[j].id,s); sfx.ok();}
      m.setItems(lab());
    }
  } finally {m.close();}
}
function equip(id,slot){
  slot=slot||IT[id].slot;
  if(S.eq[slot]) addItem(S.eq[slot]);
  S.eq[slot]=id||null; if(id) delItem(id);
}

/* ---------- 町の人・店・宿 ---------- */
async function inn(price,name){
  msgClear();
  await say(`${name}へ ようこそ。 ひとばん ${price}ゴールドですが おとまりに なりますか？`,{wait:'none'});
  const g=goldWin(); const ok=await yesNo();
  if(!ok){await say('またの おこしを おまちしております。'); g.remove(); msgClose(); return;}
  if(S.gold<price){await say('おや、 ゴールドが たりないようですね…'); g.remove(); msgClose(); return;}
  S.gold-=price; g.upd();
  await say('では ごゆっくり おやすみください。',{wait:'auto'});
  msgClose(); g.remove(); stopBgm(); await fadeOut(500);
  const ms=sfx.inn(); await sleep(Math.max(1200,ms||0));
  S.hp=S.mhp; S.mp=S.mmp; saveGame(); playBgm(curMap().bgm);
  await fadeIn(500);
  msgClear(); await say('おはようございます。 HPと MPが すっかり かいふくしました。');
  await say('（ぼうけんのしょに きろくしました）'); msgClose();
}
async function shop(goods,greet){
  msgClear(); await say(greet+' なにを なさいますか？',{wait:'none'});
  const g=goldWin({left:'3%',top:'33%',width:'27%',textAlign:'right'});
  const top=new Menu({items:['かう','うる','やめる'],style:{left:'3%',top:'3%',width:'27%'}});
  try{
    while(true){
      const c=await top.pick(); if(c<0||c===2) break;
      if(c===0) await shopBuy(goods,g); else await shopSell(g);
      msgClear(); await say('ほかにも なにか？',{wait:'none'});
    }
  } finally {top.close(); g.remove();}
  msgClear(); await say('ありがとうございました！'); msgClose();
}
function eqInfo(id){const it=IT[id]; if(!it.slot) return it.d||'';
  const cur=S.eq[it.slot]?IT[S.eq[it.slot]]:null; const v=it.slot==='w'?it.atk:it.def, cv=cur?(it.slot==='w'?cur.atk:cur.def):0;
  return `${SLOTN[it.slot]}：${it.slot==='w'?'こうげき':'しゅび'} +${v}（いまの そうびより ${v-cv>=0?'+':''}${v-cv}）`;}
async function shopBuy(goods,g){
  const m=new Menu({items:goods.map(id=>({label:IT[id].n,right:IT[id].price+'G'})),style:{left:'32%',top:'3%',right:'3%'},desc:i=>eqInfo(goods[i])});
  try{
    while(true){
      msgClear(); await say('どれに なさいますか？',{wait:'none'});
      const i=await m.pick(); if(i<0) return;
      const id=goods[i], it=IT[id]; msgClear();
      await say(`${it.n}ですね。 ${it.price}ゴールドに なりますが よろしいですか？`,{wait:'none'});
      if(!(await yesNo())) continue;
      if(S.gold<it.price){msgClear(); await say('おきゃくさん、 ゴールドが たりませんよ。'); continue;}
      S.gold-=it.price; addItem(id); g.upd(); sfx.buy();
      if(it.slot){msgClear(); await say('まいど！ いま ここで そうびして いきますか？',{wait:'none'});
        if(await yesNo()){equip(id); msgClear(); await say(`${S.name}は ${it.n}を そうびした！`);}}
      else{msgClear(); await say('まいど ありがとうございます！');}
    }
  } finally {m.close();}
}
async function shopSell(g){
  const mk=()=>bagList(it=>!it.key).map(x=>({...x,right:Math.floor((IT[x.id].price||0)/2)+'G'}));
  let list=mk();
  if(!list.length){msgClear(); await say('うれる ものを もっていないようですね。'); return;}
  const m=new Menu({items:list,style:{left:'32%',top:'3%',right:'3%'}});
  try{
    while(true){
      msgClear(); await say('どれを うって くれますか？',{wait:'none'});
      const i=await m.pick(); if(i<0) return;
      const id=list[i].id, p=Math.floor((IT[id].price||0)/2); msgClear();
      await say(`${IT[id].n}なら ${p}ゴールドで ひきとりましょう。 よろしいですか？`,{wait:'none'});
      if(!(await yesNo())) continue;
      delItem(id); S.gold+=p; g.upd(); sfx.buy();
      list=mk(); if(!list.length) return; m.setItems(list);
    }
  } finally {m.close();}
}

async function battle(ids,opt={}){
  await encounterFx(opt.boss);

  showStatus({left:'3%',top:'2.5%',width:'23%'});

  else await say('まものの むれが あらわれた！',{wait:'auto'});
  let res=null;
  while(!res){
    const cmd=await heroCommand();

    for(const a of order){

async function heroCommand(){
  msgClear(); msgEl.hidden=true;
  const enList=win('',{right:'3%',bottom:'3%',width:'47%',height:'30%'});
  const updList=()=>{enList.innerHTML=alive().map(e=>`<div>${e.label}</div>`).join('');};

  try{
    while(true){
      const c=await cm.pick(); B.lastCmd=c;
      if(c===0){const t=await pickTarget(); if(t>=0) return {t:'attack',target:t}; continue;}
      if(c===1){
        const ks=learned().filter(k=>SP[k].battle);
        if(!ks.length){enList.textContent='じゅもんを おぼえていない'; await sleep(700); updList(); continue;}
        const sm=new Menu({items:ks.map(k=>({label:SP[k].n,right:SP[k].mp,disabled:S.mp<SP[k].mp})),title:'じゅもん（MP）',style:{left:'28%',bottom:'3%',right:'3%'},desc:i=>SP[ks[i]].d});
        const i=await sm.pick(); sm.close(); if(i<0) continue;
        const sp=SP[ks[i]];

        if(sp.tg==='one'){const t=await pickTarget(); if(t<0) continue; return {t:'spell',k:ks[i],target:t};}
        return {t:'spell',k:ks[i]};
      }

  await m.pick(); m.close(); endUI.remove(); endUI=null;
  await fadeOut(500);
  mode='field'; S.map='village'; P.x=14; P.y=12; P.dir='up'; P.moving=false; loadNPCs(); playBgm('town'); saveGame();
  await fadeIn(500); toast('ミナモむら');
}

/* ---------- タイトル ---------- */
async function titleScreen(){
  mode='title'; playBgm('town');
  titleUI=document.createElement('div'); titleUI.className='title';
  titleUI.innerHTML='<div class="logo">ほしかげの剣</div><div class="sub">― きえた ほしの ものがたり ―</div><div class="foot">A：けってい　B：もどる</div>';
  ui.appendChild(titleUI);
  const sv=loadSave();
  const m=new Menu({items:[{label:'はじめから'},{label:'つづきから',disabled:!sv}],cancel:false,start:sv?1:0,style:{left:'50%',top:'56%',transform:'translateX(-50%)',width:'40%'}});
  let c;
  while(true){c=await m.pick(); if(c===1&&!sv){sfx.bump(); continue;} break;}
  m.close();
  if(c===1){
    titleUI.remove(); titleUI=null;
    await fadeOut(300);
    S=sv; S.flags=S.flags||{}; P.x=S.x; P.y=S.y; P.dir=S.dir||'down'; P.moving=false; mode='field'; loadNPCs(); playBgm(curMap().bgm);
    await fadeIn(300); toast(curMap().name||'フィールド');
    return;
  }
  const name=await askName();
  titleUI.remove(); titleUI=null;
  newGame(name); await fadeOut(400);
  mode='ending'; endStars=0; stopBgm(); await fadeIn(400);
  msgClear();
  await say('ある よる、 そらから すべての ほしが きえた。');
  await say('まおう ゾルガが ほしの ちからを やどす『ほしのたま』を うばったのだ。');
  await say(`ちいさな ミナモむらで くらす わかもの ${S.name}は、 むらの ちょうろうに よばれた…`);
  msgClose(); await fadeOut(500);
  scripting=true;
  try{
    mode='field'; P.x=S.x; P.y=S.y; P.dir=S.dir; P.moving=false; loadNPCs(); playBgm('town');
    await fadeIn(500); toast('ミナモむら');
    await elderTalk();
  } finally {scripting=false;}
}
function askName(){
  return new Promise(res=>{
    const w=win('namebox',{},'<div>なまえを いれてください</div><input id="hero-name" maxlength="6" value="ユウ" autocomplete="off" aria-label="ゆうしゃの なまえ"><button type="button" id="name-ok">けってい</button>');
    const inp=w.querySelector('input'), btn=w.querySelector('button');
    const done=()=>{const v=(inp.value||'').trim().slice(0,6)||'ユウ'; popH(h); w.remove(); sfx.ok(); res(v);};
    const h=b=>{if(b==='a') done();};
    pushH(h);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault(); done();}});
    btn.addEventListener('click',done);
    setTimeout(()=>{if(matchMedia('(pointer:fine)').matches) inp.focus();},50);
  });
}

/* ---------- メインループ ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last); last=now;
  if(mode==='field'&&S){updateField(dt); drawField(now);}
  else if(mode==='battle'&&B) drawBattle(now);
  else if(mode==='title') drawSky(now,stars.length);
  else if(mode==='ending') drawSky(now,endStars);
  if(flashFx){const k=(now-flashFx.t0)/flashFx.ms; if(k>=1) flashFx=null; else{ctx.save(); ctx.globalAlpha=(1-k)*.8; ctx.fillStyle=flashFx.color; ctx.fillRect(0,0,SW,SH); ctx.restore();}}
  requestAnimationFrame(frame);
}
defineObjects();
requestAnimationFrame(frame);
function start(){titleScreen();}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) try{hot.snapshot(()=>({}));}catch(e){}
if(hot&&hot.ready) hot.ready(start); else start();
window.__rpg={get busy(){return scripting||handlers.length>0}, get S(){return S}, P, MAPS, battle, gotoMap, press, get mode(){return mode}, expFor, MON, MSPR, PERSON};
</script>
